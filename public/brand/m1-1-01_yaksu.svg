<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="sans-serif">
  <style>
    /* 기본 상태 = 완성 장면 (애니메이션 미지원 환경에서도 온전히 보임)
       브라우저에서는 15초 루프 프레젠테이션으로 순차 등장 */
    .s1{animation:sh 15s linear infinite}
    .s2{animation:s2 15s linear infinite}
    .s3{animation:s3 15s linear infinite}
    .s4{animation:s4 15s linear infinite}
    .s5{animation:s5 15s linear infinite}
    .thread{stroke-dasharray:520;animation:wind 15s linear infinite}
    .boxsh{transform-box:fill-box;transform-origin:center;animation:shrink 15s ease-in-out infinite}
    .halfL{transform-box:fill-box;transform-origin:center;animation:hL 15s ease-in-out infinite}
    .halfR{transform-box:fill-box;transform-origin:center;animation:hR 15s ease-in-out infinite}
    .cut{animation:cut 15s linear infinite}
    .guide{stroke-dasharray:150;animation:gd 15s linear infinite}
    @keyframes sh{0%{opacity:0}2%,96%{opacity:1}100%{opacity:1}}
    @keyframes s2{0%,22%{opacity:0}26%,96%{opacity:1}100%{opacity:1}}
    @keyframes s3{0%,36%{opacity:0}40%,96%{opacity:1}100%{opacity:1}}
    @keyframes s4{0%,56%{opacity:0}60%,96%{opacity:1}100%{opacity:1}}
    @keyframes s5{0%,73%{opacity:0}77%,96%{opacity:1}100%{opacity:1}}
    @keyframes wind{0%,38%{stroke-dashoffset:520}52%,100%{stroke-dashoffset:0}}
    @keyframes shrink{0%,40%{transform:scale(1)}54%,100%{transform:scale(.8)}}
    @keyframes hL{0%,58%{transform:translateX(14px) rotate(0deg)}66%,100%{transform:translateX(0) rotate(-7deg)}}
    @keyframes hR{0%,58%{transform:translateX(-14px) rotate(0deg)}66%,100%{transform:translateX(0) rotate(7deg)}}
    @keyframes cut{0%,58%{opacity:0}61%{opacity:1}66%{opacity:0}96%{opacity:0}100%{opacity:0}}
    @keyframes gd{0%,80%{stroke-dashoffset:150}90%,100%{stroke-dashoffset:0}}
    text{user-select:none}
  </style>

  <rect x="1.5" y="1.5" width="757" height="557" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>

  <!-- ① 한자 분해 + 수식 관계 -->
  <g class="s1">
    <text x="235" y="92" text-anchor="middle" font-size="70" font-weight="800" fill="#1F2937">約</text>
    <text x="525" y="92" text-anchor="middle" font-size="70" font-weight="800" fill="#1F2937">數</text>
    <text x="235" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#D97706">줄일 약</text>
    <text x="525" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#64748B">셈 수</text>
  </g>
  <g class="s2">
    <path d="M 268 118 C 330 152, 430 152, 492 120" fill="none" stroke="#0D9488" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 492 120 l -15 3 l 8 13 z" fill="#0D9488"/>
    <text x="380" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#0D9488">約이 數를 꾸며요</text>
    <text x="380" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#0D9488">= "줄여 주는 수"</text>
  </g>

  <!-- ② 約의 어원: 실(糸)로 묶으면 부피가 준다 -->
  <g class="s3">
    <text x="185" y="242" text-anchor="middle" font-size="16.5" font-weight="800" fill="#1F2937">約 — 실(糸)로 <tspan fill="#0D9488">묶어서 줄이기</tspan></text>
    <g class="boxsh">
      <rect x="130" y="258" width="110" height="76" rx="8" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
    </g>
    <path class="thread" d="M 118 272 Q 185 258 252 272 Q 185 288 118 288 Q 185 274 252 296 Q 185 312 118 306 Q 185 296 252 318"
      fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round"/>
    <text x="185" y="360" text-anchor="middle" font-size="13.5" fill="#64748B">감을수록 꽉 — 부피가 줄어요</text>
    <rect x="112" y="372" width="146" height="24" rx="12" fill="#CCFBF1"/>
    <text x="185" y="388" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F766E">약속(約束)의 그 約!</text>
  </g>

  <!-- ③ 分 대비: 물리적으로 쪼개기 -->
  <g class="s4">
    <text x="575" y="242" text-anchor="middle" font-size="16.5" font-weight="800" fill="#1F2937">分 — 칼로 <tspan fill="#DC2626">쪼개기</tspan></text>
    <g class="halfL"><path d="M 512 258 h 56 l -10 76 h -46 z" fill="#FECACA" stroke="#DC2626" stroke-width="2.5"/></g>
    <g class="halfR"><path d="M 582 258 h 56 v 76 h -66 z" fill="#FECACA" stroke="#DC2626" stroke-width="2.5"/></g>
    <path class="cut" d="M 578 246 l -8 24 l 10 -6 l -9 26 l 11 -7 l -8 26" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <text x="575" y="360" text-anchor="middle" font-size="13.5" fill="#64748B">조각이 나뉘어요 — 개수가 늘어남</text>
  </g>

  <!-- ④ 約의 결정타: 값은 그대로, 모양만 — 약분 -->
  <g class="s5">
    <text x="380" y="432" text-anchor="middle" font-size="16.5" font-weight="800" fill="#1F2937">約은 <tspan fill="#0D9488">값은 그대로, 모양만 줄여요</tspan> — 약분 6/8 = 3/4</text>
    <!-- 6/8 막대 -->
    <g>
      <rect x="200" y="448" width="270" height="26" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
      <rect x="200" y="448" width="202.5" height="26" rx="5" fill="#99F6E4"/>
      <line x1="233.75" y1="448" x2="233.75" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="267.5" y1="448" x2="267.5" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="301.25" y1="448" x2="301.25" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="335" y1="448" x2="335" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="368.75" y1="448" x2="368.75" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="402.5" y1="448" x2="402.5" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="436.25" y1="448" x2="436.25" y2="474" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="490" y="467" font-size="16" font-weight="700" fill="#64748B">6/8</text>
    </g>
    <!-- 3/4 막대 (같은 폭!) -->
    <g>
      <rect x="200" y="486" width="270" height="26" rx="5" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
      <rect x="200" y="486" width="202.5" height="26" rx="5" fill="#5EEAD4"/>
      <line x1="267.5" y1="486" x2="267.5" y2="512" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="335" y1="486" x2="335" y2="512" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="402.5" y1="486" x2="402.5" y2="512" stroke="#0D9488" stroke-width="1.5"/>
      <text x="490" y="505" font-size="16" font-weight="800" fill="#0D9488">3/4</text>
    </g>
    <!-- 같은 크기 가이드 -->
    <line class="guide" x1="402.5" y1="442" x2="402.5" y2="518" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="560" y="482" font-size="13.5" font-weight="700" fill="#0D9488">색칠된 크기 똑같죠?</text>
    <text x="380" y="541" text-anchor="middle" font-size="13" fill="#64748B">칸만 줄었을 뿐(8칸→4칸), 양은 그대로 — 이게 '줄일 約'이에요</text>
  </g>
</svg>
