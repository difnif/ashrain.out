<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">
  <style>
    .g0{opacity:0;animation:kIn 13s linear infinite}
    .gL{animation:kSplitL 13s ease-in-out infinite}
    .gR{animation:kSplitR 13s ease-in-out infinite}
    .lab{opacity:0;animation:kLab 13s linear infinite}
    .arr{opacity:0;animation:kArr 13s linear infinite}
    .arrp{stroke-dasharray:230;stroke-dashoffset:230;animation:kDraw 13s linear infinite}
    .res{opacity:0;animation:kRes 13s linear infinite}
    .m1{opacity:0;animation:kM1 13s linear infinite}
    .m2{opacity:0;animation:kM2 13s linear infinite}
    .m3{opacity:0;animation:kM3 13s linear infinite}
    .dim68{animation:kDim 13s linear infinite}
    @keyframes kIn{0%{opacity:0}3%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kSplitL{0%,15%{transform:translateX(0)}25%{transform:translateX(-118px)}94%,100%{transform:translateX(-118px)}}
    @keyframes kSplitR{0%,15%{transform:translateX(0)}25%{transform:translateX(118px)}94%,100%{transform:translateX(118px)}}
    @keyframes kLab{0%,26%{opacity:0}30%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kArr{0%,35%{opacity:0}37%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kDraw{0%,35%{stroke-dashoffset:230}45%{stroke-dashoffset:0}94%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes kRes{0%,44%{opacity:0;transform:translateY(10px)}49%{opacity:1;transform:translateY(0)}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kM1{0%,53%{opacity:0}57%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kM2{0%,64%{opacity:0}68%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kM3{0%,75%{opacity:0}79%{opacity:1}94%{opacity:1}98%,100%{opacity:0}}
    @keyframes kDim{0%,84%{opacity:1}88%{opacity:.3}94%{opacity:.3}98%,100%{opacity:1}}
    text{user-select:none}
  </style>

  <!-- 패널 배경 -->
  <rect x="1.5" y="1.5" width="757" height="467" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>

  <!-- 1) 한자 등장 → 쪼개짐 -->
  <g class="g0">
    <g class="gL"><text x="345" y="118" text-anchor="middle" font-size="86" font-weight="800" fill="#1F2937">約</text></g>
    <g class="gR"><text x="425" y="118" text-anchor="middle" font-size="86" font-weight="800" fill="#1F2937">數</text></g>
  </g>

  <!-- 2) 글자별 뜻 -->
  <g class="lab">
    <text x="227" y="152" text-anchor="middle" font-size="21" font-weight="800" fill="#D97706">줄일 약</text>
    <text x="543" y="152" text-anchor="middle" font-size="21" font-weight="800" fill="#64748B">셈 수</text>
  </g>

  <!-- 3) 수식 화살표: 約이 數를 꾸며요 -->
  <g class="arr">
    <path class="arrp" d="M 260 165 C 320 205, 450 205, 512 168" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
    <path d="M 512 168 l -16 2 l 9 14 z" fill="#0D9488"/>
    <text x="385" y="218" text-anchor="middle" font-size="18" font-weight="700" fill="#0D9488">約이 數를 꾸며 줘요</text>
  </g>

  <!-- 4) 해석 -->
  <g class="res">
    <text x="380" y="262" text-anchor="middle" font-size="30" font-weight="800" fill="#0D9488">= "줄여 주는 수"</text>
  </g>

  <!-- 5) 일상어 미니 그림 -->
  <!-- 요약: 종이 3장 → 1장 -->
  <g class="m1">
    <rect x="76" y="306" width="34" height="44" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" transform="rotate(-8 93 328)"/>
    <rect x="92" y="302" width="34" height="44" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <rect x="108" y="306" width="34" height="44" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" transform="rotate(8 125 328)"/>
    <text x="163" y="332" font-size="20" fill="#64748B">→</text>
    <rect x="186" y="302" width="34" height="44" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
    <line x1="192" y1="314" x2="214" y2="314" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="192" y1="324" x2="214" y2="324" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="192" y1="334" x2="206" y2="334" stroke="#0D9488" stroke-width="2.5"/>
    <text x="148" y="382" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2937">요약 — 내용 줄이기</text>
  </g>

  <!-- 절약: 동전 4개 → 2개 -->
  <g class="m2">
    <circle cx="318" cy="318" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
    <circle cx="348" cy="318" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
    <g class="dim68">
      <circle cx="318" cy="345" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
      <circle cx="348" cy="345" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
    </g>
    <text x="318" y="324" text-anchor="middle" font-size="13" font-weight="800" fill="#B45309">₩</text>
    <text x="348" y="324" text-anchor="middle" font-size="13" font-weight="800" fill="#B45309">₩</text>
    <text x="333" y="382" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2937">절약 — 씀씀이 줄이기</text>
  </g>

  <!-- 약분: 6/8 → 3/4 -->
  <g class="m3">
    <g class="dim68">
      <text x="508" y="320" text-anchor="middle" font-size="25" font-weight="700" fill="#64748B">6</text>
      <line x1="490" y1="328" x2="526" y2="328" stroke="#64748B" stroke-width="2.5"/>
      <text x="508" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#64748B">8</text>
    </g>
    <text x="553" y="338" font-size="20" fill="#64748B">→</text>
    <text x="600" y="320" text-anchor="middle" font-size="25" font-weight="800" fill="#0D9488">3</text>
    <line x1="582" y1="328" x2="618" y2="328" stroke="#0D9488" stroke-width="3"/>
    <text x="600" y="352" text-anchor="middle" font-size="25" font-weight="800" fill="#0D9488">4</text>
    <text x="576" y="382" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2937">약분 — 분수 줄이기</text>
    <text x="576" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0D9488">(크기는 그대로, 모양만 간단히!)</text>
  </g>

  <!-- 하단 캡션 -->
  <g class="m3">
    <text x="380" y="443" text-anchor="middle" font-size="15" fill="#64748B">셋 다 약수(約數)의 '約' — 같은 글자예요</text>
  </g>
</svg>
