# 시그니처 프린트 원본(강사도구 보관함 — 비공개 버킷 teacher-tool) → Supabase Storage 공개 버킷 concept-sets 의 av/sig/<코드>/{problems,answers}.pdf
# (학생앱 · 교실 모니터 시청각 학습의 시그니처 프린트 해설 📄 「원본 프린트」 · 목록에서 꾹 눌러 「📄 프린트」가 받는 곳 — src/lib/sigprint.js)
#
# 언제 도나
#   ① 자동 — main 에 시그니처 프린트 목록(frames/index.js 의 prints · code)이나 이 스크립트가 바뀐 push 가 오면. PR 을 머지하는 순간이 곧 승인이다.
#   ② 매일 한 번 — 강사도구 보관함에 새로 등록한(또는 고친) 원본도 올라가게.
#   ③ 수동 — Actions 탭 → "push-sig-files" → Run workflow.
# 무엇을 하나
#   scripts/sig-files.mjs — 시그니처 프린트 코드마다 강사도구 표 tt_prints 의 문제지 · 정답 문서를 받아 .cf/av/sig/<코드>/ 에 둔다(보관함에 없는 코드는 건너뜀).
#   scripts/push-concept-files.mjs — 기본기 해설 PDF 와 같은 올리기(덮어쓰기 → 공개 주소로 다시 받아 sha256 확인).
#   PDF 는 저장소에 넣지 않는다(공개 저장소에는 프린트를 두지 않는다).
# 비밀: SUPABASE_URL, SUPABASE_SERVICE_KEY (push-av-files · push-concept-files 와 같은 것)
name: push-sig-files
on:
  push:
    branches: [main]
    paths:
      - "src/features/display/frames/index.js"
      - "scripts/sig-files.mjs"
      - "scripts/push-concept-files.mjs"
      - ".github/workflows/push-sig-files.yml"
  schedule:
    - cron: "37 18 * * *"          # 매일 03:37(한국 시각)
  workflow_dispatch:
concurrency: { group: push-sig-files, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 보관함 원본 받기 (문제지 · 정답)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sig-files.mjs --out .cf
      - name: Storage 에 올리기 + 공개 주소 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/push-concept-files.mjs .cf .cf/build-sig.json
