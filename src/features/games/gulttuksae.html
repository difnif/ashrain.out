  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, X = (x) => 14 + (x / 10) * (W - 28), Y = (y) => H - 14 - ((y + 1) / 13) * (H - 28);
  g.fillStyle = CV.field; g.fillRect(0, 0, W, H);
  g.strokeStyle = CV.line; g.lineWidth = 1; g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(10), Y(0)); g.moveTo(X(0), Y(-1)); g.lineTo(X(0), Y(12)); g.stroke();
  const f = (k, x) => k[0] * (x - k[1]) ** 2 + k[2];
  const curve = (k, color, w, alpha) => { g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = w; g.beginPath(); let pen = false; for (let i = 0; i <= 200; i++){ const x = i / 20, y = f(k, x); if (y < -1 || y > 12.2){ pen = false; continue; } pen ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)); pen = true; } g.stroke(); g.globalAlpha = 1; };
  const past = SAVE.runs.slice(1, 9).map((r0) => r0.coef).filter((k) => Array.isArray(k));
  past.forEach((k) => curve(k, CV.muted, 1.2, 0.45));
  curve(coef, CV.accent, 3, 1);
  let meets = 0;
  past.forEach((k) => {
    const A = coef[0] - k[0], B = -2 * (coef[0] * coef[1] - k[0] * k[1]), C = coef[0] * coef[1] ** 2 - k[0] * k[1] ** 2 + coef[2] - k[2];
    const roots = Math.abs(A) < 1e-9 ? (Math.abs(B) < 1e-9 ? [] : [-C / B]) : (() => { const D = B * B - 4 * A * C; return D < 0 ? [] : [(-B + Math.sqrt(D)) / (2 * A), (-B - Math.sqrt(D)) / (2 * A)]; })();
    roots.filter((x) => x >= 0 && x <= 10).forEach((x) => { const y = f(coef, x); if (y < -1 || y > 12) return; meets++; g.beginPath(); g.arc(X(x), Y(y), 4.5, 0, Math.PI * 2); g.fillStyle = CV.gold; g.fill(); });
  });
  $('spaceNote').textContent = `y = ${fmtN(coef[0])}(x − ${fmtN(coef[1])})² + ${fmtN(coef[2])} — a는 묻는 방식, b는 근거 태도, c는 길 · 날씨 · 고유함에서 온다. ${past.length ? `지난 겨울의 곡선과 만나는 점 ${meets}개 — 2막에서 스페이스가 이어질 문.` : '다음 겨울부터 지난 곡선과 만나는 점(문)이 보인다.'}`;
}

/* ---------- 다듬기 패널 ---------- */
function openTune(){
  const rows = PARAM_DEFS.map(([g, list]) => `<div class="tgrp"><h3>${g}</h3>${list.map(([k, l]) => `<label class="trow ${PR[k] !== DEFAULTS[k] ? 'chg' : ''}"><span>${l}</span><input type="number" step="any" data-k="${k}" value="${PR[k]}"></label>`).join('')}</div>`).join('');
  const s = SELF();
  $('tuneBody').innerHTML = `<h2>다듬기</h2><p class="sub">숫자를 바꾸고 「적용」 — 저장되어 다음 겨울부터 쓰인다(소모 · 값 · 자아 세기는 지금 겨울에도 바로). 금빛 줄은 기본값과 다른 값.</p>
    <div class="tune">${rows}
      <div class="tgrp"><h3>자아 직접 놓기(시험용)</h3>
        <label class="trow"><span>A 어떻게(−1) ↔ 왜(+1)</span><input type="number" step="0.05" id="tA" value="${r2(s.A)}"></label>
        <label class="trow"><span>B 결단(−1) ↔ 신중(+1)</span><input type="number" step="0.05" id="tB" value="${r2(s.B)}"></label>
        <label class="trow"><span>C 기대기(−1) ↔ 맞서기(+1)</span><input type="number" step="0.05" id="tC" value="${r2(s.C)}"></label>
        <div class="acts"><button class="btn xs" id="tSelf" type="button">자아 적용</button><button class="btn xs" id="tSelf0" type="button">자아 처음으로</button></div></div>
    </div>
    <div class="sec"><h3>내보내기 · 가져오기(바꾼 값만)</h3><textarea class="io" id="tIO">${esc(JSON.stringify(SAVE.params))}</textarea>
      <div class="acts" style="margin-top:6px"><button class="btn xs" id="tImport" type="button">이 내용으로 가져오기</button></div><div class="err" id="tErr"></div></div>
    <div class="dlg-acts"><button class="btn" id="tReset" type="button">기본값으로</button><button class="btn" id="tClose" type="button">닫기</button><button class="btn primary" id="tApply" type="button">적용</button></div>`;
  $('tuneOv').hidden = false;
  const apply = (params) => { SAVE.params = params; PR = Object.assign({}, DEFAULTS, params); save(true); openTune(); toast('다듬은 값을 적용했다.', 'gold'); dirty.panel = dirty.hud = dirty.lobby = true; hudSig = ''; };
  $('tApply').onclick = () => {
    const p = {};
    $('tuneBody').querySelectorAll('[data-k]').forEach((el) => { const v = Number(el.value); if (isFinite(v) && v !== DEFAULTS[el.dataset.k]) p[el.dataset.k] = v; });
    apply(p);
  };
  $('tReset').onclick = () => apply({});
  $('tClose').onclick = () => { $('tuneOv').hidden = true; };
  $('tImport').onclick = () => {
    try { const p = JSON.parse($('tIO').value || '{}'); if (typeof p !== 'object' || Array.isArray(p)) throw 0;
      const clean = {}; Object.keys(p).forEach((k) => { if (k in DEFAULTS && isFinite(Number(p[k]))) clean[k] = Number(p[k]); }); apply(clean);
    } catch (e){ $('tErr').textContent = 'JSON으로 넣어 주세요 — 예: {"dayLen": 25}'; }
  };
  $('tSelf').onclick = () => { const s = SELF(); s.A = clamp(Number($('tA').value) || 0, -1, 1); s.B = clamp(Number($('tB').value) || 0, -1, 1); s.C = clamp(Number($('tC').value) || 0, -1, 1); updateName(); save(true); openTune(); dirty.lobby = dirty.panel = true; hudSig = ''; };
  $('tSelf0').onclick = () => { SAVE.self = { A:0, B:0, C:0, lens:{}, name:'wren', centerDays:0 }; save(true); openTune(); dirty.lobby = dirty.panel = true; hudSig = ''; };
}

/* ---------- 도움말 ---------- */
function openHelp(){
  $('helpBody').innerHTML = `<h2>굴뚝새 — 이렇게 건넌다</h2>
    <div class="sumgrid">
      <div class="sumbox"><h3>한 판 = 한 계절</h3><p class="note">벌판 입구에서 봄 나루까지. 난이도는 따로 없다 — 같은 벌판에서 무엇을 묻느냐가 길을 바꾼다. 길마다 조우(산 · 나루 · 강 · 마을 · 숲)가 있고, 조우마다 결정이 있다. 안개 너머는 가 봐야 보인다. 계절(${PR.seasonDays}일)이 끝나기 전에 닿으면 이긴다.</p></div>
      <div class="sumbox"><h3>시계는 멈추지 않는다</h3><p class="note">하루 = 1턴, 실시간으로 흐른다(1× · 2× · 4×). 지도 위로 새벽 · 낮 · 해 질 녘 · 밤이 지나가고, 해와 달이 시계다. 하루마다 식량 · 연료가 줄고 사건이 다가온다. 멈추면 근거와 문항이 가려진다.</p></div>
      <div class="sumbox"><h3>근거는 친절해질 수 있다</h3><p class="note">날것 → 정리 → 해설 → 방대. 다듬을수록 시간과 정성이 든다. 대신 문항을 풀어 날것을 직접 읽어 내면 시간을 아낀다 — 실력이 친절도를 대신한다.</p></div>
      <div class="sumbox"><h3>무엇을 물을지 고른다</h3><p class="note">렌즈(수학 · 과학 · 고사 · 역사 · 생활) × 형식(무엇? · 어떻게? · 왜?). 어떻게?는 지금을, 왜?는 다음을 바꾼다(그 렌즈는 다음부터 해설로 시작). 답은 직접 넣는다.</p></div>
      <div class="sumbox"><h3>정답은 길, 오답은 날씨</h3><p class="note">맞히면 그 렌즈에 길이 나 다음 같은 조우에서 처음부터 읽힌다. 틀리면 오개념 돌풍이 되어 같은 조우의 성공률을 깎는다 — 다시 물으면 걷힌다.</p></div>
      <div class="sumbox"><h3>결정의 막대</h3><p class="note">성공률은 폭으로 보인다. 근거가 단단할수록 폭이 좁아지고 성공률도 오른다. 언제 정할지가 타이밍이다.</p></div>
      <div class="sumbox"><h3>독수리(AI)</h3><p class="note">언제나 가장 친절한 근거를 바로 준다. 대신 고유함이 닳고 그 렌즈는 굳는다. 독수리는 가끔 앞의 자리를 먼저 굳혀 버린다 — 깨우려면 왜?를 물어야 한다.</p></div>
      <div class="sumbox"><h3>새 떼 — 징조</h3><p class="note">지도 위를 지나가는 새 떼를 눌러 잡는다. 남쪽으로 가는 까마귀 떼는 한겨울의 예고(미리 알면 연료가 덜 든다), 육지로 몰려드는 갈매기는 풍랑, 우는 까치는 길조. 둘레의 테가 다 닳기 전에. 한겨울엔 모든 것이 멈추고 질문만 남는다.</p></div>
      <div class="sumbox"><h3>일행</h3><p class="note">길잡이는 어떻게?, 아이는 왜?, 할머니는 고사 · 역사, 장꾼은 수학 · 생활 — 조우마다 두 사람이 말을 건넨다. 그 말이 무엇을 물을지 귀띔한다.</p></div>
      <div class="sumbox"><h3>자아</h3><p class="note">묻는 방식(어떻게 ↔ 왜)과 근거 태도(결단 ↔ 신중)가 플레이로 쌓여 제비 · 올빼미 · 까치 · 두루미 · 굴뚝새가 된다. 자아마다 질문 값을 치르는 자원과 소모 속도가 다르다. 자아는 겨울을 넘어 이어진다.</p></div>
    </div>
    <div class="dlg-acts"><button class="btn primary" id="hClose" type="button">알겠다</button></div>`;
  $('helpOv').hidden = false;
  if (S && screen === 'game' && !paused){ setPaused(true); $('helpOv').dataset.resume = '1'; }
  $('hClose').onclick = () => { $('helpOv').hidden = true; if ($('helpOv').dataset.resume){ delete $('helpOv').dataset.resume; setPaused(false); } };
}

/* ---------- 부모 창 메시지 ---------- */
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'ash-theme' && (d.theme === 'light' || d.theme === 'dark')){ document.documentElement.dataset.theme = d.theme; readColors(); hudSig = ''; }
  if (d.type === 'ash-store' && d.key === SAVE_KEY){ if (!S) mergeSave(d.data); else if (d.data && d.data.v === 1 && !SAVE.runs.length) mergeSave(Object.assign({}, d.data, { cur:SAVE.cur })); }
});
document.addEventListener('fullscreenchange', () => { requestAnimationFrame(() => { layoutMap(); measureHud(); }); });

/* ---------- 고리 ---------- */
let lastT = nowMs(), lastPanel = 0;
function frame(){
  const t = nowMs(), dtMs = Math.min(250, t - lastT); lastT = t;
  if (screen === 'game' && S && !S.over && !paused){
    const dayMs = PR.dayLen * 1000;
    tick(dtMs / dayMs * S.speed * DBG_MUL);
  }
  if (screen === 'lobby'){ if (dirty.lobby) renderLobby(); heroStep(t); }
  if (screen === 'game' && S){
    resPops();
    renderHud();
    if (t - lastPanel > 120){
      const sg = computePanelSig();
      if (dirty.panel || sg !== panelSig){ panelSig = sg; renderPanel(); }
      lastPanel = t;
    }
    livePanel(); updateProbClock();
    drawMap(t); narrStep(t, dtMs);
  }
  requestAnimationFrame(frame);
}
readColors(); loadSave(); renderLobby(); requestAnimationFrame(frame);
const themeObs = new MutationObserver(() => readColors());
themeObs.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

/* ---------- 시험 갈고리 ---------- */
window.__gulttuksae = () => {
  const out = { screen, paused, self:Object.assign({}, SELF(), { label:selfLabel(), sig:Object.fromEntries(QUADS.map((q) => [q, r2(sigRaw(q))])) }),
    runs:SAVE.runs.length, resume:!!SAVE.cur, params:Object.assign({}, PR), signs:SIGNS.length };
  if (!S) return out;
  Object.assign(out, { day:r2(S.day), speed:S.speed, mode:S.mode, at:{ col:node(S.at).col, type:node(S.at).type }, res:Object.fromEntries(Object.entries(S.res).map(([k, v]) => [k, r2(v)])),
    roads:S.roads.length, weathers:S.weathers.map((w) => ({ id:w.id, type:w.type, lens:w.lens, str:w.str })), winter:Object.assign({}, S.winter), polya:JSON.parse(JSON.stringify(S.polya)),
    over:S.over, next:S.mode === 'route' ? node(S.at).next.map((k) => ({ id:k, type:node(k).type, fossil:node(k).fossil, days:routeDays(k) })) : null,
    travel:S.travel ? { to:node(S.travel.to).type, days:S.travel.days, done:r2(S.travel.done) } : null, busy:S.busy ? { text:S.busy.text, left:r2(S.busy.until - S.day) } : null, stats:S.stats, prep:!!S.prep,
    rates:Object.fromEntries(Object.entries(rates()).map(([k, v]) => [k, r2(v)])),
    story:S.story.length, lastStory:(S.story[S.story.length - 1] || {}).t || '', tod:TOD(S.day), fx:FX.map((f) => f.kind), narr:NC ? NC.t : '', narrQ:NQ.length });
  if (S.enc){
    const E = S.enc;
    out.enc = { type:E.type, fossil:!!E.fossil, stormKnown:!!E.stormKnown, pieces:E.pieces ? E.pieces.map((p) => ({ lens:p.lens, form:p.form, done:p.done })) : null,
      lenses:Object.fromEntries(Object.entries(E.lenses || {}).map(([L, st]) => [L, { E:st.E, I:st.I, asked:st.asked, ai:st.ai, up:!!st.up, q:r2(lensQ(L)) }])) };
    if (!E.fossil && E.type !== 'start' && ENC[E.type].opts) out.enc.opts = ENC[E.type].opts.map((o) => { const c = optCalc(o); return { id:o.id, p:r2(c.p), lo:r2(c.lo), hi:r2(c.hi) }; });
    if (!E.fossil && E.type !== 'start') out.enc.costs = Object.fromEntries(['what', 'how', 'why'].map((f) => [f, qCost(f, ENC[E.type].lenses[0], E.type)]));
  }
  if (PB) out.problem = { kind:PB.ctx.kind, lens:PB.ctx.lens, form:PB.ctx.form, type:PB.prob.kind, done:!!PB.done, ok:PB.done ? PB.done.ok : null };
  return out;
};
window.__gtDebug = {
  answer(ok){
    if (!PB || PB.done) return false;
    const p = PB.prob;
    if (p.kind === 'choice'){ const i = ok ? p.correct : (p.correct + 1) % p.options.length; $('pCh').querySelectorAll('[data-i]')[i].click(); }
    else if (p.kind === 'num'){ $('pA').value = ok ? String(Math.round(p.ans * 1000) / 1000) : String(p.ans + 7); }
    else { $('pA').value = ok ? String(p.a) : String(p.a + 3); $('pB').value = String(p.b); }
    $('pOk').click(); return true;
  },
  next(){ const n = $('pNext'); if (n) n.click(); },
  setSelf(A, B, C){ const s = SELF(); s.A = A; s.B = B; if (C !== undefined) s.C = C; updateName(); dirty.panel = true; hudSig = ''; return s.name; },
  setRes(k, v){ if (S) S.res[k] = v; hudSig = ''; },
  mul(x){ DBG_MUL = x; },
  jump(days){ if (!S) return; let left = days; while (left > 0 && !S.over){ const d = Math.min(0.05, left); tick(d); left -= d; } dirty.panel = true; },
  spawnSign(kind){ if (S) spawnSign(kind); return SIGNS.length; },
  catchSign(){ const sg = SIGNS[SIGNS.length - 1]; if (sg) catchSign(sg); return !!sg; },
  signRel(){ const sg = SIGNS[SIGNS.length - 1]; if (!sg) return null; const [x, y] = signPos(sg, nowMs()); return { x:Math.round(x), y:Math.round(y) }; },
  lum(x0, y0, x1, y1){ const c = $('map'), g = c.getContext('2d'), d = DPR, w = Math.max(1, Math.round((x1 - x0) * d)), h = Math.max(1, Math.round((y1 - y0) * d));
    const px = g.getImageData(Math.round(x0 * d), Math.round(y0 * d), w, h).data; let t = 0, n = 0; for (let i = 0; i < px.length; i += 16){ t += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++; } return n ? t / n : 0; },
  heroLum(){ const c = $('hero'), g = c.getContext('2d'), px = g.getImageData(0, 0, c.width, c.height).data; let a = 0; for (let i = 3; i < px.length; i += 40) a += px[i]; return a / (px.length / 40); },
  nodeRel(id){ const [x, y] = nxy(node(id)); return { x:Math.round(x), y:Math.round(y) }; },
  parse(s){ return parseNum(s); },
  forceWinter(){ if (S){ S.winter.start = S.day + 0.01; } },
  fossilNext(){ if (S){ S.nextFossil = S.day; } },
  setDay(d){ if (S) S.day = d; },
  state(){ return S; },
};

})();
