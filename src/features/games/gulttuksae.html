<!--
  무제 v4 (예전 이름 굴뚝새) — 나 혼자인 땅의 겨울 · 그림책(1막 스페이스, 베타). 한 장짜리 HTML, 바깥 의존은 구글 폰트뿐.
  앱에서는 시록고(강사앱) #/games(src/apps/seirocco/pages/Games.jsx)가 샌드박스 iframe 으로 띄운다.
  · 테마: <html data-theme> + postMessage({ type: "ash-theme" }) · 전체 화면: Fullscreen API, 막히면 { type: "ash-immersive", on }
  · 저장: 샌드박스라 localStorage 를 못 쓰면 부모에게 { type: "ash-store-get" | "ash-store-set", key: "gulttuksae", data } 로 맡긴다(20KB 까지).
  · window.__gulttuksae() — 스모크 테스트가 읽는 상태 요약, window.__gtDebug — 시험용 갈고리.
  표지(천 공책, 쪽지에 '무제') → 첫 장에 '이름' 한 줄(닉네임처럼 적지만 이 땅의 이름이 된다) → 빈 종이에 움막과 내가 생긴다.
  처음엔 아무것도 알려 주지 않는다 — 걷고(누르기 · 긋기), 지도를 당겨 보고 옮기고(두 손가락 · 휠), 공책에 적을 수 있을 뿐.
  공책에 적은 낱말이 하나씩 연다: 숫자 · 기록 쪽 · 장치(눈 속 가지 · 얼음 재기 · 물결과 낚시) · 헝겊과 바람막이 · 새 잡기.
  물음으로 적으면 기록을 풀어 보인다. 장치마다 숨은 규칙(비율 · 일차함수 · 주기 · 바람 그늘 · 산의 기울기)이 있고, 해 보면서 찾아낸다.
  설계 문서: 프로젝트 claude/굴뚝새.md(강사용 숨은 규칙 메모 포함)
-->

<style>

<script>
'use strict';
(function(){
/* =================== 3-core: 도구 · 종이 · 먹 · 물감 · 그림 조각 · 소리 =================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const nowMs = () => performance.now();
const $ = (id) => document.getElementById(id);
function mulberry(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashS(s){ let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const fmtN = (x) => { const v = Math.round(x * 10) / 10; return (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1)); };
function hexA(h, a){ const n = parseInt(String(h).slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function mixHex(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const m = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, t)); return `rgb(${m(16)},${m(8)},${m(0)})`; }

/* ---------- 빛깔 — 낮의 종이 · 밤의 종이 ---------- */
const PAL_L = {
  desk0:'#2A231E', desk1:'#3B3029', paper:'#F3EDE1', paperBack:'#EDE5D6', fiber:'rgba(120,98,66,', vig:'rgba(96,74,46,.16)',
  ink:'#2F2924', snowSh:'#C6D1DA', snowSh2:'#AEBCC8', grass:'#B9A77A',
  furze:'#5E6B37', furze2:'#46532A', bloom:'#E2AE32', pine:'#3D5946', pine2:'#2C4536', trunk:'#6E5138',
  river:'#A8C2CF', ice:'#E4EDF2', iceThin:'#7F98A8', sea:'#7896A8', sea2:'#56768B', foam:'rgba(255,255,255,.85)', sand:'#D9C9A5',
  mount:'#B3BDC6', mount2:'#8E9CA9', roof:'#B25A3B', wall:'#EAD9BD', wood:'#8B6643', grain:'#D7B158', stone:'#9C978F', stone2:'#7B766E',
  blossom:'#E79AB3', blossom2:'#F4C6D4', spring:'#9DBB78',
  night:'#2B3456', warm:'255,212,138', dawn:'244,176,160', dusk:'236,158,104', glow:'255,196,108', smoke:'#9AA3AB',
  calm:'#A7CADB', swell:'#7E97A8', storm:'#3C4862', lantern:'#F0B43C', frost:'rgba(255,255,255,', shadow:'rgba(40,30,20,.16)',
  cloth:'#3A4046', cloth2:'#2E3338', label:'#F1ECE2', band:'#1D2023', pencil:'#5C5650',
};
const PAL_D = {
  desk0:'#0B0C0E', desk1:'#15171A', paper:'#20262D', paperBack:'#262C34', fiber:'rgba(220,210,190,', vig:'rgba(0,0,0,.38)',
  ink:'#E0D8C8', snowSh:'#2F3A46', snowSh2:'#3B4856', grass:'#6E6650',
  furze:'#4E5C30', furze2:'#3B4724', bloom:'#C89A2E', pine:'#2F4A3B', pine2:'#243A2E', trunk:'#5B4430',
  river:'#3E5A6A', ice:'#5B7383', iceThin:'#2A3B47', sea:'#35566B', sea2:'#26425A', foam:'rgba(210,228,240,.55)', sand:'#5B5141',
  mount:'#46525E', mount2:'#36424E', roof:'#8E4429', wall:'#4A4236', wood:'#7A5A3B', grain:'#B8954A', stone:'#6A665F', stone2:'#55514B',
  blossom:'#C27A93', blossom2:'#D79AB0', spring:'#6E8B55',
  night:'#3A4570', warm:'255,196,120', dawn:'230,150,140', dusk:'220,140,90', glow:'255,186,96', smoke:'#6C757D',
  calm:'#5E8BA3', swell:'#4B6475', storm:'#1E2638', lantern:'#E9A92F', frost:'rgba(190,214,236,', shadow:'rgba(0,0,0,.35)',
  cloth:'#4A5058', cloth2:'#3C4148', label:'#E6E0D4', band:'#16181B', pencil:'#B9B1A4',
};
let PAL = PAL_L;
const isDark = () => PAL === PAL_D;
// 다섯 자아의 빛깔 — 이름은 끝 장에만 나온다
const SELVES = {
  wren:{ name:'굴뚝새', color:'#A0703F' }, swallow:{ name:'제비', color:'#2C6A8A' }, owl:{ name:'올빼미', color:'#7A5C9E' },
  magpie:{ name:'까치', color:'#2E7D74' }, crane:{ name:'두루미', color:'#B8433A' },
};

/* ---------- 쪽 · 그림판 좌표 ---------- */
// 화면 = 펼친 책 한 쪽(P). 세상은 그 안의 일정한 비율 그림판(Wr, 가로 : 세로 = WA)에 그린다 — 어떤 기기든 같은 세상.
const WA = 1.45;
let W = 0, H = 0, DPR = 1, CDPR = 1, K = 800;
const P = { x:0, y:0, w:0, h:0 }, Wr = { x:0, y:0, w:0, h:0 };
// 보는 눈(카메라) — z 배로 당겨 본다. (ox, oy) = 그림판(Wr)의 왼쪽 위에 세상의 어디가 오나.
// 당겨 보면 세상은 그림판을 넘어 보이는 자리(VR = 위의 작은 그림들 아래의 쪽 전체)까지 찬다.
const CAM = { z:1, ox:0, oy:0, movedAt:0 }, VR = { x:0, y:0, w:0, h:0 };
const X = (u) => Wr.x + (u - CAM.ox) * CAM.z * Wr.w, Y = (v) => Wr.y + (v - CAM.oy) * CAM.z * Wr.h;
const U = (x) => CAM.ox + (x - Wr.x) / (CAM.z * Wr.w), V = (y) => CAM.oy + (y - Wr.y) / (CAM.z * Wr.h);
const ZMIN = 1;
const zFill = () => Math.max(1, VR.w / Math.max(1, Wr.w), VR.h / Math.max(1, Wr.h));   // 보이는 자리를 꽉 채우는 배율
const zMax = () => Math.max(4, zFill() * 2.2);
function camClamp(){
  CAM.z = clamp(CAM.z, ZMIN, zMax());
  const ww = Wr.w * CAM.z, wh = Wr.h * CAM.z;
  // 세상이 보이는 자리보다 작으면 가운데, 크면 가장자리가 안쪽으로 들어오지 않게
  CAM.ox = ww <= VR.w + 0.5 ? (Wr.x - (VR.x + (VR.w - ww) / 2)) / ww : clamp(CAM.ox, (Wr.x - VR.x) / ww, (Wr.x - VR.x - VR.w) / ww + 1);
  CAM.oy = wh <= VR.h + 0.5 ? (Wr.y - (VR.y + (VR.h - wh) / 2)) / wh : clamp(CAM.oy, (Wr.y - VR.y) / wh, (Wr.y - VR.y - VR.h) / wh + 1);
}
// 화면의 (x, y)를 붙든 채 z 배로
function camZoomAt(x, y, z){ const u = U(x), v = V(y); CAM.z = clamp(z, ZMIN, zMax()); CAM.ox = u - (x - Wr.x) / (CAM.z * Wr.w); CAM.oy = v - (y - Wr.y) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); }
// 보이는 자리의 가운데에 (u, v)가 오게
function camCenter(u, v, z){ if (z) CAM.z = clamp(z, ZMIN, zMax()); CAM.ox = u - (VR.x + VR.w / 2 - Wr.x) / (CAM.z * Wr.w); CAM.oy = v - (VR.y + VR.h / 2 - Wr.y) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); }
const camMid = () => ({ u:U(VR.x + VR.w / 2), v:V(VR.y + VR.h / 2) });
const dist = (a, b) => Math.hypot(a.u - b.u, (a.v - b.v) / WA);      // 그림판 너비 = 1

/* ---------- 먹선 · 물감 ---------- */
const mid = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });
function smoothPath(g, pts, closed){
  const n = pts.length; if (n < 2) return;
  g.beginPath();
  if (closed){ let m = mid(pts[n - 1], pts[0]); g.moveTo(m.x, m.y); for (let i = 0; i < n; i++){ const p = pts[i], mm = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p.x, p.y, mm.x, mm.y); } g.closePath(); }
  else { g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n - 1; i++){ const mm = mid(pts[i], pts[i + 1]); g.quadraticCurveTo(pts[i].x, pts[i].y, mm.x, mm.y); } g.lineTo(pts[n - 1].x, pts[n - 1].y); }
}
const wob = (pts, amp, R) => pts.map((p) => ({ x:p.x + (R() - 0.5) * amp, y:p.y + (R() - 0.5) * amp }));
// 손으로 그은 듯 — 두 번 긋는다
function inkLine(g, pts, w, col, R, a){
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col;
  g.globalAlpha = a === undefined ? 1 : a; g.lineWidth = w; smoothPath(g, R ? wob(pts, w * 0.7, R) : pts); g.stroke();
  if (R){ g.globalAlpha = (a === undefined ? 1 : a) * 0.3; g.lineWidth = w * 0.55; smoothPath(g, wob(pts, w * 1.8, R)); g.stroke(); }
  g.globalAlpha = 1;
}
// 곧은 먹선(집 · 나무 · 상자) — 손 떨림만 조금
function inkPoly(g, pts, w, col, R, a, closed){
  const q = R ? wob(pts, w * 0.5, R) : pts;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = a === undefined ? 1 : a;
  g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); if (closed) g.closePath(); g.stroke();
  g.globalAlpha = 1;
}

/* ---------- 종이 ---------- */
function makePaper(w, h, dpr, col, seed){
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w * dpr)); c.height = Math.max(2, Math.round(h * dpr));
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = col; g.fillRect(0, 0, w, h);
  const R = mulberry(seed);
  for (let i = 0; i < 16; i++){ const x = R() * w, y = R() * h, r = 50 + R() * 180, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, PAL.fiber + '0.05)'); gr.addColorStop(1, PAL.fiber + '0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  g.lineWidth = 0.6;
  const n = Math.min(9000, Math.round(w * h / 240));
  for (let i = 0; i < n; i++){ const x = R() * w, y = R() * h, a = R() * TAU, l = 2 + R() * 7; g.strokeStyle = PAL.fiber + (0.04 + R() * 0.07).toFixed(3) + ')'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < n / 3; i++){ g.fillStyle = PAL.fiber + (0.05 + R() * 0.08).toFixed(3) + ')'; g.fillRect(R() * w, R() * h, 1, 1); }
  const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.38, w / 2, h / 2, Math.max(w, h) * 0.78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, PAL.vig); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  return c;
}

// 가시덤불(gorse) — 한겨울에도 노란 꽃이 몇 송이
function drawFurze(g, x, y, s, R, o){

  wash(g, x + s * 0.35, y - s * 0.3, s * 0.42, c1, 0.45, R, { sy:0.7, n:9, irr:0.5, layers:1, edge:false });

  g.strokeStyle = PAL.ink; g.lineWidth = Math.max(0.7, s * 0.05); g.globalAlpha = 0.65; g.lineCap = 'round';
  for (let i = 0; i < 14; i++){ const a = Math.PI * (1.02 + R() * 0.96), d = s * (0.65 + R() * 0.3), px = x + Math.cos(a) * d, py = y - s * 0.35 + Math.sin(a) * d * 0.72; g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * s * 0.22, py + Math.sin(a) * s * 0.22); g.stroke(); }

}
function drawPine(g, x, y, h, R, o){

// 둥지 — 땅을 파고 가시덤불을 덮은 움막(커러의 '둥지')
function drawNest(g, x, y, s, R, o){

// 새 — 굴뚝새 · 제비 · 올빼미 · 까치 · 두루미
function drawBird(g, kind, x, y, s, col){

    g.beginPath(); g.moveTo(-s * 0.3, -s * 0.42); g.lineTo(-s * 0.26, -s * 0.72); g.lineTo(-s * 0.1, -s * 0.52); g.fill();
    g.beginPath(); g.moveTo(s * 0.3, -s * 0.42); g.lineTo(s * 0.26, -s * 0.72); g.lineTo(s * 0.1, -s * 0.52); g.fill();
    g.fillStyle = PAL.paper; g.beginPath(); g.arc(-s * 0.13, -s * 0.3, s * 0.1, 0, TAU); g.arc(s * 0.13, -s * 0.3, s * 0.1, 0, TAU); g.fill();

/* ---------- 새 겨울 — 공책 한 권 ---------- */
function newSeason(name){
  const seed = (Math.random() * 2147483647) | 0;
  S = { v:4, seed, geo:geoOf(seed), name:String(name || '').trim().slice(0, 16) || '무제', day:0, speed:1, over:null,
    res:{ wood:PR.startWood, food:PR.startFood }, hungry:0, coldT:0, cold:false,
    me:{ u:HOME.u, v:HOME.v }, home:{ u:HOME.u, v:HOME.v, lee:false, seed:hashS('home' + seed), data:{} }, fences:[],
    stones:[], stars:{}, paths:[], walk:null, blocked:null, reveal:[], riverCrossed:false,
    signs:[], nextSign:2 + Math.random(), eagleNext:PR.eagleEvery ? PR.eagleEvery * (0.55 + Math.random() * 0.3) : 1e9, eagleSeen:false,
    forming:0, maskN:0,
    mw:{ start:PR.mwFrom + Math.random() * Math.max(0, PR.mwTo - PR.mwFrom), len:PR.mwLen, on:false, known:false, done:false },
    notes:{ memos:[], noted:{}, asked:{}, q:0, last:null },
    logs:{ res:[], wind:[], birds:[], lastRes:-1, lastWind:-1 },
    stats:{ probes:0, commits:0, eagle:0, pulls:0, good:0, brushes:0, drills:0, waits:0, reads:0, casts:0, fences:0, signs:0, missed:0, paths:0, walked:0, memos:0, questions:0, rag:0 },
    seen:{} };
  buildWorld(seed);
  S.home.lee = leeOf(S.home);
  S.reveal.push({ u:HOME.u, v:HOME.v, r:0.13 });
  return S;
}

/* ---------- 자아 — 고르지 않고 쌓인다 ---------- */
function sigmaOf(name){
  const s = SAVE.self, a = Math.abs(s.A), b = Math.abs(s.B);
  if (name === 'wren') return clamp(1 - Math.max(a, b) / 0.25, 0, 1);
  return clamp((Math.min(a, b) * 0.6 + Math.max(a, b) * 0.4 - 0.25) / 0.75, 0, 1);
}
function quadOf(A, B){ return A >= 0 ? (B >= 0 ? 'owl' : 'magpie') : (B >= 0 ? 'crane' : 'swallow'); }
function updateName(){
  const s = SAVE.self, m = Math.max(Math.abs(s.A), Math.abs(s.B));
  if (s.name === 'wren'){ if (m >= 0.25) s.name = quadOf(s.A, s.B); }
  else if (m < 0.15) s.name = 'wren';
  else { const q = quadOf(s.A, s.B); if (q !== s.name && Math.min(Math.abs(s.A), Math.abs(s.B)) > 0.08) s.name = q; }
}
function nudge(kind, w){
  const s = SAVE.self, a = PR.selfAlpha * (w === undefined ? 1 : w);
  if (kind === 'probe') s.A += a * (1 - s.A);
  else if (kind === 'commit') s.A += a * (-1 - s.A);
  else if (kind === 'careful') s.B += a * (1 - s.B);
  else if (kind === 'bold') s.B += a * (-1 - s.B);
  else if (kind === 'lean') s.C += a * (-1 - s.C);
  else if (kind === 'alone') s.C += a * (1 - s.C);
  s.A = clamp(s.A, -1, 1); s.B = clamp(s.B, -1, 1); s.C = clamp(s.C, -1, 1);
  updateName();
}
function rates(){
  const n = SAVE.self.name, sg = sigmaOf(n) * PR.selfK;
  return {
    walk:n === 'swallow' ? 1 + 0.3 * sg : n === 'owl' ? 1 - 0.1 * sg : 1,
    probe:n === 'owl' ? 1 - 0.4 * sg : n === 'swallow' ? 1 + 0.2 * sg : 1,
    signLife:n === 'magpie' ? 1 + 0.6 * sg : 1,
    tell:n === 'magpie' ? 1 + sg : 1,
    wait:n === 'crane' ? 1 - 0.3 * sg : 1,
    burn:n === 'crane' ? 1 - 0.1 * sg : 1,
    eat:n === 'wren' ? 1 - 0.15 * sg : 1,
  };
}
// 살펴보기와 해 보기 — 해 보기 전에 몇 번 살폈는지가 '신중 ↔ 결단'
function probe(site, w){ S.stats.probes++; if (site) site.data.since = (site.data.since || 0) + 1; nudge('probe', w); }
function commit(site, w){ S.stats.commits++; nudge('commit', w); if (site){ nudge((site.data.since || 0) >= 2 ? 'careful' : 'bold', w); site.data.since = 0; } }
function discover(key){
  if (S.stars[key]) return;
  S.stars[key] = r1(S.day);
  fx('star', { key }); SFX.star(); nudge('alone', 0.6);
}

/* ---------- 공책 — 적은 낱말이 세상을 연다 ----------
   낱말은 '눈여겨봄'이 된다: 숲 · 강 · 바다는 살펴볼 수 있게, 바람은 움막에 헝겊을 묶게, 새는 잡을 수 있게, 불 · 먹을 것 · 날은 살림의 숫자를 보이게.
   물음(? · 왜 · 어떻게 · 언제 …)은 그 낱말의 공책 쪽이 기록을 풀어 보이게 한다(줄 · 비율 · 주기). */
const HG = '가-힣', B0 = '(?:^|[^' + HG + '])', BEND = '(?=$|[^' + HG + ']|';
const SUBJ = [
  ['wind', [/바람(?!직)/, /풍향|눈보라/, /\bwind/i]],
  ['wood', [/나무|숲|장작|땔감|나뭇가지|가지[를가들]/, /\b(wood|trees?|forest|branch)/i]],
  ['ice', [new RegExp(B0 + '강' + BEND + '[이을은에가과도물변둑의])'), /강물|강가|강변|강둑|개울|시냇|냇물|얼음|얼었|얼어|빙판/, /\b(river|ice|frozen|stream)/i]],
  ['sea', [/바다|바닷|파도|물결|해변|물고기|낚시/, new RegExp(B0 + '고기(?!압)'), /\b(sea|ocean|waves?|fish)/i]],
  ['birds', [new RegExp(B0 + '새' + BEND + '[가는를들도와의야])'), /까마귀|갈매기|굴뚝새|철새|새떼|새 떼/, /\b(birds?|crows?|gulls?|wren)/i]],
  ['mount', [new RegExp(B0 + '산' + BEND + '[이을은에도과의위꼭봉마줄길])'), /봉우리|꼭대기|산마루|언덕/, /\b(mountain|peak|hill|summit)/i]],
  ['fire', [new RegExp(B0 + '불' + BEND + '[이을은씨빛꽃길])'), /모닥불|장작불|추워|춥|추위|따뜻|따듯|온기/, /\b(fire|cold|warm)/i]],
  ['food', [/배고|배가 고|굶|먹을|먹고|먹어|양식|식량|음식|먹이/, /\b(food|hungry|eat)/i]],
  ['time', [new RegExp(B0 + '봄' + BEND + '[이을은에가과도의까])'), /겨울|며칠|날짜|하루|이틀|사흘|나흘/, /\b(spring|winter|days?)/i]],
  ['sky', [/하늘|햇빛|햇살|해가|해는|해를|태양|달이|달은|달빛|보름|초승|그믐|별빛|별이/, /\b(sun|moon|sky)/i]],
];
const SUBJ_IDS = SUBJ.map(([id]) => id);
const QRE = /[?？]|왜|어떻게|언제|얼마나|어디|무엇|뭘|뭐|몇|누구|(까|니|냐|나요|가요|까요)\s*[.!~…]*\s*$/;
function readMemo(text){
  const t = ' ' + String(text).normalize('NFC').replace(/\s+/g, ' ').trim() + ' ';
  return { subj:SUBJ.filter(([, rs]) => rs.some((r) => r.test(t))).map(([id]) => id), q:QRE.test(t.trim()) };
}
let onNoted = () => {}, onSummit = () => {};
function writeMemo(text){
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 140); if (!text || !S || S.over) return null;
  const r = readMemo(text), N = S.notes, fresh = [], asked = [];
  N.memos.push({ d:r1(S.day), t:text, s:r.subj, q:r.q ? 1 : 0 }); if (N.memos.length > 40) N.memos.shift();
  S.stats.memos++;
  r.subj.forEach((id) => { if (N.noted[id] === undefined){ N.noted[id] = r1(S.day); fresh.push(id); } });
  if (r.q){
    S.stats.questions++; N.q++;
    (r.subj.length ? r.subj : N.last ? [N.last] : []).forEach((id) => { if (N.noted[id] !== undefined && N.asked[id] === undefined){ N.asked[id] = r1(S.day); asked.push(id); } });
    nudge('probe', 0.4);
  }
  if (r.subj.length) N.last = r.subj[r.subj.length - 1];
  fresh.forEach((id) => onNoted(id));
  return { fresh, asked, subj:r.subj, q:r.q };
}
const noted = (id) => !!(S && S.notes.noted[id] !== undefined);
const asked = (id) => !!(S && S.notes.asked[id] !== undefined);
// 어떤 자리가 어떤 낱말로 열리나
const SITE_SUBJ = { forest:'wood', river:'ice', shore:'sea', summit:'mount' };
const siteNoted = (st) => noted(SITE_SUBJ[st.type]);

/* ---------- 시간 ---------- */
function tick(dt){
  if (!S || S.over || dt <= 0) return;
  S.day += dt;
  const R = rates(), night = tod() === 'night';
  mwCheck();
  S.res.food -= PR.eat * R.eat * dt;
  S.res.wood -= PR.burn * dt * (S.home.lee ? PR.leeBurn : 1) * R.burn * (S.mw.on ? (S.mw.known ? PR.mwBurnKnown : PR.mwBurn) : 1) * (night ? 1.15 : 1);
  if (S.res.food <= 0){ S.res.food = 0; S.hungry += dt; } else S.hungry = Math.max(0, S.hungry - dt * 0.5);
  if (S.res.wood <= 0){ S.res.wood = 0; S.cold = true; S.coldT += dt; } else { S.cold = false; S.coldT = Math.max(0, S.coldT - dt * 0.5); }
  logStep();
  walkStep(dt);
  signStep();
  eagleStep();
  if (S.coldT > PR.coldEnd){ endSeason('cold'); return; }
  if (S.hungry > PR.hungerEnd){ endSeason('hunger'); return; }
  if (S.day >= PR.seasonDays) endSeason('spring');
}
function mwCheck(){
  const m = S.mw;
  if (!m.on && !m.done && S.day >= m.start){ m.on = true; fx('ring', { color:'#9CC2DA' }); SFX.wind(); }
  if (m.on && S.day >= m.start + m.len){ m.on = false; m.done = true; }
}
// 공책이 저절로 적는 것 — 살림의 숫자(불 · 먹을 것을 눈여겨본 뒤), 바람(헝겊을 묶은 뒤)
function logStep(){
  const L = S.logs;
  if (S.day - L.lastRes >= 0.5){ L.lastRes = S.day; L.res.push([r1(S.day), r1(S.res.wood), r1(S.res.food)]); if (L.res.length > 70) L.res.shift(); }
  if (noted('wind') && S.day - L.lastWind >= 1){ L.lastWind = S.day; const w = windNow(); L.wind.push([r1(S.day), r2(Math.atan2(w.y, w.x))]); if (L.wind.length > 30) L.wind.shift(); }
}

/* ---------- 길 — 내가 선 자리에서 손가락으로 긋고, 걸은 만큼 세상이 그려진다 ---------- */
function polyCum(pts){ const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i])); return c; }
function ptAt(pts, cum, s){
  if (s <= 0) return { u:pts[0].u, v:pts[0].v };
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s){ const t = (s - cum[i - 1]) / Math.max(1e-9, cum[i] - cum[i - 1]); return { u:lerp(pts[i - 1].u, pts[i].u, t), v:lerp(pts[i - 1].v, pts[i].v, t) }; } }
  const l = pts[pts.length - 1]; return { u:l.u, v:l.v };
}
function dirAt(pts, cum, s){
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s || i === pts.length - 1){ const a = pts[i - 1], b = pts[i], dx = b.u - a.u, dy = (b.v - a.v) / WA, d = Math.hypot(dx, dy) || 1; return { x:dx / d, y:dy / d }; } }
  return { x:1, y:0 };
}
const pathAt = (p, s) => ptAt(p.pts, p.cum, s);
// 내가 지금 선 자리
function mePos(){ if (S.walk){ const p = S.paths[S.walk.pi]; return pathAt(p, p.walked); } return S.me; }
const atHome = () => !S.walk && dist(S.me, S.home) < 0.05;
function walkSpeed(pos, dir){
  let k = PR.walk * rates().walk * (S.mw.on ? 0.35 : 1);
  if (inMount(pos)) k *= PR.mountSlow + (1 - PR.mountSlow) * Math.abs(dir.x);   // 곧장 오르면 느리고, 비스듬히 돌면 덜 느리다(기울기)
  if (S.cold) k *= 0.8;
  return Math.max(0.02, k);
}
// 그린 선을 실제 길로 — 바다 앞에서 멈추고, 강은 건너기 전까지 둑에서 멈춘다(얼음이 버틸지 모르니까)
function makePath(raw, from){
  let pts = raw.map((p) => ({ u:clamp(p.u, 0.01, 0.99), v:clamp(p.v, 0.01, 0.985) }));
  let rest = null, stopAt = null;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i];
    if (inSea(b)){ let lo = 0, hi = 1; for (let k = 0; k < 18; k++){ const m = (lo + hi) / 2, q = { u:lerp(a.u, b.u, m), v:lerp(a.v, b.v, m) }; if (inSea(q)) hi = m; else lo = m; } const q = { u:lerp(a.u, b.u, lo * 0.97), v:lerp(a.v, b.v, lo * 0.97) }; pts = pts.slice(0, i).concat([q]); break; }
    if (!S.riverCrossed && !S.mw.on && riverSide(a) !== riverSide(b)){
      let lo = 0, hi = 1; for (let k = 0; k < 18; k++){ const m = (lo + hi) / 2, q = { u:lerp(a.u, b.u, m), v:lerp(a.v, b.v, m) }; if (riverSide(q) === riverSide(a)) lo = m; else hi = m; }
      const cross = { u:lerp(a.u, b.u, lo), v:lerp(a.v, b.v, lo) }, len = dist(a, b) || 1, back = Math.min(lo, 0.03 / len);
      const bank = { u:lerp(a.u, b.u, lo - back), v:lerp(a.v, b.v, lo - back) };
      const far = { u:lerp(a.u, b.u, Math.min(1, hi + back)), v:lerp(a.v, b.v, Math.min(1, hi + back)) };
      rest = [far].concat(pts.slice(i)); stopAt = cross;
      pts = pts.slice(0, i).concat([bank]); break;
    }
  }
  const cum = polyCum(pts);
  return { pts, cum, L:cum[cum.length - 1], from, walked:0, done:false, rest, cross:stopAt, t0:S.day };
}
function startPath(raw){
  if (S.walk || S.over || raw.length < 2) return null;
  const p = makePath([{ u:S.me.u, v:S.me.v }].concat(raw.slice(1)), { pi:S.paths.length - 1 });
  if (p.L < 0.02) return null;
  S.paths.push(p); S.walk = { pi:S.paths.length - 1 }; S.stats.paths++; S.blocked = null;
  commit(null, 0.4);
  SFX.scratch();
  return p;
}
function revealAt(pos, r){
  const last = S.reveal[S.reveal.length - 1];
  if (!r && last && dist(last, pos) < 0.022) return;
  S.reveal.push({ u:r2(pos.u * 10) / 10, v:r2(pos.v * 10) / 10, r:r || PR.revealR });
  S.maskN++;
  Object.values(S.sites).forEach((st) => { if (!st.found && st.type !== 'river' && dist(st, pos) < (r || PR.revealR) + 0.03){ st.found = true; if (siteNoted(st)) fx('note', { u:st.u, v:st.v, seed:st.seed, r:st.type === 'summit' ? 0.03 : 0.046 }); } });
}
function linkCheck(pos, pi){
  Object.values(S.sites).forEach((st) => {
    if (st.linked || st.type === 'river') return;
    if (dist(st, pos) < (st.type === 'summit' ? 0.028 : 0.05)){
      st.found = true; st.linked = true;
      fx('link', { u:st.u, v:st.v }); SFX.good();
      if (st.type === 'summit'){ revealAt({ u:st.u, v:st.v + 0.12 }, 0.34); mountCheck(pi); onSummit(); }
    }
  });
}
// 산 — 곧장 오르기보다 비스듬히 돌아 오르는 길이 빠르다(숨은 기울기 규칙)
function mountCheck(pi){
  if (S.stars.mount) return;
  let mt = 0, ms = 0, mc = 0, p = S.paths[pi], guard = 0;
  while (p && guard++ < 20){ mt += p.mt || 0; ms += p.ms || 0; mc += p.mc || 0; p = p.from && p.from.pi >= 0 && S.paths[p.from.pi] && S.paths[p.from.pi].mt ? S.paths[p.from.pi] : null; }
  // 오른 높이만큼 곧장 올랐다면 걸렸을 날(ms)보다 넉넉히 빨랐다면 — '비스듬히 돌아 오르기'를 찾은 것
  S.mountTry = { mt:r2(mt), ms:r2(ms), mc:r2(mc) };
  if (mc > 0.03 && mt < ms * 0.85) discover('mount');
}
function walkStep(dt){
  const wk = S.walk; if (!wk) return;
  const p = S.paths[wk.pi];
  let remain = dt, guard = 0;
  while (remain > 1e-7 && p.walked < p.L - 1e-9 && guard++ < 200){
    const pos = pathAt(p, p.walked), sp = walkSpeed(pos, dirAt(p.pts, p.cum, p.walked + 1e-4));
    const step = Math.min(sp * remain, p.L - p.walked, 0.008);
    p.walked += step; remain -= step / sp; S.stats.walked += step;
    const np = pathAt(p, p.walked);
    if (inMount(pos)){
      // 산에서 쓴 날(mt)과, 같은 높이를 곧장 올랐다면 쓸 날(ms)
      p.mt = (p.mt || 0) + step / sp;
      const up = Math.max(0, pos.v - np.v) / WA;
      if (up > 0){ p.mc = (p.mc || 0) + up; p.ms = (p.ms || 0) + up / walkSpeed(pos, { x:0, y:-1 }); }
    }
    revealAt(np); linkCheck(np, wk.pi);
  }
  if (p.walked >= p.L - 1e-9){
    p.done = true; p.t1 = S.day; S.walk = null;
    const end = pathAt(p, p.L); S.me = { u:end.u, v:end.v };
    if (p.rest){
      // 강가에서 멈췄다 — 얼음을 재 볼 자리(여울)가 이 자리로
      const f = S.sites.ford;
      Object.assign(f, { u:p.cross.u, v:p.cross.v, placed:true, found:true, linked:true });
      S.blocked = { pi:S.paths.indexOf(p) };
      fx('link', { u:f.u, v:f.v }); if (noted('ice')) fx('note', { u:f.u, v:f.v, seed:f.seed, r:0.024 });
    }
  }
}
// 걷다가 다른 데로 — 지금 선 자리에서 길을 끊는다
function cutWalk(){
  const wk = S.walk; if (!wk) return false;
  const p = S.paths[wk.pi], at = p.walked, pos = pathAt(p, at), keep = [];
  for (let i = 0; i < p.pts.length && p.cum[i] < at; i++) keep.push(p.pts[i]);
  keep.push({ u:pos.u, v:pos.v }); if (keep.length < 2) keep.unshift({ u:pos.u, v:pos.v });
  p.pts = keep; p.cum = polyCum(keep); p.L = p.cum[p.cum.length - 1]; p.walked = p.L; p.done = true; p.rest = null; p.cross = null; p.t1 = S.day;
  S.walk = null; S.me = { u:pos.u, v:pos.v };
  return true;
}
// 얼음을 건넜다 — 멈춘 길이 이어진다
function resumeAcross(){
  const b = S.blocked; if (!b) return;
  const p = S.paths[b.pi];
  if (p.rest){ p.pts = p.pts.concat(p.rest); p.cum = polyCum(p.pts); p.L = p.cum[p.cum.length - 1]; p.rest = null; p.done = false; S.walk = { pi:b.pi }; }
  S.blocked = null;
}
// 길이 걸릴 날 — 그리는 동안 손끝에 해로 보여 준다
function estimateDays(raw){
  const p = makePath(raw, null); let t = 0;
  for (let s = 0; s < p.L; s += 0.01){ const pos = pathAt(p, s); t += Math.min(0.01, p.L - s) / walkSpeed(pos, dirAt(p.pts, p.cum, s + 1e-4)); }
  return { days:t, blocked:!!p.rest, end:p.pts[p.pts.length - 1] };
}

/* ---------- 바람막이 — 바람을 눈여겨본 뒤, 움막 둘레에 가지를 엮어 세운다 ---------- */
function fenceSpotOk(p){
  const d = dist(p, S.home);
  return d > 0.012 && d < 0.075 && !inSea({ u:p.u, v:p.v + 0.02 }) && !nearRiver(p, 0.03) && !inMount(p) && S.fences.every((f) => dist(f, p) > 0.014);
}
function buildFence(p){
  if (S.over || S.mw.on || S.res.wood < PR.fenceWood || !fenceSpotOk(p) || !atHome()) return false;
  S.res.wood -= PR.fenceWood;
  S.fences.push({ u:p.u, v:p.v, seed:hashS('f' + S.fences.length + S.seed) });
  const was = S.home.lee; S.home.lee = leeOf(S.home); S.stats.fences++;
  commit(S.home, 0.5);

      inkLine(g, [{ x:mx - c.cw * 0.95, y:my + c.ch * 0.22 }, { x:mx - c.cw * 0.55, y:my - c.ch * 0.34 }, { x:mx, y:my - c.ch * 0.46 }, { x:mx + c.cw * 0.55, y:my - c.ch * 0.34 }, { x:mx + c.cw * 0.95, y:my + c.ch * 0.22 }], 1.4, PAL.ink, R, 0.6);

      const p = clamp((now - a.t0) / a.life, 0, 1);
      if (a.kind === 'log'){ const x = lerp(a.x, wx, easeOut(p)), y = lerp(a.y, wy - 30, easeOut(p)) - Math.sin(p * Math.PI) * 60; g.save(); g.translate(x, y); g.rotate(p * 6); iconLogs(g, 0, 0, 9); g.restore(); }
      else if (a.kind === 'dust'){ g.fillStyle = PAL.stone2; for (let i = 0; i < 12; i++){ const ang = i / 12 * TAU, r = p * 34; g.globalAlpha = (1 - p) * 0.7; g.beginPath(); g.arc(a.x + Math.cos(ang) * r, a.y + Math.sin(ang) * r * 0.6 + p * 20, 2.2 * (1 - p) + 0.6, 0, TAU); g.fill(); } g.globalAlpha = 1; }
      else if (a.kind === 'snow'){ g.fillStyle = isDark() ? '#D5DEE6' : '#FFFFFF'; for (let i = 0; i < 9; i++){ const ang = -Math.PI * (0.15 + i / 9 * 0.7), r = p * 26; g.globalAlpha = (1 - p); g.beginPath(); g.arc(a.x + Math.cos(ang) * r, a.y + Math.sin(ang) * r + p * p * 30, 2.4, 0, TAU); g.fill(); } g.globalAlpha = 1; }

    });
  },
  hit(L, st, x, y){
    const d = st.data, gs = this.geo(L);
    for (let ci = 0; ci < 2; ci++){ const c = gs[ci], n = d.cups[ci].sticks.length; for (let i = n - 1; i >= 0; i--){ const p = this.stickPose(c, i, n), tx = p.bx + p.dx * c.Ls * 0.62, ty = p.by + p.dy * c.Ls * 0.62; if (Math.hypot(tx - x, ty - y) < 16) return { ci, i, p, c }; } }
    return null;
  },
  down(L, st, x, y){ const h = this.hit(L, st, x, y); if (!h) return false; DV.drag = { ci:h.ci, i:h.i, off:0, y0:y, x0:x, p:h.p, c:h.c, moved:false }; return true; },
  move(L, st, x, y){
    const dr = DV.drag; if (!dr) return; const along = (x - dr.x0) * dr.p.dx + (y - dr.y0) * dr.p.dy;

  },
  up(L, st){
    const dr = DV.drag; DV.drag = null; if (!dr) return;
    const d = st.data, cup = d.cups[dr.ci], sk = cup.sticks[dr.i];
    if (!dr.moved){
      // 살펴보기 — 끝의 눈을 털어 본다
      if (!sk || sk.seen) return;
      sk.seen = true; d.brushes = (d.brushes || 0) + 1; S.stats.brushes++;
      const tx = dr.p.bx + dr.p.dx * dr.c.Ls * 0.62, ty = dr.p.by + dr.p.dy * dr.c.Ls * 0.62;
      devAnim('snow', { x:tx, y:ty, life:600 }); SFX.tick();

      return;
    }
    if (!this.canPull(st) || dr.off < dr.c.Ls * 0.5) return;            // 덜 뽑았다 — 도로 들어간다
    cup.sticks.splice(dr.i, 1);
    const tx = dr.p.bx + dr.p.dx * (dr.c.Ls * 0.62 + dr.off), ty = dr.p.by + dr.p.dy * (dr.c.Ls * 0.62 + dr.off);

    else { cup.streak = 0; devAnim('dust', { x:tx, y:ty, life:800 }); SFX.bad(); }

  margin(g, M, st){
    const d = st.data; if (!d.cups) return;
    d.cups.forEach((cup, ci) => {

      // 물으면 — 비율 막대(해 본 만큼)
      const by = M.y + M.h - 26;

  },
  ghost(L, st, t){
    const c = this.geo(L)[0], n = st.data.cups[0].sticks.length; if (!n) return null;

    const k = ease(clamp(t * 1.6, 0, 1));
    return { x:tx + 4, y:ty - k * 70, a:Math.sin(clamp(t, 0, 1) * Math.PI) };
  },
};

/* ======================= 강 — 얼음 재기 =======================
   얼음을 뚫어 두께를 재고(살펴보기) → 며칠 기다리고(기다리기) → 걸어서 건넌다(해 보기). 건너편엔 더 큰 숲이 있다.
   숨은 규칙: 얼음 두께는 날마다 같은 만큼 는다(일차함수). 두 번 재고 물어보면 공책에 줄이 그어지고, 버티는 두께와 만나는 날이 건너는 날.
   편법: 한겨울엔 물이 돌처럼 언다 — 아무 데서나 건넌다. */
const DEV_RIVER = {
  init(st){ const d = st.data; if (d.rate === undefined){ const R = mulberry(st.seed); d.d0 = r2(S.day - 1); d.base = r2(4.2 + R() * 2.4); d.rate = r2(0.85 + R() * 0.6); d.probes = []; d.wait = 2; d.fails = 0; d.core = null; } },
  th(d, day){ const t = d.base + d.rate * (day - d.d0); return S.mw.on ? Math.max(t, 32) : t; },
  safeDay(d){ return d.d0 + (PR.iceNeed - d.base) / d.rate; },
  canWait(d){ return d.probes.length >= 1; },
  canCross(d){ return d.probes.length >= 2 || (d.waited || 0) >= 1; },
  geo(L){
    const A = L.A;
    return Object.assign({ iceT:A.y + A.h * 0.3, iceB:A.y + A.h * 0.62, drill:{ x:A.x + A.w * 0.14, y:A.y + A.h * 0.84 }, sled:{ x:A.x + A.w * 0.42, y:A.y + A.h * 0.82 } }, waitGeo(A));
  },
  draw(g, L, now, st){
    const A = L.A, d = st.data, G = this.geo(L), R = mulberry(st.seed + 3), th = this.th(d, S.day);
    if (d.probes.length && !d.waitAt) d.waitAt = nowMs();
    if (this.canCross(d) && !d.crossAt) d.crossAt = nowMs();
    // 건너편 — 큰 숲이 보이는 둑
    wash(g, A.x + A.w * 0.5, A.y + A.h * 0.16, A.w * 0.6, PAL.snowSh, 0.4, R, { sy:0.18, edge:false });
    for (let i = 0; i < 9; i++) drawPine(g, A.x + A.w * (0.05 + i * 0.11) + (R() - 0.5) * 10, A.y + A.h * (0.25 + R() * 0.03), A.h * (0.1 + R() * 0.06), R);
    // 얼음 — 얇을수록 어둡고 금이 많다(친절하지 않은 근거)
    const k = clamp((th - 4) / (PR.iceNeed + 6 - 4), 0, 1);
    g.fillStyle = mixHex(PAL.iceThin, PAL.ice, k); g.fillRect(A.x, G.iceT, A.w, G.iceB - G.iceT);
    inkLine(g, [{ x:A.x, y:G.iceT }, { x:A.x + A.w * 0.5, y:G.iceT + 4 }, { x:A.x + A.w, y:G.iceT - 2 }], 1.6, PAL.ink, R, 0.7);
    inkLine(g, [{ x:A.x, y:G.iceB }, { x:A.x + A.w * 0.5, y:G.iceB - 3 }, { x:A.x + A.w, y:G.iceB + 2 }], 1.6, PAL.ink, R, 0.7);
    g.strokeStyle = isDark() ? 'rgba(220,235,245,.5)' : 'rgba(255,255,255,.95)'; g.lineWidth = 1;
    const cracks = Math.round(lerp(14, 3, k));
    for (let i = 0; i < cracks; i++){ const cx = A.x + R() * A.w, cy = lerp(G.iceT, G.iceB, R()); g.beginPath(); g.moveTo(cx, cy); for (let j = 0; j < 4; j++) g.lineTo(cx + (R() - 0.3) * 30 * (j + 1) * 0.5, cy + (R() - 0.5) * 12); g.stroke(); }
    // 가까운 둑
    wash(g, A.x + A.w * 0.5, A.y + A.h * 0.9, A.w * 0.62, PAL.snowSh, 0.3, R, { sy:0.16, edge:false });
    for (let i = 0; i < 12; i++){ const rx = A.x + R() * A.w, ry = G.iceB + 6 + R() * 10; inkLine(g, [{ x:rx, y:ry + 10 }, { x:rx + (R() - 0.5) * 6, y:ry - 8 }], 1, PAL.ink, null, 0.4); }
    // 잰 자리 — 얼음 기둥
    if (d.core){ const p = clamp((now - d.core.t) / 700, 0, 1), ch = d.core.th * 4.2; g.fillStyle = PAL.ice; g.strokeStyle = PAL.ink; g.lineWidth = 1.2; g.fillRect(d.core.x - 7, d.core.y - ch * p, 14, ch * p); g.strokeRect(d.core.x - 7, d.core.y - ch * p, 14, ch * p);
      g.strokeStyle = PAL.ink; g.globalAlpha = 0.5; for (let c = 0; c <= 20; c += 2){ g.beginPath(); g.moveTo(d.core.x + 9, d.core.y - c * 4.2); g.lineTo(d.core.x + (c % 4 ? 13 : 17), d.core.y - c * 4.2); g.stroke(); } g.globalAlpha = 1; }
    // 송곳
    if (!(DV.drag && DV.drag.what === 'drill')) this.drawDrill(g, G.drill.x, G.drill.y);
    // 기다리기 — 한 번 재고 나서
    if (this.canWait(d)) drawWait(g, G, d.wait, fadeIn(d.waitAt));
    // 나 — 건너 보기(재 보고, 기다렸거나 두 번 잰 뒤)
    if (this.canCross(d)){
      let sy = G.sled.y; if (DV.drag && DV.drag.what === 'sled') sy = DV.drag.y;
      DV.anim.forEach((a) => { if (a.kind === 'cross'){ const p = clamp((now - a.t0) / a.life, 0, 1); sy = lerp(a.y, a.ok ? G.iceT - 30 : G.sled.y, a.ok ? easeOut(p) : p < 0.4 ? 0 : (p - 0.4) / 0.6); } });
      g.globalAlpha = fadeIn(d.crossAt); this.drawMe(g, G.sled.x, sy); g.globalAlpha = 1;
    }
    DV.anim = DV.anim.filter((a) => {
      const p = clamp((now - a.t0) / a.life, 0, 1);
      if (a.kind === 'crack'){ g.strokeStyle = PAL.ink; g.lineWidth = 1.6; g.globalAlpha = 1 - p * 0.6; for (let i = 0; i < 8; i++){ const ang = i / 8 * TAU; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(a.x + Math.cos(ang) * 50 * Math.min(1, p * 3), a.y + Math.sin(ang) * 22 * Math.min(1, p * 3)); g.stroke(); } g.globalAlpha = 1;
        if (p > 0.2){ g.fillStyle = PAL.sea2; g.globalAlpha = (1 - p) * 0.8; g.beginPath(); g.ellipse(a.x, a.y, 30, 12, 0, 0, TAU); g.fill(); g.globalAlpha = 1; } }
      return p < 1;
    });
    if (DV.drag && DV.drag.what === 'drill') this.drawDrill(g, DV.drag.x, DV.drag.y);
  },
  drawDrill(g, x, y){
    g.strokeStyle = PAL.ink; g.lineWidth = 2.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 14, y - 22); g.lineTo(x + 14, y - 22); g.moveTo(x, y - 22); g.lineTo(x, y + 12); g.stroke();
    g.lineWidth = 1.4; for (let i = 0; i < 4; i++){ g.beginPath(); g.moveTo(x - 4, y - 6 + i * 5); g.lineTo(x + 4, y - 3 + i * 5); g.stroke(); }
    g.fillStyle = PAL.wood; g.fillRect(x - 16, y - 25, 6, 6); g.fillRect(x + 10, y - 25, 6, 6);
  },
  // 나 — 등짐을 진 작은 모습(위로 끌면 얼음 위로 걸어 나간다)
  drawMe(g, x, y){
    drawFigure(g, x, y + 14, 30, PAL.ink, { pack:true });
    g.strokeStyle = PAL.ink; g.globalAlpha *= 0.35; g.setLineDash([3, 5]); g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y - 24); g.lineTo(x, y - 70); g.stroke(); g.setLineDash([]);
    g.beginPath(); g.moveTo(x - 6, y - 62); g.lineTo(x, y - 72); g.lineTo(x + 6, y - 62); g.stroke(); g.globalAlpha = 1;
  },
  down(L, st, x, y){
    const G = this.geo(L), d = st.data;
    if (Math.hypot(x - G.drill.x, y - G.drill.y) < 30){ DV.drag = { what:'drill', x, y }; return true; }
    if (this.canCross(d) && Math.abs(x - G.sled.x) < 40 && y > G.sled.y - 40 && y < G.sled.y + 30){ DV.drag = { what:'sled', x:G.sled.x, y }; return true; }
    if (this.canWait(d) && waitDown(G, d, st, x, y)) return true;
    return false;
  },
  move(L, st, x, y){ const dr = DV.drag; if (!dr) return; if (dr.what === 'drill'){ dr.x = x; dr.y = y; } else dr.y = clamp(y, this.geo(L).iceT - 30, this.geo(L).sled.y); },
  up(L, st){
    const dr = DV.drag; DV.drag = null; if (!dr) return;
    const G = this.geo(L), d = st.data;
    if (dr.what === 'drill'){
      if (dr.y > G.iceT && dr.y < G.iceB){
        devTime(PR.drillTime * rates().probe); if (!DV.id) return;
        const th = r1(this.th(d, S.day));
        d.probes.push({ day:r2(S.day), th }); if (d.probes.length > 12) d.probes.shift();
        d.core = { x:dr.x, y:G.iceB - 4, th, t:nowMs() };
        S.stats.drills++; probe(st); ghostDone('river'); SFX.drill();
      }
      return;
    }
    if (dr.y > (G.iceT + G.iceB) / 2) return;      // 얼음 가운데를 넘지 않았다 — 도로 둑으로
    const th = this.th(d, S.day), ok = th >= PR.iceNeed;
    commit(st);
    if (ok){
      devAnim('cross', { y:dr.y, ok:true, life:900 }); SFX.good();
      if (!d.eagle && (d.probes.length >= 2) && S.day - this.safeDay(d) <= 0.75 && !S.mw.on) discover('river');
      S.riverCrossed = true;
      setTimeout(() => { if (DV.id === st.id){ closeDevice(); resumeAcross(); } }, 950);
    } else {
      devAnim('cross', { y:dr.y, ok:false, life:1100 }); devAnim('crack', { x:G.sled.x, y:(G.iceT + G.iceB) / 2, life:1300 });
      SFX.crack(); setTimeout(() => SFX.splash(), 200);
      d.fails++; S.res.food = Math.max(0, S.res.food - PR.failFood); S.res.wood = Math.max(0, S.res.wood - PR.failWood);
      devTime(0.5);
    }
  },
  margin(g, M, st, now){
    const d = st.data; if (!d.probes) return;
    const x0 = M.x + 26, y0 = M.y + M.h - 22, w = M.w - 40, h = M.h - 44;
    const maxD = Math.max(PR.seasonDays * 0.6, S.day + 4), mx = (day) => x0 + (day / maxD) * w, my = (th) => y0 - (th / 22) * h;
    g.strokeStyle = PAL.ink; g.lineWidth = 1.2; g.globalAlpha = 0.7; g.beginPath(); g.moveTo(x0, M.y + 16); g.lineTo(x0, y0); g.lineTo(x0 + w, y0); g.stroke(); g.globalAlpha = 1;
    // 버티는 두께 — 나를 그린 점선
    g.setLineDash([5, 5]); g.strokeStyle = PAL.wood; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0, my(PR.iceNeed)); g.lineTo(x0 + w, my(PR.iceNeed)); g.stroke(); g.setLineDash([]);
    drawFigure(g, x0 + w - 8, my(PR.iceNeed) - 3, 13, PAL.wood);
    // 오늘
    g.strokeStyle = PAL.ink; g.globalAlpha = 0.3; g.beginPath(); g.moveTo(mx(S.day), M.y + 16); g.lineTo(mx(S.day), y0); g.stroke(); g.globalAlpha = 1;
    // 잰 점들 → 물으면, 두 날 이상이면 줄을 긋는다
    const pts = d.probes;
    if (asked('ice') && pts.length >= 2){
      const n = pts.length, sx = pts.reduce((t, p) => t + p.day, 0), sy = pts.reduce((t, p) => t + p.th, 0), sxx = pts.reduce((t, p) => t + p.day * p.day, 0), sxy = pts.reduce((t, p) => t + p.day * p.th, 0);
      const den = n * sxx - sx * sx;
      if (Math.abs(den) > 1e-6){
        const a = (n * sxy - sx * sy) / den, b = (sy - a * sx) / n;
        g.strokeStyle = PAL.ink; g.globalAlpha = 0.55; g.lineWidth = 1.3; g.beginPath(); g.moveTo(mx(0), my(b)); g.lineTo(mx(maxD), my(b + a * maxD)); g.stroke(); g.globalAlpha = 1;
        if (a > 0){ const cx = (PR.iceNeed - b) / a; if (cx > 0 && cx < maxD){ g.strokeStyle = PAL.bloom; g.lineWidth = 2; g.beginPath(); g.arc(mx(cx), my(PR.iceNeed), 6, 0, TAU); g.stroke(); } }
      }
    }
    if (d.eagle){ g.strokeStyle = PAL.stone2; g.lineWidth = 2; g.beginPath(); g.moveTo(mx(d.d0), my(d.base)); g.lineTo(mx(maxD), my(d.base + d.rate * (maxD - d.d0))); g.stroke(); const sd = this.safeDay(d); g.fillStyle = PAL.stone2; g.beginPath(); g.arc(mx(sd), my(PR.iceNeed), 4, 0, TAU); g.fill(); }
    pts.forEach((p) => { g.fillStyle = PAL.ink; g.beginPath(); g.arc(mx(p.day), my(p.th), 3.4, 0, TAU); g.fill(); });
  },
  ghost(L, st, t){ const G = this.geo(L), k = ease(clamp(t * 1.5, 0, 1)); return { x:lerp(G.drill.x, G.drill.x + 60, k), y:lerp(G.drill.y, (G.iceT + G.iceB) / 2, k), a:Math.sin(clamp(t, 0, 1) * Math.PI) }; },
};

/* ======================= 바다 — 물결과 낚시 =======================
   물가에 눈금 막대를 세워 두었다. 막대를 눌러 물결 높이를 재고(살펴보기) → 기다리고(기다리기) → 낚싯줄을 던진다(해 보기).
   숨은 규칙: 물결은 며칠 주기로 높아졌다 낮아진다(주기 함수). 여러 날 재고 물어보면 공책이 잔잔한 골과 그 사이를 짚어 준다.
   갈매기가 뭍으로 몰리면 이튿날 폭풍. 잔잔할 때 던지면 많이, 너울이면 조금, 폭풍이면 젖고 잃는다. 같은 날 거듭 나가면 0.6배씩. */

const DEVICES = { forest:DEV_FOREST, river:DEV_RIVER, shore:DEV_SHORE };

/* ---------- 장치 쪽 그리기 · 손 ---------- */

// 공책을 덮으면 — 방금 적은 낱말의 자리에 연필 동그라미가 그려지고, 위의 작은 그림이 생긴다

/* ---------- 손 ---------- */
function pt(e){ const r = CV.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hudAction(id){
  if (id === 'note') openNotebook();
  else if (id === 'pause') setPaused(!paused);
  else if (id === 'speed'){ S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; SFX.tick(); }
  else if (id === 'sound'){ sndSet(!SND.on); SAVE.mute = !SND.on; save(); }
  else if (id === 'full') toggleFull();
  else if (id === 'leave'){ const now = nowMs(); if (S.leaveArm && now - S.leaveArm < 2200){ S.leaveArm = 0; leaveToCover(); } else { S.leaveArm = now; SFX.tick(); } }
}
// 내가 그려진 자리(움막에 있으면 움막 곁)
function mePx(){ const q = mePos(), home = atHome(); return { x:X(q.u) + (home ? su() * 0.03 : 0), y:Y(q.v) + (home ? su() * 0.012 : 0) - su() * 0.0065 }; }
function siteAt(x, y){ return Object.values(S.sites).find((st) => st.found && (st.type !== 'river' || st.placed) && (siteNoted(st) || (st.type === 'summit' && st.linked)) && Math.hypot(X(st.u) - x, Y(st.v) - y) < Math.max(26, su() * 0.035)); }
const homeHit = (x, y) => Math.hypot(X(S.home.u) - x, Y(S.home.v) - y) < Math.max(28, su() * 0.03);
function ragHit(x, y){ const r = ragPos(); return Math.hypot(r.cx - x, r.cy - y) < Math.max(22, r.s0 * 1.05); }
function bushAt(x, y){ return S.bushes.find((b) => !b.stone && Math.hypot(X(b.u) - x, Y(b.v) - b.s * 0.016 * su() * 0.3 - y) < Math.max(14, b.s * 0.016 * su() * 0.9) && S.reveal.some((c) => dist(c, b) < c.r * 0.9)); }
function walkTo(u, v){
  if (S.over) return false;
  if (S.walk) cutWalk();
  const tgt = { u:clamp(u, 0.01, 0.99), v:clamp(v, 0.01, 0.985) };
  if (dist(S.me, tgt) < 0.02) return false;
  return !!startPath([{ u:S.me.u, v:S.me.v }, tgt]);
}
// 바람을 살펴본다 — 헝겊이 어느 쪽으로 날리나
function ragLook(){ S.home.looked = (S.home.looked || 0) + 1; S.stats.rag++; probe(S.home, 0.3); const q = ragUV(); fx('ring', { u:q.u, v:q.v, color:'#B5482F' }); SFX.tick(); }
function tapWorld(x, y, onMe){
  const now = nowMs();

  const st = siteAt(x, y);
  if (st){ if (canOpen(st)){ openDevice(st.id); return; } walkTo(st.u, st.v); return; }
  // 헝겊 — 바람을 눈여겨본 뒤로 움막 곁에
  if (noted('wind') && atHome() && ragHit(x, y)){ ragLook(); return; }
  // 움막 — 멀면 돌아가고, 곁이면(바람을 눈여겨본 뒤로) 바람막이를 꺼낸다
  if (homeHit(x, y) || (onMe && atHome())){
    if (!atHome()){ walkTo(S.home.u, S.home.v); return; }
    if (noted('wind')){
      if (S.mw.on || S.res.wood < PR.fenceWood){ S.lastShort = 'wood'; S.lastShortAt = now; SFX.bad(); return; }
      FENCE = { u:S.home.u + 0.04, v:S.home.v + 0.006 }; SFX.tick(); return;
    }
    return;
  }
  if (onMe) return;
  // 덤불 — 건드리면 굴뚝새가 튀어나온다(아무것도 알려 주지 않는다)
  const b = bushAt(x, y);
  if (b && dist(b, mePos()) < 0.14){ fx('wren', { u:b.u, v:b.v, dir:Math.random() < 0.5 ? -1 : 1, life:900 }); SFX.chirp(); return; }
  walkTo(U(x), V(y));
}
function startPinch(){
  const [a, b] = [...PTRS.values()];
  if (PTR && PTR.mode === 'fence') FENCE = null;
  preview = null; PTR = null;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  PINCH = { d0:Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), z0:CAM.z, u:U(mx), v:V(my) };
  userCam();
}
function movePinch(){
  const [a, b] = [...PTRS.values()]; if (!a || !b) return;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.max(20, Math.hypot(a.x - b.x, a.y - b.y));
  CAM.z = clamp(PINCH.z0 * d / PINCH.d0, ZMIN, zMax());
  CAM.ox = PINCH.u - (mx - Wr.x) / (CAM.z * Wr.w); CAM.oy = PINCH.v - (my - Wr.y) / (CAM.z * Wr.h);
  camClamp(); CAM.movedAt = performance.now(); userCam();
}
function down(e){
  sndInit();
  const [x, y] = pt(e);
  try { CV.setPointerCapture(e.pointerId); } catch (er){ /* */ }
  PTRS.set(e.pointerId, { x, y });
  if (TURN.on) return;
  if (scene === 'cover'){ if (PTRS.size > 1) return; const B = coverRect(); if (inR(B, x, y) || (SAVE.cur && inR(ribbonRect(B), x, y))){ if (SAVE.cur) resume(); else openBook(); } return; }
  if (scene === 'name'){ focusName(); return; }
  if (scene === 'keep'){ if (PTRS.size === 1) closeBook(); return; }
  if (scene !== 'world' || !S) return;
  if (NB.open){ if (PTRS.size === 1) nbDown(x, y); return; }
  if (DV.id){ if (PTRS.size === 1){ deviceDown(x, y); PTR = { mode:'device' }; } return; }
  if (S.over) return;
  if (PTRS.size === 2){ startPinch(); return; }
  if (PTRS.size > 2) return;
  const hb = HUDR.find((r) => !r.deco && inR(r, x, y));
  if (hb){ hudAction(hb.id); PTR = { mode:'none' }; return; }
  if (S.forming < 1){ PTR = { mode:'none' }; return; }
  if (paused){ setPaused(false); PTR = { mode:'none' }; return; }
  if (FENCE){ if (Math.hypot(X(FENCE.u) - x, Y(FENCE.v) - y) < 42){ PTR = { mode:'fence' }; return; } FENCE = null; }
  if (noted('birds') && inR(VR, x, y)) for (const sg of S.signs.slice().reverse()){ const q = signPos(sg, nowMs()); if (Math.hypot(X(q.u) - x, Y(q.v) - y) < 36){ catchSign(sg); PTR = { mode:'none' }; return; } }
  const m = mePx(), nearMe = Math.hypot(m.x - x, m.y - y) < Math.max(30, su() * 0.02);
  PTR = { mode:nearMe ? 'me' : 'pending', x0:x, y0:y, t0:nowMs(), ox:CAM.ox, oy:CAM.oy };
}
function move(e){
  const pp = PTRS.get(e.pointerId), [x, y] = pt(e);
  if (pp){ pp.x = x; pp.y = y; }
  if (scene !== 'world' || !S) return;
  if (PINCH){ if (PTRS.size >= 2) movePinch(); return; }
  if (!PTR || !pp) return;
  if (PTR.mode === 'device'){ deviceMove(x, y); return; }
  if (PTR.mode === 'nbscroll'){ NB.scroll = PTR.s0 - (y - PTR.y0) / NB_LH; return; }
  if (PTR.mode === 'fence'){ FENCE = { u:clamp(U(x), 0, 1), v:clamp(V(y), 0, 1) }; return; }
  if ((PTR.mode === 'pending' || PTR.mode === 'me') && Math.hypot(x - PTR.x0, y - PTR.y0) > 9){
    if (PTR.mode === 'me' && !S.over){ if (S.walk) cutWalk(); const q = mePos(); PTR.mode = 'path'; preview = { pts:[{ u:q.u, v:q.v }], est:null, at:0 }; }
    else { PTR.mode = 'pan'; GLIDE.on = false; }
  }
  if (PTR.mode === 'pan'){ CAM.ox = PTR.ox - (x - PTR.x0) / (CAM.z * Wr.w); CAM.oy = PTR.oy - (y - PTR.y0) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); userCam(); return; }
  if (PTR.mode === 'path'){

    if (dist(q, last) > 0.008 / Math.sqrt(CAM.z)){ preview.pts.push(q); if (nowMs() - preview.at > 90){ preview.at = nowMs(); preview.est = estimateDays(preview.pts); } }
  }
}
function up(e){
  const [x, y] = pt(e); PTRS.delete(e.pointerId);
  if (PINCH){ if (PTRS.size < 2){ PINCH = null; PTR = { mode:'none' }; } return; }
  const p = PTR; if (PTRS.size === 0) PTR = null;
  if (!p || !S || scene !== 'world') return;
  if (p.mode === 'device'){ deviceUp(x, y); return; }

  if (p.mode === 'path'){ const pv = preview; preview = null; if (pv && pv.pts.length >= 2) startPath(pv.pts); return; }

function cancel(e){ PTRS.delete(e.pointerId); if (PTRS.size < 2) PINCH = null; if (!PTRS.size){ if (PTR && PTR.mode === 'device') DV.drag = null; PTR = null; preview = null; } }
function wheel(e){

/* ---------- 시계 ---------- */
function frame(t){
  const dtMs = clamp(t - (lastFrame || t), 0, 100); lastFrame = t;
  G.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'world' && S){
    if (S.forming < 1){ if (!TURN.on) S.forming = Math.min(1, S.forming + dtMs / 4200); }
    else if (!S.over && !paused && !DV.id && !NB.open && !TURN.on && !document.hidden) tick(dtMs / 1000 / PR.dayLen * S.speed);
    glideStep(t); followStep(t, dtMs); if (PTR && PTR.mode === 'path') edgePan(dtMs);
    if (S.over && !endAt) endAt = t;
    if (S.over && endAt && t - endAt > 3600 && !TURN.on) toKeep();
    if (!S.over && t - lastSaveAt > 4000){ lastSaveAt = t; save(); }
    sndAmbient(t, S.mw.on ? 'cold' : '');
    if (NB.open) placeNotebookDom();
  }
  try {
    if (TURN.on) drawTurn(G, t);
    else if (scene === 'cover') drawCover(G, t);
    else if (scene === 'name') drawLegend(G, t, nameT0);
    else if (scene === 'world' && S) drawWorldScene(G, t, dtMs);
    else if (scene === 'keep' && KEEP) drawKeepsake(G, t, KEEP.run, KEEP.snap);
  } catch (err){ if (!frame.err){ frame.err = 1; console.error(err); } }
  $('lobby').hidden = scene !== 'cover' || TURN.on;
  requestAnimationFrame(frame);
}

/* ---------- 저장 · 앱과의 약속 ---------- */
let saveTimer = 0;
function snapshot(){
  if (S && !S.over && (scene === 'world' || TURN.on)) SAVE.cur = pack();
  const out = { v:4, params:SAVE.params, self:SAVE.self, runs:SAVE.runs, cur:SAVE.cur, seen:SAVE.seen, mute:!SND.on }, LIM = 19500;
  let s = JSON.stringify(out);
  if (s.length > LIM){ out.runs = out.runs.slice(-8).map((r) => Object.assign({}, r, { stats:undefined })); s = JSON.stringify(out); }
  if (s.length > LIM && out.cur){ const c = out.cur = Object.assign({}, out.cur), L = c.logs; c.logs = { res:L.res.slice(-30), wind:L.wind.slice(-14), birds:L.birds.slice(-14), lastRes:L.lastRes, lastWind:L.lastWind }; s = JSON.stringify(out); }
  if (s.length > LIM && out.cur){ out.cur.notes = Object.assign({}, out.cur.notes, { memos:out.cur.notes.memos.slice(-20) }); s = JSON.stringify(out); }
  let guard = 0;
  while (s.length > LIM && out.cur && out.cur.reveal.length > 40 && guard++ < 6){ out.cur.reveal = out.cur.reveal.filter((c, i, a) => i % 2 === 0 || i === a.length - 1); s = JSON.stringify(out); }
  return s;
}
function save(now){
  clearTimeout(saveTimer);
  const go = () => {
    const s = snapshot();
    if (inFrame){ try { window.parent.postMessage({ type:'ash-store-set', key:SAVE_KEY, data:JSON.parse(s) }, '*'); } catch (e){ /* 부모가 없어도 책은 넘어간다 */ } }
    else { try { localStorage.setItem('ashrain.games.' + SAVE_KEY, s); } catch (e){ /* */ } }
  };
  if (now) go(); else saveTimer = setTimeout(go, 800);
}
const OLD_SELF = { jebi:'swallow', olppaemi:'owl', kkachi:'magpie', durumi:'crane', wren:'wren' };
function mergeSave(d){
  if (!d || typeof d !== 'object') return;
  if (d.v === 4 || d.v === 3){
    // 예전 판(v3)의 다듬은 숫자 · 자아 · 지난 겨울은 이어받고, 이어 하던 겨울은 버린다(세상이 바뀌었다)
    const p0 = d.params || {};
    SAVE.params = Object.fromEntries(Object.entries(p0).filter(([k, v]) => k in DEFAULTS && isFinite(Number(v)) && Number(v) !== DEFAULTS[k]).map(([k, v]) => [k, Number(v)]));
    if (d.self) SAVE.self = Object.assign({ A:0, B:0, C:0, name:'wren', center:0 }, d.self);
    SAVE.runs = Array.isArray(d.runs) ? d.runs.slice(-12) : [];
    SAVE.cur = d.v === 4 && d.cur && d.cur.v === 4 ? d.cur : null;
    SAVE.seen = d.v === 4 ? d.seen || {} : {};
    if (d.mute){ SAVE.mute = true; sndSet(false); }
  } else if (d.v === 1){
    if (d.self) SAVE.self = { A:clamp(Number(d.self.A) || 0, -1, 1), B:clamp(Number(d.self.B) || 0, -1, 1), C:clamp(Number(d.self.C) || 0, -1, 1), name:OLD_SELF[d.self.name] || 'wren', center:0 };
    SAVE.runs = (d.runs || []).slice(-12).map((r) => ({ t:r.t, kind:r.kind === 'win' ? 'spring' : r.kind, days:r.days, self:OLD_SELF[r.self] || 'wren', stars:[], stones:0, coef:r.coef || null, old:true }));
    SAVE.cur = null;
  }
  PR = Object.assign({}, DEFAULTS, SAVE.params);
  C.coverKey = '';
}
function loadSave(){
  if (inFrame){ try { window.parent.postMessage({ type:'ash-store-get', key:SAVE_KEY }, '*'); } catch (e){ /* */ } }
  else { try { mergeSave(JSON.parse(localStorage.getItem('ashrain.games.' + SAVE_KEY) || 'null')); } catch (e){ /* */ } }
}
function post(m){ if (inFrame) try { window.parent.postMessage(m, '*'); } catch (e){ /* */ } }
function toggleFull(){
  const root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen, fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (immersive){ immersive = false; post({ type:'ash-immersive', on:false }); return; }
  if (req) Promise.resolve().then(() => req.call(root)).catch(() => { immersive = true; post({ type:'ash-immersive', on:true }); });
  else { immersive = true; post({ type:'ash-immersive', on:true }); }
}

});

const MEMO = `<p><b>숨은 규칙 — 학생 화면엔 글이 거의 없다. 처음엔 아무것도 알려 주지 않고, 공책에 적은 말에 따라 조금씩 더 알려 준다.</b></p>
<p><b>이름</b> — 첫 장의 '이름'은 닉네임처럼 보이지만 이 땅의 이름이다. 공책 표지의 쪽지에 적히고, 산꼭대기에 올라 땅을 내려다보면 지도 귀퉁이에 적히고, 끝 장의 제목이 된다. 비워 두면 '무제'.</p>
<p><b>흐름</b> — 소극적 정보(걸은 만큼 그려지는 땅 · 연기가 눕는 쪽 · 지나가는 새 떼 · 실제 하늘) → 적극적 정보(공책에 적은 낱말이 숫자 · 기록 쪽 · 장치를 연다, 물음을 적으면 기록을 풀어 보인다) → 소극적 결정(장치 속 기다리기) → 적극적 결정(가지 뽑기 · 얼음 건너기 · 낚시 · 바람막이 세우기 · 길 긋기). 정보를 얻는 네 가지 — 모으는 방법(털기 · 재기 · 헝겊 · 새 잡기 · 걷기), 전해 주는 매개(헝겊 · 연기 · 새 떼 · 눈금 막대 · 얼음 기둥), 적는 것(공책의 메모와 낱말마다의 쪽), 묻는 것(물음으로 적은 메모).</p>
<p><b>낱말 → 열리는 것</b> — 나무 · 숲 · 장작 · 땔감: 숲에 연필 동그라미, 그 곁에 서면 눈 속 가지 장치 · 땔감 숫자 / 강 · 얼음 · 개울: 강가에서 멈춘 자리(여울)에 얼음 재기 장치 / 바다 · 파도 · 물고기 · 낚시: 물가에 물결과 낚시 장치 · 먹을 것 숫자 / 산 · 꼭대기 · 언덕: 꼭대기 표시 · 산 오르기 기록 / 바람 · 눈보라: 움막 곁 헝겊(누르면 살펴봄), 움막 곁에서 움막을 누르면 바람막이 / 불 · 추워 · 따뜻: 땔감 숫자와 기록 / 배고파 · 먹을 · 양식: 먹을 것 숫자와 기록 / 새 · 까마귀 · 갈매기: 새 떼에 테가 생겨 눌러 잡을 수 있다 / 봄 · 겨울 · 며칠 · 하루: 책갈피 끈(봄까지) · 멈춤 · 빠르기 · 길을 그을 때 걸릴 날 / 하늘 · 해 · 달: 이 땅의 오늘 해 높이. 낱말이 열리면 공책 쪽 고르는 곳에 작은 그림이 생기고, 공책을 덮으면 그 자리에 연필 동그라미가 그려진다.</p>
<p><b>물음</b> — '?' · 왜 · 어떻게 · 언제 · 얼마나 · 어디 · 몇 · …까/니/나요 로 적으면 그 낱말(없으면 바로 전 낱말)의 쪽이 기록을 풀어 보인다: 숲은 비율 막대, 강은 잰 점을 잇는 줄과 버티는 두께와 만나는 날, 바다는 잔잔한 골과 골 사이(주기), 바람은 늘 부는 쪽과 그 뒤의 그늘, 불 · 먹을 것은 바닥에 닿는 날, 새는 까마귀 뒤의 한겨울, 산은 곧장 올랐다면 걸렸을 날, 날은 다섯씩 묶은 셈, 하늘은 한낮의 높이.</p>
<p><b>손</b> — 한 손가락: 누르면 그리로 걷는다(공책에 적은 자리 곁이면 장치가 펼쳐진다), 나에게서 끌면 길을 긋는다, 빈 곳을 끌면 지도를 옮긴다. 두 손가락: 당겨 보기 · 옮기기(마우스는 휠). 걷는 중에 다시 누르거나 그으면 그 자리에서 방향을 바꾼다. 덤불을 건드리면 굴뚝새가 튀어나온다(아무 정보 없음).</p>
<p><b>숲 · 눈 속 가지</b> — 눈더미 둘에 마른 가지와 썩은 가지가 섞여 있다. 끝을 톡 눌러 눈을 털어 보고(살펴보기 — 한 번 털어야 뽑힌다) 끝까지 끌어 뽑는다. 두 더미의 마른 가지 비율이 다르다(약 0.78과 0.42). 편법: 썩은 가지 끝은 아주 조금 이끼빛. 비율이 낮은 더미에서 다섯 번 연달아 마른 가지 → 별.</p>
<p><b>강 · 얼음 재기</b> — 두께 = 처음 두께 + 하루에 느는 만큼 × 날(일차함수). 송곳을 얼음에 끌어 재고(살펴보기), 모래시계로 기다리고(기다리기), 나를 얼음 위로 끌어 건넌다(해 보기 — 두 번 재거나 한 번 기다린 뒤). 버티는 두께(기본 12)보다 얇으면 빠져서 먹을 것 · 땔감을 잃는다. 두 번 이상 재고, 버틸 수 있게 된 날로부터 0.75일 안에 건너면 → 별. 한겨울엔 물이 돌처럼 얼어 아무 데서나 건넌다(별은 없음). 건너편엔 더 큰 숲.</p>
<p><b>바다 · 물결과 낚시</b> — 물결 높이는 며칠(5.5~8일) 주기로 오르내린다. 눈금 막대를 눌러 재고, 기다리고, 낚싯대를 끌어 던진다. 잔잔하면 많이(3), 너울이면 조금(1.2), 폭풍이면 젖어서 먹을 것을 잃는다. 같은 날 거듭 나가면 0.6배씩. 갈매기가 뭍으로 몰리면 이튿날 폭풍. 서로 다른 사흘 이상 재고 잔잔할 때 세 번 연달아 → 별.</p>
<p><b>바람 그늘</b> — 처음 움막은 바람을 그대로 맞는다(연기가 눕는다). 바람을 눈여겨본 뒤 움막 곁에서 움막을 누르면 바람막이(땔감 2)를 끌어다 세울 수 있다. 바람이 불어 오는 쪽에 세우면 땔감이 0.6배만 든다(연기가 곧게 선다). 헝겊을 한 번이라도 살펴본 뒤 그늘을 만들면 → 별.</p>
<p><b>산 · 기울기</b> — 산에서는 곧장 오르면 느리고(0.42배) 옆으로 갈수록 덜 느리다. 곧장 위에서 30~40° 기울여 갈지자로 길을 그어 오르면 3할쯤 빠르다(누르기만 하면 곧장 오른다). 오른 높이를 곧장 올랐을 때보다 15% 넘게 빨리 꼭대기에 닿으면 → 별. 꼭대기에 서면 땅이 넓게 그려지고 지도 귀퉁이에 이름이 적힌다.</p>
<p><b>새</b> — 까마귀 떼는 한겨울 며칠 앞에 남쪽으로 간다. 새를 눈여겨본 뒤 눌러 잡으면 한겨울을 미리 안다(한겨울 땔감 2배 → 1.6배, 책갈피에 푸른 띠). 갈매기는 폭풍 앞에 뭍으로 온다. 새 떼는 까닭이 있을 때만 온다.</p>
<p><b>독수리</b> — 산에 살며 며칠마다 하늘을 지나간다. 지나간 뒤로 장치 왼쪽 위에 깃털이 있다. 누르면 답(실제 비율 · 줄 · 물결)이 보이지만 움막에서 가장 가까운 덤불 하나가 돌이 되고(바람 그늘이 사라질 수 있다) 그 장치의 별은 받을 수 없다. 돌이 여섯이면 독수리의 겨울.</p>
<p><b>살림 · 끝</b> — 이 땅엔 나 혼자다. 하루에 먹을 것 0.35, 땔감 0.45(그늘이면 0.6배, 밤엔 1.15배, 한겨울엔 2배). 시작은 땔감 · 먹을 것 7씩(등짐으로 지고 왔다). 땔감이 바닥나 이틀 넘게 추우면 얼어서, 먹을 것이 바닥나 사흘 넘게 굶으면 끝. 30일을 버티면 봄.</p>
<p><b>밤낮 · 날짜</b> — 밤낮은 실제 시각을 따른다. 세상이 생길 때 씨앗으로 지구 위 실제 자리(위도 · 경도)를 정하고, 그 자리의 지금 해 높이로 새벽 · 낮 · 노을 · 밤이 된다(달은 실제 위상). 자리는 어디에도 나오지 않는다. 날짜는 책을 펼쳐 노는 동안에만 흐른다(하루 15초, 공책을 펴 두면 멈춘다, 장치 속에선 손을 쓸 때만).</p>
<p><b>자아</b> — 살펴보기(털기 · 재기 · 헝겊 · 새 · 물음) ↔ 해 보기(뽑기 · 건너기 · 낚시 · 길 · 바람막이), 해 보기 전에 두 번 넘게 살폈나(신중 ↔ 결단), 독수리에 기대나(기대기 ↔ 맞서기). 올빼미 · 까치 · 제비 · 두루미 · 굴뚝새(가운데). 끝 장의 새 그림으로만 나온다.</p>`;
