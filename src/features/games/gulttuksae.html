<!--
  무제 v4 (예전 이름 굴뚝새) — 나 혼자인 땅의 겨울 · 그림책(1막 스페이스, 베타). 한 장짜리 HTML, 바깥 의존은 구글 폰트뿐.
  앱에서는 시록고(강사앱) #/games(src/apps/seirocco/pages/Games.jsx)가 샌드박스 iframe 으로 띄운다.
  · 테마: <html data-theme> + postMessage({ type: "ash-theme" }) · 전체 화면: Fullscreen API, 막히면 { type: "ash-immersive", on }
  · 저장: 샌드박스라 localStorage 를 못 쓰면 부모에게 { type: "ash-store-get" | "ash-store-set", key: "gulttuksae", data } 로 맡긴다(20KB 까지).
  · window.__gulttuksae() — 스모크 테스트가 읽는 상태 요약, window.__gtDebug — 시험용 갈고리.
  표지(천 공책, 쪽지에 '무제') → 첫 장에 '이름' 한 줄(닉네임처럼 적지만 이 땅의 이름이 된다) → 빈 종이에 움막과 내가 생긴다.
  처음엔 아무것도 알려 주지 않는다 — 걷고(누르기 · 긋기), 지도를 당겨 보고 옮기고(두 손가락 · 휠), 공책에 적을 수 있을 뿐.
  공책에 적은 낱말이 하나씩 연다: 숫자 · 기록 쪽 · 장치(눈 속 가지 · 얼음 재기 · 물결과 낚시) · 헝겊과 바람막이 · 새 잡기.
  물음으로 적으면 기록을 풀어 보인다. 장치마다 숨은 규칙(비율 · 일차함수 · 주기 · 바람 그늘 · 산의 기울기)이 있고, 해 보면서 찾아낸다.
  설계 문서: 프로젝트 claude/굴뚝새.md(강사용 숨은 규칙 메모 포함)
-->

<script>
'use strict';
(function(){
/* =================== 3-core: 도구 · 종이 · 먹 · 물감 · 그림 조각 · 소리 =================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const nowMs = () => performance.now();
const $ = (id) => document.getElementById(id);
function mulberry(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashS(s){ let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const fmtN = (x) => { const v = Math.round(x * 10) / 10; return (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1)); };
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function hexA(h, a){ const n = parseInt(String(h).slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function mixHex(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const m = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, t)); return `rgb(${m(16)},${m(8)},${m(0)})`; }

/* ---------- 빛깔 — 낮의 종이 · 밤의 종이 ---------- */
const PAL_L = {
  desk0:'#2A231E', desk1:'#3B3029', paper:'#F3EDE1', paperBack:'#EDE5D6', fiber:'rgba(120,98,66,', vig:'rgba(96,74,46,.16)',
  ink:'#2F2924', snowSh:'#C6D1DA', snowSh2:'#AEBCC8', grass:'#B9A77A',
  furze:'#5E6B37', furze2:'#46532A', bloom:'#E2AE32', pine:'#3D5946', pine2:'#2C4536', trunk:'#6E5138',
  river:'#A8C2CF', ice:'#E4EDF2', iceThin:'#7F98A8', sea:'#7896A8', sea2:'#56768B', foam:'rgba(255,255,255,.85)', sand:'#D9C9A5',
  mount:'#B3BDC6', mount2:'#8E9CA9', roof:'#B25A3B', wall:'#EAD9BD', wood:'#8B6643', grain:'#D7B158', stone:'#9C978F', stone2:'#7B766E',
  blossom:'#E79AB3', blossom2:'#F4C6D4', spring:'#9DBB78',
  night:'#2B3456', warm:'255,212,138', dawn:'244,176,160', dusk:'236,158,104', glow:'255,196,108', smoke:'#9AA3AB',
  calm:'#A7CADB', swell:'#7E97A8', storm:'#3C4862', lantern:'#F0B43C', frost:'rgba(255,255,255,', shadow:'rgba(40,30,20,.16)',
  cloth:'#3A4046', cloth2:'#2E3338', label:'#F1ECE2', band:'#1D2023', pencil:'#5C5650',
};
const PAL_D = {
  desk0:'#0B0C0E', desk1:'#15171A', paper:'#20262D', paperBack:'#262C34', fiber:'rgba(220,210,190,', vig:'rgba(0,0,0,.38)',
  ink:'#E0D8C8', snowSh:'#2F3A46', snowSh2:'#3B4856', grass:'#6E6650',
  furze:'#4E5C30', furze2:'#3B4724', bloom:'#C89A2E', pine:'#2F4A3B', pine2:'#243A2E', trunk:'#5B4430',
  river:'#3E5A6A', ice:'#5B7383', iceThin:'#2A3B47', sea:'#35566B', sea2:'#26425A', foam:'rgba(210,228,240,.55)', sand:'#5B5141',
  mount:'#46525E', mount2:'#36424E', roof:'#8E4429', wall:'#4A4236', wood:'#7A5A3B', grain:'#B8954A', stone:'#6A665F', stone2:'#55514B',
  blossom:'#C27A93', blossom2:'#D79AB0', spring:'#6E8B55',
  night:'#3A4570', warm:'255,196,120', dawn:'230,150,140', dusk:'220,140,90', glow:'255,186,96', smoke:'#6C757D',
  calm:'#5E8BA3', swell:'#4B6475', storm:'#1E2638', lantern:'#E9A92F', frost:'rgba(190,214,236,', shadow:'rgba(0,0,0,.35)',
  cloth:'#4A5058', cloth2:'#3C4148', label:'#E6E0D4', band:'#16181B', pencil:'#B9B1A4',
};
let PAL = PAL_L;
const isDark = () => PAL === PAL_D;
// 다섯 자아의 빛깔 — 이름은 끝 장에만 나온다
const SELVES = {
  wren:{ name:'굴뚝새', color:'#A0703F' }, swallow:{ name:'제비', color:'#2C6A8A' }, owl:{ name:'올빼미', color:'#7A5C9E' },
  magpie:{ name:'까치', color:'#2E7D74' }, crane:{ name:'두루미', color:'#B8433A' },
};

/* ---------- 쪽 · 그림판 좌표 ---------- */
// 화면 = 펼친 책 한 쪽(P). 세상은 그 안의 일정한 비율 그림판(Wr, 가로 : 세로 = WA)에 그린다 — 어떤 기기든 같은 세상.
const WA = 1.45;
let W = 0, H = 0, DPR = 1, CDPR = 1;
const P = { x:0, y:0, w:0, h:0 }, Wr = { x:0, y:0, w:0, h:0 };
// 보는 눈(카메라) — z 배로 당겨 본다. (ox, oy) = 그림판(Wr)의 왼쪽 위에 세상의 어디가 오나.
// 당겨 보면 세상은 그림판을 넘어 보이는 자리(VR = 위의 작은 그림들 아래의 쪽 전체)까지 찬다.
const CAM = { z:1, ox:0, oy:0, movedAt:0 }, VR = { x:0, y:0, w:0, h:0 };
const X = (u) => Wr.x + (u - CAM.ox) * CAM.z * Wr.w, Y = (v) => Wr.y + (v - CAM.oy) * CAM.z * Wr.h;
const U = (x) => CAM.ox + (x - Wr.x) / (CAM.z * Wr.w), V = (y) => CAM.oy + (y - Wr.y) / (CAM.z * Wr.h);
const ZMIN = 1;
const zFill = () => Math.max(1, VR.w / Math.max(1, Wr.w), VR.h / Math.max(1, Wr.h));   // 보이는 자리를 꽉 채우는 배율
const zMax = () => Math.max(4, zFill() * 2.2);
function camClamp(){
  CAM.z = clamp(CAM.z, ZMIN, zMax());
  const ww = Wr.w * CAM.z, wh = Wr.h * CAM.z;
  // 세상이 보이는 자리보다 작으면 가운데, 크면 가장자리가 안쪽으로 들어오지 않게
  CAM.ox = ww <= VR.w + 0.5 ? (Wr.x - (VR.x + (VR.w - ww) / 2)) / ww : clamp(CAM.ox, (Wr.x - VR.x) / ww, (Wr.x - VR.x - VR.w) / ww + 1);
  CAM.oy = wh <= VR.h + 0.5 ? (Wr.y - (VR.y + (VR.h - wh) / 2)) / wh : clamp(CAM.oy, (Wr.y - VR.y) / wh, (Wr.y - VR.y - VR.h) / wh + 1);
}
// 화면의 (x, y)를 붙든 채 z 배로
function camZoomAt(x, y, z){ const u = U(x), v = V(y); CAM.z = clamp(z, ZMIN, zMax()); CAM.ox = u - (x - Wr.x) / (CAM.z * Wr.w); CAM.oy = v - (y - Wr.y) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); }
// 보이는 자리의 가운데에 (u, v)가 오게
function camCenter(u, v, z){ if (z) CAM.z = clamp(z, ZMIN, zMax()); CAM.ox = u - (VR.x + VR.w / 2 - Wr.x) / (CAM.z * Wr.w); CAM.oy = v - (VR.y + VR.h / 2 - Wr.y) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); }
const camMid = () => ({ u:U(VR.x + VR.w / 2), v:V(VR.y + VR.h / 2) });
const dist = (a, b) => Math.hypot(a.u - b.u, (a.v - b.v) / WA);      // 그림판 너비 = 1

/* ---------- 먹선 · 물감 ---------- */
const mid = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });
function smoothPath(g, pts, closed){
  const n = pts.length; if (n < 2) return;
  g.beginPath();
  if (closed){ let m = mid(pts[n - 1], pts[0]); g.moveTo(m.x, m.y); for (let i = 0; i < n; i++){ const p = pts[i], mm = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p.x, p.y, mm.x, mm.y); } g.closePath(); }
  else { g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n - 1; i++){ const mm = mid(pts[i], pts[i + 1]); g.quadraticCurveTo(pts[i].x, pts[i].y, mm.x, mm.y); } g.lineTo(pts[n - 1].x, pts[n - 1].y); }
}
const wob = (pts, amp, R) => pts.map((p) => ({ x:p.x + (R() - 0.5) * amp, y:p.y + (R() - 0.5) * amp }));
// 손으로 그은 듯 — 두 번 긋는다
function inkLine(g, pts, w, col, R, a){
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col;
  g.globalAlpha = a === undefined ? 1 : a; g.lineWidth = w; smoothPath(g, R ? wob(pts, w * 0.7, R) : pts); g.stroke();
  if (R){ g.globalAlpha = (a === undefined ? 1 : a) * 0.3; g.lineWidth = w * 0.55; smoothPath(g, wob(pts, w * 1.8, R)); g.stroke(); }
  g.globalAlpha = 1;
}
// 곧은 먹선(집 · 나무 · 상자) — 손 떨림만 조금
function inkPoly(g, pts, w, col, R, a, closed){

function genBushes(R){
  const out = [], wb = windBase();
  // 처음 움막은 바람을 그대로 맞는다 — 바람 부는 쪽 가까이에는 덤불을 두지 않는다(바람막이를 지을 까닭)
  const shades = (p) => { const dx = HOME.u - p.u, dy = (HOME.v - p.v) / WA, d = Math.hypot(dx, dy); return d < 0.075 && (dx * wb.x + dy * wb.y) / (d || 1) > Math.cos(1.1); };
  const ok = (p, gap) => p.u > 0.03 && p.u < 0.97 && p.v > 0.05 && p.v < 0.97 && !inSea({ u:p.u, v:p.v + 0.02 }) && !inMount(p) && !nearRiver(p, 0.045)
    && Object.values(S.sites).every((x) => x.type === 'river' || dist(p, x) > 0.075) && dist(p, HOME) > 0.045 && !shades(p) && out.every((b) => dist(p, b) > gap);
  let tries = 0;
  while (out.length < 22 && tries++ < 800){ const a = R() * TAU, d = 0.05 + R() * 0.15, p = { u:HOME.u + Math.cos(a) * d, v:HOME.v + Math.sin(a) * d * WA * 0.8 }; if (ok(p, 0.028)) out.push({ u:p.u, v:p.v, s:0.8 + R() * 0.5, seed:Math.floor(R() * 1e9) }); }
  tries = 0;
  while (out.length < 58 && tries++ < 2000){ const p = { u:R(), v:R() }; if (ok(p, 0.045)) out.push({ u:p.u, v:p.v, s:0.6 + R() * 0.6, seed:Math.floor(R() * 1e9) }); }
  return out;
}
// 바람 그늘 — 바람이 불어 오는 쪽 가까이에 덤불이나 바람막이가 서 있으면
function leeOf(p){
  const w = windBase();
  const by = (q, near, far) => { const dx = p.u - q.u, dy = (p.v - q.v) / WA, d = Math.hypot(dx, dy); if (d < near || d > far) return false; return (dx * w.x + dy * w.y) / d > Math.cos(0.95); };
  return S.bushes.some((b) => !b.stone && by(b, 0.012, 0.062)) || (S.fences || []).some((f) => by(f, 0.006, 0.05));
}
function buildWorld(seed){
  const R = mulberry(seed);
  S.world = genWorld(R);
  S.sites = genSites(R);
  S.bushes = genBushes(R);
}

/* ---------- 새 겨울 — 공책 한 권 ---------- */
function newSeason(name){
  const seed = (Math.random() * 2147483647) | 0;
  S = { v:4, seed, geo:geoOf(seed), name:String(name || '').trim().slice(0, 16) || '무제', day:0, speed:1, over:null,
    res:{ wood:PR.startWood, food:PR.startFood }, hungry:0, coldT:0, cold:false,
    me:{ u:HOME.u, v:HOME.v }, home:{ u:HOME.u, v:HOME.v, lee:false, seed:hashS('home' + seed), data:{} }, fences:[],
    stones:[], stars:{}, paths:[], walk:null, blocked:null, reveal:[], riverCrossed:false,
    signs:[], nextSign:2 + Math.random(), eagleNext:PR.eagleEvery ? PR.eagleEvery * (0.55 + Math.random() * 0.3) : 1e9, eagleSeen:false,
    forming:0, maskN:0,
    mw:{ start:PR.mwFrom + Math.random() * Math.max(0, PR.mwTo - PR.mwFrom), len:PR.mwLen, on:false, known:false, done:false },
    notes:{ memos:[], noted:{}, asked:{}, q:0, last:null },
    logs:{ res:[], wind:[], birds:[], lastRes:-1, lastWind:-1 },
    stats:{ probes:0, commits:0, eagle:0, pulls:0, good:0, brushes:0, drills:0, waits:0, reads:0, casts:0, fences:0, signs:0, missed:0, paths:0, walked:0, memos:0, questions:0, rag:0 },
    seen:{} };
  buildWorld(seed);
  S.home.lee = leeOf(S.home);
  S.reveal.push({ u:HOME.u, v:HOME.v, r:0.13 });
  return S;
}

/* ---------- 자아 — 고르지 않고 쌓인다 ---------- */
function sigmaOf(name){
  const s = SAVE.self, a = Math.abs(s.A), b = Math.abs(s.B);
  if (name === 'wren') return clamp(1 - Math.max(a, b) / 0.25, 0, 1);
  return clamp((Math.min(a, b) * 0.6 + Math.max(a, b) * 0.4 - 0.25) / 0.75, 0, 1);
}
function quadOf(A, B){ return A >= 0 ? (B >= 0 ? 'owl' : 'magpie') : (B >= 0 ? 'crane' : 'swallow'); }
function updateName(){
  const s = SAVE.self, m = Math.max(Math.abs(s.A), Math.abs(s.B));
  if (s.name === 'wren'){ if (m >= 0.25) s.name = quadOf(s.A, s.B); }
  else if (m < 0.15) s.name = 'wren';
  else { const q = quadOf(s.A, s.B); if (q !== s.name && Math.min(Math.abs(s.A), Math.abs(s.B)) > 0.08) s.name = q; }
}
function nudge(kind, w){
  const s = SAVE.self, a = PR.selfAlpha * (w === undefined ? 1 : w);
  if (kind === 'probe') s.A += a * (1 - s.A);
  else if (kind === 'commit') s.A += a * (-1 - s.A);
  else if (kind === 'careful') s.B += a * (1 - s.B);
  else if (kind === 'bold') s.B += a * (-1 - s.B);
  else if (kind === 'lean') s.C += a * (-1 - s.C);
  else if (kind === 'alone') s.C += a * (1 - s.C);
  s.A = clamp(s.A, -1, 1); s.B = clamp(s.B, -1, 1); s.C = clamp(s.C, -1, 1);
  updateName();
}
function rates(){
  const n = SAVE.self.name, sg = sigmaOf(n) * PR.selfK;
  return {
    walk:n === 'swallow' ? 1 + 0.3 * sg : n === 'owl' ? 1 - 0.1 * sg : 1,
    probe:n === 'owl' ? 1 - 0.4 * sg : n === 'swallow' ? 1 + 0.2 * sg : 1,
    signLife:n === 'magpie' ? 1 + 0.6 * sg : 1,
    tell:n === 'magpie' ? 1 + sg : 1,
    wait:n === 'crane' ? 1 - 0.3 * sg : 1,
    burn:n === 'crane' ? 1 - 0.1 * sg : 1,
    eat:n === 'wren' ? 1 - 0.15 * sg : 1,
  };
}
// 살펴보기와 해 보기 — 해 보기 전에 몇 번 살폈는지가 '신중 ↔ 결단'
function probe(site, w){ S.stats.probes++; if (site) site.data.since = (site.data.since || 0) + 1; nudge('probe', w); }
function commit(site, w){ S.stats.commits++; nudge('commit', w); if (site){ nudge((site.data.since || 0) >= 2 ? 'careful' : 'bold', w); site.data.since = 0; } }
function discover(key){
  if (S.stars[key]) return;
  S.stars[key] = r1(S.day);
  fx('star', { key }); SFX.star(); nudge('alone', 0.6);
}

/* ---------- 공책 — 볼거리가 있는 것을 누르면 쪽지가 뜨고, 거기에 적으면 그것을 '눈여겨봄'이 된다 ----------
   눈여겨본 것은 공책이 저절로 지켜보며 적고(바람 · 땔감 · 양식 · 날 · 새 · 가지 · 얼음 · 물결 · 산), 물음(? · 왜 · 어떻게 · 언제 …)으로 적으면
   그 쪽이 기록을 풀어 보인다(줄 · 비율 · 주기 · 곡선). 볼거리가 없는 것(덤불 등)은 쪽지가 뜨지 않는다. */
const SUBJ_IDS = ['wind', 'fire', 'food', 'time', 'birds', 'wood', 'ice', 'sea', 'mount'];
const QRE = /[?？]|왜|어떻게|언제|얼마나|어디|무엇|뭘|뭐|몇|누구|(까|니|냐|나요|가요|까요)\s*[.!~…]*\s*$/;
let onNoted = () => {};
function writeNote(subj, text){
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 140);
  if (!text || !S || S.over || !SUBJ_IDS.includes(subj)) return null;
  const N = S.notes, q = QRE.test(text), fresh = N.noted[subj] === undefined, ask = q && N.asked[subj] === undefined;
  N.memos.push({ d:r1(S.day), t:text, s:[subj], q:q ? 1 : 0 }); if (N.memos.length > 40) N.memos.shift();
  S.stats.memos++;
  if (fresh) N.noted[subj] = r1(S.day);
  if (q){ S.stats.questions++; N.q++; if (ask) N.asked[subj] = r1(S.day); nudge('probe', 0.4); }
  N.last = subj;
  if (fresh) onNoted(subj);
  return { fresh, asked:ask, subj, q };
}
const noted = (id) => !!(S && S.notes.noted[id] !== undefined);
const asked = (id) => !!(S && S.notes.asked[id] !== undefined);
// 어떤 자리가 어떤 낱말로 열리나
const SITE_SUBJ = { forest:'wood', river:'ice', shore:'sea', trail:'mount', summit:'mount' };
const siteNoted = (st) => noted(SITE_SUBJ[st.type]);

/* ---------- 시간 ---------- */
function tick(dt){
  if (!S || S.over || dt <= 0) return;
  S.day += dt;
  const R = rates(), night = tod() === 'night';
  mwCheck();
  S.res.food -= PR.eat * R.eat * dt;
  S.res.wood -= PR.burn * dt * (S.home.lee ? PR.leeBurn : 1) * R.burn * (S.mw.on ? (S.mw.known ? PR.mwBurnKnown : PR.mwBurn) : 1) * (night ? 1.15 : 1);
  if (S.res.food <= 0){ S.res.food = 0; S.hungry += dt; } else S.hungry = Math.max(0, S.hungry - dt * 0.5);
  if (S.res.wood <= 0){ S.res.wood = 0; S.cold = true; S.coldT += dt; } else { S.cold = false; S.coldT = Math.max(0, S.coldT - dt * 0.5); }
  logStep();
  walkStep(dt);
  signStep();
  eagleStep();
  if (S.coldT > PR.coldEnd){ endSeason('cold'); return; }
  if (S.hungry > PR.hungerEnd){ endSeason('hunger'); return; }
  if (S.day >= PR.seasonDays) endSeason('spring');
}
function mwCheck(){
  const m = S.mw;
  if (!m.on && !m.done && S.day >= m.start){ m.on = true; fx('ring', { color:'#9CC2DA' }); SFX.wind(); }
  if (m.on && S.day >= m.start + m.len){ m.on = false; m.done = true; }
}
// 공책이 저절로 적는 것 — 살림의 숫자(불 · 먹을 것을 눈여겨본 뒤), 바람(헝겊을 묶은 뒤)
function logStep(){
  const L = S.logs;
  if (S.day - L.lastRes >= 0.5){ L.lastRes = S.day; L.res.push([r1(S.day), r1(S.res.wood), r1(S.res.food)]); if (L.res.length > 70) L.res.shift(); }
  if (noted('wind') && S.day - L.lastWind >= 1){ L.lastWind = S.day; const w = windNow(); L.wind.push([r1(S.day), r2(Math.atan2(w.y, w.x))]); if (L.wind.length > 30) L.wind.shift(); }
}

/* ---------- 길 — 내가 선 자리에서 손가락으로 긋고, 걸은 만큼 세상이 그려진다 ---------- */
function polyCum(pts){ const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i])); return c; }
function ptAt(pts, cum, s){
  if (s <= 0) return { u:pts[0].u, v:pts[0].v };
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s){ const t = (s - cum[i - 1]) / Math.max(1e-9, cum[i] - cum[i - 1]); return { u:lerp(pts[i - 1].u, pts[i].u, t), v:lerp(pts[i - 1].v, pts[i].v, t) }; } }
  const l = pts[pts.length - 1]; return { u:l.u, v:l.v };
}
function dirAt(pts, cum, s){
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s || i === pts.length - 1){ const a = pts[i - 1], b = pts[i], dx = b.u - a.u, dy = (b.v - a.v) / WA, d = Math.hypot(dx, dy) || 1; return { x:dx / d, y:dy / d }; } }
  return { x:1, y:0 };
}
const pathAt = (p, s) => ptAt(p.pts, p.cum, s);
// 내가 지금 선 자리
function mePos(){ if (S.walk){ const p = S.paths[S.walk.pi]; return pathAt(p, p.walked); } return S.me; }
const atHome = () => !S.walk && dist(S.me, S.home) < 0.05;
function walkSpeed(pos, dir){
  let k = PR.walk * rates().walk * (S.mw.on ? 0.5 : 1);
  if (S.cold) k *= 0.8;
  if (S.res.food <= 0) k *= 0.75;      // 굶으면 걸음이 무겁다
  return Math.max(0.02, k);
}
// 그린 선을 실제 길로 — 바다 앞에서 멈추고, 강은 건너기 전까지 둑에서 멈춘다(얼음이 버틸지 모르니까)
// 그린 선을 실제 길로 — 바다 앞 · 산기슭에서 멈추고, 강은 건너기 전까지 둑에서 멈춘다(그 자리가 들어가는 자리가 된다)
function bsearch(a, b, f){ let lo = 0, hi = 1; for (let k = 0; k < 18; k++){ const m = (lo + hi) / 2; if (f({ u:lerp(a.u, b.u, m), v:lerp(a.v, b.v, m) })) hi = m; else lo = m; } return lo; }
function densify(pts, step){
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++){ const a = pts[i - 1], b = pts[i], n = Math.ceil(dist(a, b) / step); for (let k = 1; k <= n; k++) out.push({ u:lerp(a.u, b.u, k / n), v:lerp(a.v, b.v, k / n) }); }
  return out;
}
function makePath(raw, from){
  let pts = densify(raw.map((p) => ({ u:clamp(p.u, 0.01, 0.99), v:clamp(p.v, 0.01, 0.985) })), 0.02);
  let rest = null, cross = null, stop = null, edge = null;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i], ev = [];
    if (inSea(b)) ev.push(['sea', bsearch(a, b, inSea)]);
    if (!inMount(a) && inMount(b)) ev.push(['mount', bsearch(a, b, inMount)]);
    if (!S.riverCrossed && !S.mw.on && riverSide(a) !== riverSide(b)){ const sa = riverSide(a); ev.push(['river', bsearch(a, b, (q) => riverSide(q) !== sa)]); }
    if (!ev.length) continue;
    ev.sort((x, y) => x[1] - y[1]);
    const [kind, t] = ev[0], len = dist(a, b) || 1;
    if (kind === 'sea' || kind === 'mount'){
      // 바다 · 산에 닿는 자리(edge)는 들어가는 자리 — 나는 조금 앞에서 멈춘다(자리와 내가 겹치지 않게)
      edge = { u:lerp(a.u, b.u, t), v:lerp(a.v, b.v, t) };
      const cut = pts.slice(0, i).concat([edge]), cc = polyCum(cut), Lk = Math.max(0, cc[cc.length - 1] - 0.034);
      pts = cut.filter((q, j) => cc[j] < Lk).concat([ptAt(cut, cc, Lk)]); if (pts.length < 2) pts.unshift(cut[0]);
      stop = kind; break;
    }
    const back = Math.min(t, 0.03 / len);
    cross = { u:lerp(a.u, b.u, t), v:lerp(a.v, b.v, t) };
    const bank = { u:lerp(a.u, b.u, t - back), v:lerp(a.v, b.v, t - back) }, far = { u:lerp(a.u, b.u, Math.min(1, t + back * 1.2)), v:lerp(a.v, b.v, Math.min(1, t + back * 1.2)) };
    rest = [far].concat(pts.slice(i)); pts = pts.slice(0, i).concat([bank]); stop = 'river'; break;
  }
  const cum = polyCum(pts);
  return { pts, cum, L:cum[cum.length - 1], from, walked:0, done:false, rest, cross, stop, edge, t0:S.day };
}
function startPath(raw){
  if (S.walk || S.over || raw.length < 2) return null;
  const p = makePath([{ u:S.me.u, v:S.me.v }].concat(raw.slice(1)), { pi:S.paths.length - 1 });
  if (p.L < 0.02 && !p.rest){ if (p.edge) placeStop(p); return null; }
  S.paths.push(p); S.walk = { pi:S.paths.length - 1 }; S.stats.paths++; S.blocked = null;
  commit(null, 0.4);
  SFX.scratch();
  return p;
}
function revealAt(pos, r){
  const last = S.reveal[S.reveal.length - 1];
  if (!r && last && dist(last, pos) < 0.022) return;
  S.reveal.push({ u:r2(pos.u * 10) / 10, v:r2(pos.v * 10) / 10, r:r || PR.revealR });
  S.maskN++;
  Object.values(S.sites).forEach((st) => { if (!st.found && st.type === 'forest' && dist(st, pos) < (r || PR.revealR) + 0.03){ st.found = true; if (siteNoted(st)) fx('note', { u:st.u, v:st.v, seed:st.seed, r:0.046 }); } });
}
function linkCheck(pos){
  Object.values(S.sites).forEach((st) => {
    if (st.type !== 'forest' || st.linked) return;
    if (dist(st, pos) < 0.05){ st.found = true; st.linked = true; fx('link', { u:st.u, v:st.v }); SFX.good(); }
  });
}

function walkStep(dt){
  const wk = S.walk; if (!wk) return;
  const p = S.paths[wk.pi];
  let remain = dt, guard = 0;
  while (remain > 1e-7 && p.walked < p.L - 1e-9 && guard++ < 200){
    const pos = pathAt(p, p.walked), sp = walkSpeed(pos, dirAt(p.pts, p.cum, p.walked + 1e-4));
    const step = Math.min(sp * remain, p.L - p.walked, 0.008);
    p.walked += step; remain -= step / sp; S.stats.walked += step;
    const np = pathAt(p, p.walked);
    revealAt(np); linkCheck(np);
  }
  if (p.walked >= p.L - 1e-9){
    p.done = true; p.t1 = S.day; p.doneAt = nowMs(); S.walk = null;
    const end = pathAt(p, p.L); S.me = { u:end.u, v:end.v };
    placeStop(p);
  }
}
// 멈춘 자리 앞이 들어가는 자리 — 강(여울) · 산기슭(돌무더기) · 물가(배)
function placeStop(p){
  const place = (id, at, r) => { const st = S.sites[id], fresh = !st.placed; Object.assign(st, { u:at.u, v:at.v, placed:true, found:true, linked:true }); if (fresh){ fx('link', { u:st.u, v:st.v }); SFX.good(); } if (siteNoted(st)) fx('note', { u:st.u, v:st.v, seed:st.seed, r }); return st; };
  if (p.stop === 'river' && p.rest){ place('ford', p.cross, 0.024); S.blocked = { pi:S.paths.indexOf(p) }; }
  else if (p.stop === 'mount' && p.edge) place('trail', p.edge, 0.026);
  else if (p.stop === 'sea' && p.edge) place('shore', p.edge, 0.03);
}
// 지나간 자취는 곧 사라진다(걸은 만큼 그려진 땅은 남는다)
function prunePaths(now){
  if (S.walk) return;
  const bp = S.blocked ? S.paths[S.blocked.pi] : null;
  const keep = S.paths.filter((p) => !p.done || p === bp || (p.doneAt && now - p.doneAt < PR.trailMs + 1600));
  if (keep.length === S.paths.length) return;
  S.paths = keep; if (bp) S.blocked.pi = S.paths.indexOf(bp);
}
// 걷다가 다른 데로 — 지금 선 자리에서 길을 끊는다
function cutWalk(){
  const wk = S.walk; if (!wk) return false;
  const p = S.paths[wk.pi], at = p.walked, pos = pathAt(p, at), keep = [];
  for (let i = 0; i < p.pts.length && p.cum[i] < at; i++) keep.push(p.pts[i]);
  keep.push({ u:pos.u, v:pos.v }); if (keep.length < 2) keep.unshift({ u:pos.u, v:pos.v });
  p.pts = keep; p.cum = polyCum(keep); p.L = p.cum[p.cum.length - 1]; p.walked = p.L; p.done = true; p.rest = null; p.cross = null; p.stop = null; p.t1 = S.day; p.doneAt = nowMs();
  S.walk = null; S.me = { u:pos.u, v:pos.v };
  return true;
}
// 얼음을 건넜다 — 멈춘 길이 이어진다
function resumeAcross(){
  const b = S.blocked; if (!b) return;
  const p = S.paths[b.pi];
  if (p && p.rest){ p.pts = p.pts.concat(p.rest); p.cum = polyCum(p.pts); p.L = p.cum[p.cum.length - 1]; p.rest = null; p.stop = null; p.done = false; S.walk = { pi:b.pi }; }
  S.blocked = null;
}
// 길이 걸릴 날 — 그리는 동안 손끝에 해로 보여 준다
function estimateDays(raw){
  const p = makePath(raw, null); let t = 0;
  for (let s = 0; s < p.L; s += 0.01){ const pos = pathAt(p, s); t += Math.min(0.01, p.L - s) / walkSpeed(pos, dirAt(p.pts, p.cum, s + 1e-4)); }
  return { days:t, blocked:!!p.rest, end:p.pts[p.pts.length - 1] };
}

/* ---------- 바람막이 — 바람을 눈여겨본 뒤, 움막 둘레에 가지를 엮어 세운다 ---------- */
function fenceSpotOk(p){
  const d = dist(p, S.home);
  return d > 0.012 && d < 0.075 && !inSea({ u:p.u, v:p.v + 0.02 }) && !nearRiver(p, 0.03) && !inMount(p) && S.fences.every((f) => dist(f, p) > 0.014);
}
function buildFence(p){
  if (S.over || S.mw.on || S.res.wood < PR.fenceWood || !fenceSpotOk(p) || !atHome()) return false;
  S.res.wood -= PR.fenceWood;
  S.fences.push({ u:p.u, v:p.v, seed:hashS('f' + S.fences.length + S.seed) });
  const was = S.home.lee; S.home.lee = leeOf(S.home); S.stats.fences++;

/* ======================= 산 — 등고선 지도 위로 오르기 =======================
   산기슭(지도에서 멈춘 자리)에서 들어선다. 이 산의 등고선 지도 — 줄이 촘촘할수록 가파르고, 줄이 겹친 곳은 벼랑(못 지난다, 골짜기 틈으로 돌아간다).
   나에게서 오를 길을 긋는다(누르면 그 자리까지 곧장). 오르는 동안 날이 흐른다.
   숨은 규칙(토블러의 걷기 함수): 걸음은 길의 기울기 s에 따라 v = V·e^(−3.5·|s + 0.05|). 가파른 산을 곧장 오르면 아주 느리고,
   기울기 0.29(약 16°)쯤으로 갈지자를 그으면 가장 빨리 오른다. 곧장 올랐을 때보다 15% 넘게 빨리 꼭대기에 서면 → 별.
   꼭대기에 서면 땅 전체가 지도에 그려지고, 먼 하늘로 다가오는 한겨울(찬 구름)과 바다의 폭풍(먹구름)이 보인다. */
const MLW = 1, MLH = 0.75;
const DEV_MOUNT = {
  T:null,
  terr(){
    if (this.T && this.T.seed === S.seed && this.T.H === PR.mountH) return this.T;
    const R = mulberry(hashS('mtn:' + S.seed));
    const t = { seed:S.seed, H:PR.mountH, sx:0.4 + R() * 0.2, sy:0.085 + R() * 0.035, p1:R() * TAU, p2:R() * TAU, cy:0.34 + R() * 0.08, gx:0.18 + R() * 0.64, gw:0.06 + R() * 0.03, ch:0.15 };
    const nx = 64, ny = 48, h = new Float32Array((nx + 1) * (ny + 1));
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) h[j * (nx + 1) + i] = this.hAt(t, i / nx * MLW, j / ny * MLH);
    let mxH = 0; for (let i = 0; i < h.length; i++) mxH = Math.max(mxH, h[i]);
    Object.assign(t, { nx, ny, h, maxH:mxH });

  },
  hAt(t, x, y){
    const dx = (x - t.sx) / 0.64, dy = (y - t.sy) / 0.7, r = Math.min(1.3, Math.hypot(dx, dy));
    let h = t.H * Math.max(0, 1 - Math.pow(r, 0.85)) + 0.02 * (1 - y / MLH);
    h += 0.03 * Math.sin(x * 11 + t.p1 + y * 4) * Math.cos(y * 9 + t.p2) * Math.max(0, 1 - r * 0.7);
    const gk = smooth01(1 - Math.abs(x - t.gx) / t.gw), w = 0.011 + 0.08 * gk;      // 벼랑 띠 — 틈(골짜기)만 비탈로 이어진다
    h += t.ch / (1 + Math.exp(clamp((y - t.cy) / w, -40, 40)));
    return h;
  },
  grad(t, x, y){ const e = 0.004; return { gx:(this.hAt(t, x + e, y) - this.hAt(t, x - e, y)) / (2 * e), gy:(this.hAt(t, x, y + e) - this.hAt(t, x, y - e)) / (2 * e) }; },
  G(t, x, y){ const g = this.grad(t, x, y); return Math.hypot(g.gx, g.gy); },
  speed(Sl){ return PR.climbV * Math.exp(-3.5 * Math.abs(Sl + 0.05)) * (S.res.food <= 0 ? 0.8 : 1); },
  fit(A){ const k = Math.min(A.w / MLW, A.h / MLH); return { k, ox:A.x + (A.w - MLW * k) / 2, oy:A.y + (A.h - MLH * k) / 2 }; },
  px(F, x, y){ return [F.ox + x * F.k, F.oy + y * F.k]; },
  lg(F, x, y){ return { x:clamp((x - F.ox) / F.k, 0.005, MLW - 0.005), y:clamp((y - F.oy) / F.k, 0.005, MLH - 0.005) }; },
  init(st){
    const d = st.data, t = this.terr(), sm = S.sites.summit, x0 = clamp(t.sx + ((st.u > 0 ? st.u : sm.u) - sm.u) * 2.2, 0.1, 0.9);
    Object.assign(d, { at:{ x:x0, y:0.715 }, start:{ x:x0, y:0.715 }, route:null, reached:false, t:{ mt:0, ms:0, dh:0 }, acc:null, trace:[{ x:x0, y:0.715 }], seenAt:0, blockAt:0, legDh:0, legDt:0, legDs:0 });
    if (!d.segs) d.segs = [];
    d.tries = (d.tries || 0) + 1;
  },
  update(st, dtMs){
    const d = st.data, r = d.route; if (!r || S.over) return;
    const t = this.terr();
    let left = dtMs / 1000 / PR.dayLen * PR.climbWarp, used = 0, guard = 0;
    while (left > 1e-9 && r.i < r.pts.length && guard++ < 400){
      const q = r.pts[r.i], dx = q.x - d.at.x, dy = q.y - d.at.y, L0 = Math.hypot(dx, dy);
      if (L0 < 1e-4){ r.i++; continue; }
      const ds = Math.min(L0, 0.004), nx = d.at.x + dx / L0 * ds, ny = d.at.y + dy / L0 * ds;
      if (this.G(t, nx, ny) > PR.cliffG){ r.blocked = true; d.blockAt = nowMs(); devAnim('pebble', { x:nx, y:ny, life:900 }); SFX.bad(); break; }
      const h0 = this.hAt(t, d.at.x, d.at.y), h1 = this.hAt(t, nx, ny), Sl = (h1 - h0) / ds, v = this.speed(Sl), dt = ds / v;

      if (Math.hypot(d.at.x - t.sx, d.at.y - t.sy) < 0.03){ this.summit(st); break; }

    const ended = r.blocked || r.i >= r.pts.length || d.reached;
    if (ended){

      // 한 번 오른 길 — 처음이면 쪽지(기울기와 걸린 날)
      if (d.legDh > 0.03){ const F = this.fit(devLayout().A), [px, py] = this.px(F, d.at.x, d.at.y); see('mount', px, py - 36, { s:d.legDh / Math.max(1e-6, d.legDs), rate:d.legDh / Math.max(1e-6, d.legDt) }); }
      d.legDh = d.legDt = d.legDs = 0;
    }
    if (used > 0) devTime(used);
  },
  acc(d, dh, dt, ds, G){
    d.t.mt += dt; d.legDt += dt; d.legDs += ds;
    if (dh > 0){ d.t.dh += dh; d.legDh += dh; d.t.ms += (dh / Math.max(0.05, G)) / (PR.climbV * Math.exp(-3.5 * Math.abs(G + 0.05))); }
    const a = d.acc || (d.acc = { ds:0, dh:0, dt:0 });
    a.ds += ds; a.dh += dh; a.dt += dt;
    if (a.ds >= 0.03){ if (a.dh > 0.002){ d.segs.push([r2(a.dh / a.ds), r2(a.dh / a.dt)]); if (d.segs.length > 80) d.segs.shift(); } d.acc = { ds:0, dh:0, dt:0 }; }
  },
  summit(st){
    const d = st.data; if (d.reached) return;
    d.reached = true; d.route = null; d.seenAt = nowMs(); S.stats.summits = (S.stats.summits || 0) + 1;
    const sm = S.sites.summit;
    if (!sm.linked){ sm.found = sm.linked = true; revealAt({ u:sm.u, v:sm.v + 0.12 }, 0.34); S.summitShow = true; }

  while (SNOW.length < want) SNOW.push({ x:Math.random() * W, y:Math.random() * H, r:0.7 + Math.random() * 1.8, v:14 + Math.random() * 24, ph:Math.random() * TAU });

  if (id === 'sound'){ sndSet(!SND.on); SAVE.mute = !SND.on; save(); }
  else if (id === 'full') toggleFull();
  else if (id === 'leave'){ const now = nowMs(); if (S.leaveArm && now - S.leaveArm < 2200){ S.leaveArm = 0; leaveToCover(); } else { S.leaveArm = now; SFX.tick(); } }
}
// 내가 그려진 자리(움막에 있으면 움막 곁)
function mePx(){ const q = mePos(), home = atHome(); return { x:X(q.u) + (home ? su() * 0.03 : 0), y:Y(q.v) + (home ? su() * 0.012 : 0) - su() * 0.0065 }; }
function siteAt(x, y){ return Object.values(S.sites).find((st) => st.type !== 'summit' && st.found && (!DYN_TYPES[st.type] || st.placed) && Math.hypot(X(st.u) - x, Y(st.v) - y) < Math.max(26, su() * (st.type === 'forest' ? 0.04 : 0.028))); }
const homeHit = (x, y) => Math.hypot(X(S.home.u) - x, Y(S.home.v) - y) < Math.max(26, su() * 0.026);
function ragHit(x, y){ const r = ragPos(); return Math.hypot(r.cx - x, r.cy - y) < Math.max(22, r.s0 * 1.05); }
function bushAt(x, y){ return S.bushes.find((b) => !b.stone && Math.hypot(X(b.u) - x, Y(b.v) - b.s * 0.016 * su() * 0.3 - y) < Math.max(14, b.s * 0.016 * su() * 0.9) && S.reveal.some((c) => dist(c, b) < c.r * 0.9)); }
function skyAt(x, y){ for (const k of ['sun', 'moon']){ const p = SKY[k]; if (p && Math.hypot(p.x - x, p.y - y) < 24) return p; } return null; }
function walkTo(u, v){
  if (S.over) return false;
  if (S.walk) cutWalk();
  const tgt = { u:clamp(u, 0.01, 0.99), v:clamp(v, 0.01, 0.985) };
  if (dist(S.me, tgt) < 0.02) return false;
  ghostDone('walk');
  return !!startPath([{ u:S.me.u, v:S.me.v }, tgt]);
}
// 바람을 살핀다 — 헝겊 · 연기가 어느 쪽으로 눕나
function ragLook(){ S.home.looked = (S.home.looked || 0) + 1; S.stats.rag++; probe(S.home, 0.3); const q = ragUV(); fx('ring', { u:q.u, v:q.v, color:'#B5482F' }); SFX.tick(); showLook('wind', X(q.u), Y(q.v), {}); }
function tapWorld(x, y, onMe){
  const now = nowMs();
  if (onMe){ openNotebook(); return; }                                   // 나 — 내 공책
  // 들어가는 자리(숲 어귀 · 여울 · 산기슭 · 물가) — 곁이면 들어가고, 멀면 그리로
  const st = siteAt(x, y);
  if (st){ if (canEnter(st)) openDevice(st.id); else { const q = mePos(), d = dist(q, st) || 1, k = Math.min(1, 0.04 / d); walkTo(st.u + (q.u - st.u) * k, st.v + (q.v - st.v) * k); } return; }
  // 하늘 — 해 · 달(날을 셀 수 있는 것)
  const sk = skyAt(x, y); if (sk){ showLook('time', sk.x, sk.y + 8, {}); return; }
  // 움막 곁 — 연기(바람) · 장작더미 · 자루 · 헝겊, 움막을 누르면 바람막이
  if (atHome()){
    const H = homeSpots();
    if (noted('wind') && ragHit(x, y)){ ragLook(); return; }
    if (Math.hypot(H.smoke.x - x, H.smoke.y - y) < H.smoke.r){ S.home.looked = (S.home.looked || 0) + 1; probe(S.home, 0.2); showLook('wind', H.smoke.x, H.smoke.y, {}); return; }
    if (Math.hypot(H.pile.x - x, H.pile.y - y) < H.pile.r){ showLook('fire', H.pile.x, H.pile.y, {}); return; }
    if (Math.hypot(H.sacks.x - x, H.sacks.y - y) < H.sacks.r){ showLook('food', H.sacks.x, H.sacks.y, {}); return; }
    if (homeHit(x, y)){
      if (S.mw.on || S.res.wood < PR.fenceWood){ S.lastShort = 'wood'; S.lastShortAt = now; SFX.bad(); return; }
      FENCE = { u:S.home.u + 0.04, v:S.home.v + 0.006 }; SFX.tick(); return;
    }
  } else if (homeHit(x, y)){ walkTo(S.home.u, S.home.v); return; }
  // 덤불 — 건드리면 굴뚝새가 튀어나온다(볼거리는 아니다 — 쪽지가 뜨지 않는다)
  const b = bushAt(x, y);
  if (b && dist(b, mePos()) < 0.14){ fx('wren', { u:b.u, v:b.v, dir:Math.random() < 0.5 ? -1 : 1, life:900 }); SFX.chirp(); return; }
  walkTo(U(x), V(y));
}
function startPinch(){

  preview = null; PTR = null;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  PINCH = { d0:Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), z0:CAM.z, u:U(mx), v:V(my) };
  userCam();
}
function movePinch(){
  const [a, b] = [...PTRS.values()]; if (!a || !b) return;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.max(20, Math.hypot(a.x - b.x, a.y - b.y));
  CAM.z = clamp(PINCH.z0 * d / PINCH.d0, ZMIN, zMax());
  CAM.ox = PINCH.u - (mx - Wr.x) / (CAM.z * Wr.w); CAM.oy = PINCH.v - (my - Wr.y) / (CAM.z * Wr.h);

}
function down(e){
  sndInit();
  const [x, y] = pt(e);
  try { CV.setPointerCapture(e.pointerId); } catch (er){ /* */ }
  PTRS.set(e.pointerId, { x, y });
  if (TURN.on) return;
  if (scene === 'cover'){ if (PTRS.size > 1) return; const B = coverRect(); if (inR(B, x, y) || (SAVE.cur && inR(ribbonRect(B), x, y))){ if (SAVE.cur) resume(); else openBook(); } return; }
  if (scene === 'name'){ focusName(); return; }
  if (scene === 'keep'){ if (PTRS.size === 1) closeBook(); return; }
  if (scene !== 'world' || !S) return;
  // 쪽지가 떠 있으면 — 연필을 누르면 적고, 쪽지 밖을 누르면 접는다
  if (LOOK.on){ const r = lookRect(); if (!LOOK.writing && inR(r.pen, x, y)) startWriting(); else if (!inR(r, x, y)) closeLook(); PTR = { mode:'none' }; return; }
  if (NB.open){ if (PTRS.size === 1) nbDown(x, y); return; }
  if (DV.id){
    if (PTRS.size > 1) return;
    const L = devLayout(), st = devSite();
    if (st && inR(L.pen, x, y)){ showLook(SITE_SUBJ[st.type], L.pen.x + L.pen.w / 2, L.pen.y, {}); startWriting(); PTR = { mode:'none' }; return; }
    deviceDown(x, y); PTR = { mode:'device' }; return;
  }
  if (S.over) return;
  if (PTRS.size === 2){ startPinch(); return; }
  if (PTRS.size > 2) return;
  const hb = HUDR.find((r) => !r.deco && inR(r, x, y));
  if (hb){ hudAction(hb.id); PTR = { mode:'none' }; return; }
  if (S.forming < 1){ PTR = { mode:'none' }; return; }
  if (paused){ setPaused(false); PTR = { mode:'none' }; return; }
  if (FENCE){ if (Math.hypot(X(FENCE.u) - x, Y(FENCE.v) - y) < 42){ PTR = { mode:'fence' }; return; } FENCE = null; }
  if (inR(VR, x, y)) for (const sg of S.signs.slice().reverse()){ const q = signPos(sg, nowMs()); if (Math.hypot(X(q.u) - x, Y(q.v) - y) < 36){ const k = sg.kind, u0 = sg.u, v0 = sg.v; if (touchSign(sg) === 'look') showLook('birds', x, y, { kind:k, onNote:() => learnSign(k, u0, v0) }); PTR = { mode:'none' }; return; } }
  const m = mePx(), dMe = Math.hypot(m.x - x, m.y - y), stH = siteAt(x, y), nearMe = dMe < Math.max(28, su() * 0.018) && !(stH && Math.hypot(X(stH.u) - x, Y(stH.v) - y) < dMe);

}
function move(e){
  const pp = PTRS.get(e.pointerId), [x, y] = pt(e);
  if (pp){ pp.x = x; pp.y = y; }
  if (scene !== 'world' || !S) return;
  if (PINCH){ if (PTRS.size >= 2) movePinch(); return; }
  if (!PTR || !pp) return;
  if (PTR.mode === 'device'){ deviceMove(x, y); return; }
  if (PTR.mode === 'nbscroll'){ NB.scroll = PTR.s0 - (y - PTR.y0) / NB_LH; return; }
  if (PTR.mode === 'fence'){ FENCE = { u:clamp(U(x), 0, 1), v:clamp(V(y), 0, 1) }; return; }
  if ((PTR.mode === 'pending' || PTR.mode === 'me') && Math.hypot(x - PTR.x0, y - PTR.y0) > 9){
    if (PTR.mode === 'me' && !S.over){ if (S.walk) cutWalk(); const q = mePos(); PTR.mode = 'path'; preview = { pts:[{ u:q.u, v:q.v }], est:null, at:0 }; }
    else { PTR.mode = 'pan'; GLIDE.on = false; }
  }
  if (PTR.mode === 'pan'){ CAM.ox = PTR.ox - (x - PTR.x0) / (CAM.z * Wr.w); CAM.oy = PTR.oy - (y - PTR.y0) / (CAM.z * Wr.h); camClamp(); CAM.movedAt = performance.now(); userCam(); return; }

}
function up(e){
  const [x, y] = pt(e); PTRS.delete(e.pointerId);

function cancel(e){ PTRS.delete(e.pointerId); if (PTRS.size < 2) PINCH = null; if (!PTRS.size){ if (PTR && PTR.mode === 'device') DV.drag = null; PTR = null; preview = null; } }

/* ---------- 시계 ---------- */
function frame(t){
  const dtMs = clamp(t - (lastFrame || t), 0, 100); lastFrame = t;
  G.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'world' && S){
    const busy = TURN.on || NB.open || LOOK.writing || document.hidden;
    if (S.forming < 1){ if (!TURN.on) S.forming = Math.min(1, S.forming + dtMs / 4200); }
    else if (DV.id){ if (!busy && !S.over) deviceUpdate(dtMs); }
    else if (!S.over && !paused && !busy) tick(dtMs / 1000 / PR.dayLen * S.speed * (S.walk ? PR.walkWarp : 1));
    glideStep(t); followStep(t, dtMs); if (PTR && PTR.mode === 'path') edgePan(dtMs);
    if (S) prunePaths(t);
    if (S && S.over && !endAt) endAt = t;
    if (S && S.over && endAt && t - endAt > 3600 && !TURN.on) toKeep();
    if (S && !S.over && t - lastSaveAt > 4000){ lastSaveAt = t; save(); }
    if (S) sndAmbient(t, S.mw.on ? 'cold' : '');
    if (LOOK.writing) placeInput();
  }
  try {
    if (TURN.on) drawTurn(G, t);
    else if (scene === 'cover') drawCover(G, t);
    else if (scene === 'name') drawLegend(G, t, nameT0);
    else if (scene === 'world' && S){ if (DV.id) drawDevice(G, t); else drawWorldScene(G, t, dtMs); if (NB.open) drawNotebook(G, t); drawLook(G, t); }
    else if (scene === 'keep' && KEEP) drawKeepsake(G, t, KEEP.run, KEEP.snap);
  } catch (err){ if (!frame.err){ frame.err = 1; console.error(err); } }
  $('lobby').hidden = scene !== 'cover' || TURN.on;
  requestAnimationFrame(frame);
}

/* ---------- 저장 · 앱과의 약속 ---------- */
let saveTimer = 0;
function snapshot(){
  if (S && !S.over && (scene === 'world' || TURN.on)) SAVE.cur = pack();
  const out = { v:4, params:SAVE.params, self:SAVE.self, runs:SAVE.runs, cur:SAVE.cur, seen:SAVE.seen, mute:!SND.on }, LIM = 19500;
  let s = JSON.stringify(out);
  if (s.length > LIM){ out.runs = out.runs.slice(-8).map((r) => Object.assign({}, r, { stats:undefined })); s = JSON.stringify(out); }
  if (s.length > LIM && out.cur){ const c = out.cur = Object.assign({}, out.cur), L = c.logs; c.logs = { res:L.res.slice(-30), wind:L.wind.slice(-14), birds:L.birds.slice(-14), lastRes:L.lastRes, lastWind:L.lastWind }; s = JSON.stringify(out); }
  if (s.length > LIM && out.cur){ out.cur.notes = Object.assign({}, out.cur.notes, { memos:out.cur.notes.memos.slice(-20) }); s = JSON.stringify(out); }
  let guard = 0;
  while (s.length > LIM && out.cur && out.cur.reveal.length > 40 && guard++ < 6){ out.cur.reveal = out.cur.reveal.filter((c, i, a) => i % 2 === 0 || i === a.length - 1); s = JSON.stringify(out); }
  return s;
}
function save(now){
  clearTimeout(saveTimer);
  const go = () => {
    const s = snapshot();
    if (inFrame){ try { window.parent.postMessage({ type:'ash-store-set', key:SAVE_KEY, data:JSON.parse(s) }, '*'); } catch (e){ /* 부모가 없어도 책은 넘어간다 */ } }
    else { try { localStorage.setItem('ashrain.games.' + SAVE_KEY, s); } catch (e){ /* */ } }
  };
  if (now) go(); else saveTimer = setTimeout(go, 800);
}
const OLD_SELF = { jebi:'swallow', olppaemi:'owl', kkachi:'magpie', durumi:'crane', wren:'wren' };
function mergeSave(d){
  if (!d || typeof d !== 'object') return;
  if (d.v === 4 || d.v === 3){
    // 예전 판(v3)의 다듬은 숫자 · 자아 · 지난 겨울은 이어받고, 이어 하던 겨울은 버린다(세상이 바뀌었다)
    const p0 = d.params || {};
    SAVE.params = Object.fromEntries(Object.entries(p0).filter(([k, v]) => k in DEFAULTS && isFinite(Number(v)) && Number(v) !== DEFAULTS[k]).map(([k, v]) => [k, Number(v)]));
    if (d.self) SAVE.self = Object.assign({ A:0, B:0, C:0, name:'wren', center:0 }, d.self);
    SAVE.runs = Array.isArray(d.runs) ? d.runs.slice(-12) : [];
    SAVE.cur = d.v === 4 && d.cur && d.cur.v === 4 ? d.cur : null;
    SAVE.seen = d.v === 4 ? d.seen || {} : {};
    if (d.mute){ SAVE.mute = true; sndSet(false); }
  } else if (d.v === 1){
    if (d.self) SAVE.self = { A:clamp(Number(d.self.A) || 0, -1, 1), B:clamp(Number(d.self.B) || 0, -1, 1), C:clamp(Number(d.self.C) || 0, -1, 1), name:OLD_SELF[d.self.name] || 'wren', center:0 };
    SAVE.runs = (d.runs || []).slice(-12).map((r) => ({ t:r.t, kind:r.kind === 'win' ? 'spring' : r.kind, days:r.days, self:OLD_SELF[r.self] || 'wren', stars:[], stones:0, coef:r.coef || null, old:true }));
    SAVE.cur = null;
  }
  PR = Object.assign({}, DEFAULTS, SAVE.params);
  C.coverKey = '';
}
function loadSave(){
  if (inFrame){ try { window.parent.postMessage({ type:'ash-store-get', key:SAVE_KEY }, '*'); } catch (e){ /* */ } }
  else { try { mergeSave(JSON.parse(localStorage.getItem('ashrain.games.' + SAVE_KEY) || 'null')); } catch (e){ /* */ } }
}
function post(m){ if (inFrame) try { window.parent.postMessage(m, '*'); } catch (e){ /* */ } }
function toggleFull(){
  const root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen, fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (immersive){ immersive = false; post({ type:'ash-immersive', on:false }); return; }
  if (req) Promise.resolve().then(() => req.call(root)).catch(() => { immersive = true; post({ type:'ash-immersive', on:true }); });
  else { immersive = true; post({ type:'ash-immersive', on:true }); }
}
window.addEventListener('message', (e) => {

  if (d.type === 'ash-theme' && (d.theme === 'light' || d.theme === 'dark')){ document.documentElement.dataset.theme = d.theme; readTheme(); }

});

/* ---------- 다듬기(강사용) ---------- */
const MEMO = `<p><b>숨은 규칙 — 학생 화면엔 글이 거의 없다. 처음엔 아무것도 알려 주지 않는다. 볼거리가 있는 것을 눌러 적으면, 그때부터 공책이 그것을 지켜보며 조금씩 더 알려 준다.</b></p>
<p><b>이름</b> — 첫 장의 '이름'은 닉네임처럼 보이지만 이 땅의 이름이다. 덮으면 표지 쪽지에(손글씨), 산꼭대기에 서면 지도 아래 바다 위에, 끝 장의 제목으로 적힌다. 비워 두면 '무제'.</p>
<p><b>흐름</b> — 소극적 정보(걸은 만큼 그려지는 땅 · 연기가 눕는 쪽 · 지나가는 새 떼 · 얼음 빛깔 · 실제 하늘) → 적극적 정보(볼거리를 눌러 쪽지에 적으면 공책이 그것을 지켜본다 — 숫자 · 기록 쪽, 물음으로 적으면 풀어 보인다) → 소극적 결정(기다리기) → 적극적 결정(뽑기 · 건너기 · 낚시 · 오르기 · 바람막이 · 길). 정보를 얻는 네 가지 — 모으는 방법(걷기 · 털기 · 돌 던지기 · 뚫기 · 물결 재기 · 오르기), 전해 주는 매개(연기 · 헝겊 · 새 떼 · 눈금 막대 · 얼음 기둥 · 먼 하늘), 적는 것(쪽지 → 공책), 묻는 것(물음으로 적은 쪽지).</p>
<p><b>손</b> — 땅을 누르면 그리로 걷는다(걷는 동안은 날이 두 배로 흐른다, 지나간 자취는 곧 사라진다). 나에게서 끌면 길을 긋는다. 나를 누르면 내 공책. 빈 곳을 끌면 지도를 옮기고, 두 손가락(마우스는 휠)으로 당겨 본다. 바다 앞 · 산기슭 · 강가에서 걸음이 멈추고 그 자리가 들어가는 자리(물가 · 산기슭 돌무더기 · 여울)가 된다. 숲은 어귀에 닿으면. 곁에 서서 누르면 책장을 넘겨 그곳 장면으로 들어간다.</p>
<p><b>볼거리 → 쪽지 → 눈여겨봄</b> — 움막의 연기(바람 — 헝겊을 묶고 날마다 바람을 적는다, 물으면 늘 부는 쪽과 그늘) · 장작더미(땔감 숫자 · 기록, 물으면 바닥나는 날) · 자루(양식 숫자 · 기록) · 해와 달(책갈피 끈 · 걸릴 날 · 이 땅의 해 높이, 물으면 지난 날을 셈) · 지나가는 새 떼(새를 적은 뒤로 테가 생기고 잡으면 무엇을 알리는지 적힌다 — 까마귀는 한겨울, 갈매기는 폭풍) · 장면 속 가지 끝 · 얼음 기둥 · 물결 막대 · 오른 길. 덤불처럼 볼거리가 없는 것은 쪽지가 뜨지 않는다(굴뚝새만 튀어나온다). 장면 오른쪽(아래)은 그곳에 대한 공책 쪽 — 연필을 눌러 적을 수도 있다.</p>
<p><b>물음</b> — '?' · 왜 · 어떻게 · 언제 · 얼마나 · 어디 · 몇 · …까/니/나요 로 적으면 그 쪽이 기록을 풀어 보인다(숲은 비율 막대, 강은 구멍마다 줄과 만나는 날, 바다는 잔잔한 골과 주기, 산은 걸음의 곡선과 가장 빠른 가파름, 바람은 늘 부는 쪽, 땔감 · 양식은 바닥나는 날, 새는 까마귀 뒤의 한겨울, 해는 지난 날과 한낮의 높이).</p>
<p><b>숲 · 눈 속 가지</b> — 가지 끝을 톡 눌러 눈을 털고(한 번 털어야 뽑힌다) 끝까지 끌어 뽑는다. 두 더미의 마른 가지 비율이 다르다(약 0.78과 0.42). 편법: 썩은 가지 끝은 아주 조금 이끼빛. 덜 나오는 더미에서 다섯 번 내리 마른 가지 → 별.</p>
<p><b>강 · 얼음 위에서</b> — 얼음을 누르면 돌을 던진다(딱 = 두꺼움, 쩍 = 애매함, 퐁 = 얇음). 송곳을 끌어다 놓으면 뚫어 잰다(그 자리가 서 있기에도 얇으면 빠진다 — 7cm). 낚싯대를 구멍에 끌어다 놓으면 얼음낚시 — 찌가 잠길 때 재빨리 누른다(한 마리 양식 0.35, 낚는 동안 날이 흐른다). 나에게서 건너편 둑까지 길을 그으면 건넌다(그 길 어디든 12cm보다 얇으면 빠져서 양식 1.5 · 땔감 1을 잃는다). 숨은 규칙: 두께 = 처음 + 하루치 × 날(일차함수), 굽이치는 물살 줄기 위는 얇다(대신 입질이 네 배쯤 잦다). 같은 구멍을 다른 날 두 번 재면 공책에 줄 — 구멍마다 줄은 나란하다(기울기가 같다). 다른 날 두 번 넘게 잰 구멍이 있고, 빠진 적 없이, 고른 길이 버티게 된 날로부터 0.75일 안에 건너면 → 별. 한겨울엔 꽁꽁 언다(편법, 별 없음).</p>
<p><b>바다 · 물결과 낚시</b> — 물결 높이는 5.5~8일 주기로 오르내린다. 눈금 막대를 눌러 재고, 기다리고, 낚싯대를 끌어 던진다. 잔잔 3 · 너울 1.2 · 폭풍은 젖어 양식 −1, 같은 날 거듭 0.6배씩. 갈매기가 뭍으로 몰리면 이튿날 폭풍. 서로 다른 사흘 이상 재고 잔잔할 때 세 번 내리 → 별.</p>
<p><b>산 · 등고선 오르기</b> — 등고선이 촘촘할수록 가파르고, 겹친 곳은 벼랑(못 지난다 — 골짜기 틈으로). 나에게서 오를 길을 긋는다(오르는 동안 날이 흐른다, 내려오는 데도 날이 든다). 숨은 규칙(토블러의 걷기 함수): 걸음 v = V·e^(−3.5·|기울기 + 0.05|) — 가파른 산을 곧장 오르면 아주 느리고, 기울기 0.29(약 16°)쯤 갈지자가 가장 빠르다. 곧장 올랐을 때보다 15% 넘게 빨리 꼭대기에 서면 → 별. 꼭대기에선 땅 전체가 지도에 그려지고 이름이 적히며, 먼 하늘로 한겨울(찬 구름)과 내일의 폭풍(먹구름)이 보인다(한겨울을 미리 앎).</p>
<p><b>바람 그늘</b> — 처음 움막은 바람을 맞는다(연기가 눕는다). 움막 곁에서 움막을 누르면 바람막이(땔감 2)를 끌어다 세운다. 바람이 불어 오는 쪽에 세우면 땔감 0.6배(연기가 곧게). 연기나 헝겊을 살피고 바람을 적은 뒤 그늘을 만들면 → 별.</p>
<p><b>독수리</b> — 산에 살며 며칠마다 하늘을 지나간다. 지나간 뒤로 장면 왼쪽 위에 깃털 — 답(참 비율 · 참 줄 · 참 물결 · 가장 빠른 방향)을 바로 보여 주는 대신 움막 곁 덤불이 돌로 굳고 그 장면의 별은 없다. 돌이 여섯이면 독수리의 겨울.</p>
<p><b>살림 · 끝</b> — 이 땅엔 나 혼자. 하루에 양식 0.35, 땔감 0.45(그늘이면 0.6배, 밤엔 1.15배, 한겨울엔 2배 — 미리 알면 1.6배). 시작은 7씩(등짐). 땔감이 줄면 화면 가장자리에 서리가 끼고, 바닥나면 떨고, 굶으면 걸음이 무겁다. 이틀 넘게 춥거나 사흘 넘게 굶으면 끝, 30일을 버티면 봄.</p>
<p><b>밤낮 · 날짜</b> — 밤낮은 실제 시각을 따른다(씨앗으로 정한 비밀의 위도 · 경도 — 어디에도 안 나온다). 날짜는 책을 펼쳐 노는 동안에만 흐른다(하루 15초, 걷는 동안 두 배. 공책을 펴거나 쪽지에 적는 동안 멈추고, 장면 속에선 손을 쓸 때만 — 오르기 · 낚시는 하는 동안).</p>
<p><b>자아</b> — 살펴보기(털기 · 돌 · 뚫기 · 재기 · 연기 · 새 · 물음) ↔ 해 보기(뽑기 · 건너기 · 낚시 · 오르기 · 길 · 바람막이), 해 보기 전에 두 번 넘게 살폈나(신중 ↔ 결단), 독수리에 기대나(기대기 ↔ 맞서기). 올빼미 · 까치 · 제비 · 두루미 · 굴뚝새(가운데). 끝 장의 새 그림으로만.</p>`;

  bestX(){ const d = S.sites.ford.data; let best = null; for (let x = 0.05; x <= 0.95; x += 0.01){ let m = -1e9; for (let iy = 0; iy <= 1; iy += 0.02) m = Math.max(m, DEV_RIVER.safeAt(d, x, iy)); if (!best || m < best.safe) best = { x:r2(x), safe:r2(m) }; } return best; },
  stone(x, iy){ const st = devSt(); DEV_RIVER.stone(st, x, iy); return st.data.stones.slice(-1)[0].k; },

  // 산
  mtn(){ const t = DEV_MOUNT.terr(), st = S.sites.trail, d = st.data; return { sx:r2(t.sx), sy:r2(t.sy), gx:r2(t.gx), gw:r2(t.gw), cy:r2(t.cy), at:d.at ? { x:r2(d.at.x), y:r2(d.at.y) } : null, reached:!!d.reached, t:d.t, segs:(d.segs || []).length, route:!!d.route }; },
  climb(pts){ const d = devSt().data; d.route = { pts:pts.map(([x, y]) => ({ x, y })), i:0 }; return true; },
  // 가장 좋은 가파름(1/3.5)으로 등고선을 비스듬히 — 벼랑 띠 아래에선 골짜기 틈으로(시험용 길 만들기)
  mtnRoute(){
    const t = DEV_MOUNT.terr(), d = S.sites.trail.data, so = 1 / 3.5, step = 0.008, pts = [], r3 = (v) => Math.round(v * 1000) / 1000;
    let x = d.at.x, y = d.at.y;
    const line = (tx, ty) => { const n = Math.max(1, Math.ceil(Math.hypot(tx - x, ty - y) / step)), x0 = x, y0 = y; for (let i = 1; i <= n; i++){ x = x0 + (tx - x0) * i / n; y = y0 + (ty - y0) * i / n; pts.push({ x, y }); } };
    line(t.gx, t.cy + 0.07); line(t.gx, t.cy - 0.09);          // 골짜기 틈 아래로, 틈을 곧장
    let side = Math.sign(t.sx - x) || 1, guard = 0;
    while (Math.hypot(x - t.sx, y - t.sy) > 0.02 && guard++ < 3000){   // 그다음은 등고선을 비스듬히(가파름 1/3.5)
      const g = DEV_MOUNT.grad(t, x, y), G = Math.hypot(g.gx, g.gy); let ux, uy;
      if (G <= so * 1.05){ const dx = t.sx - x, dy = t.sy - y, L = Math.hypot(dx, dy); ux = dx / L; uy = dy / L; }

      const nx = x + ux * step, ny = y + uy * step;
      if (nx < 0.03 || nx > MLW - 0.03 || ny < 0.03 || ny > t.cy - 0.05 || DEV_MOUNT.G(t, nx, ny) > PR.cliffG * 0.7){ side = -side; continue; }
      x = nx; y = ny; pts.push({ x, y });
    }
    pts.push({ x:t.sx, y:t.sy });
    return pts.map((q) => [r3(q.x), r3(q.y)]);
  },
  hAt(x, y){ return r2(DEV_MOUNT.hAt(DEV_MOUNT.terr(), x, y) * 100) / 100; },
  param(k, v){ if (!(k in DEFAULTS)) return null; PR[k] = v; return PR[k]; }, seed(n){ S.seed = n; DEV_MOUNT.T = null; return n; },
  // 곧장 오를 때의 날(벼랑 무시)과 가장 좋은 가파름으로 오를 때의 날 — 산 높이 맞추기용
  mtnCost(){ const t = DEV_MOUNT.terr(), x0 = t.sx, y0 = 0.715, n = 400; let x = x0, y = y0, mt = 0, dh = 0; const Gs = [];
    for (let i = 0; i < n; i++){ const nx = x0 + (t.sx - x0) * (i + 1) / n, ny = y0 + (t.sy - y0) * (i + 1) / n, ds = Math.hypot(nx - x, ny - y), h0 = DEV_MOUNT.hAt(t, x, y), h1 = DEV_MOUNT.hAt(t, nx, ny); mt += ds / DEV_MOUNT.speed((h1 - h0) / ds); if (h1 > h0) dh += h1 - h0; Gs.push(DEV_MOUNT.G(t, nx, ny)); x = nx; y = ny; }
    Gs.sort((a, b) => a - b); const so = 1 / 3.5, ideal = dh / (so * DEV_MOUNT.speed(so)); return { dh:r2(dh), straight:r2(mt), ideal:r2(ideal), ratio:r1(mt / ideal), Gmed:r2(Gs[n >> 1]), G90:r2(Gs[Math.floor(n * 0.9)]) }; }, cliff(x, y){ return DEV_MOUNT.G(DEV_MOUNT.terr(), x, y) > PR.cliffG; },
  // 움막 · 새 · 독수리
  fenceSpot(lee){ const w = windBase(), sg = lee ? -1 : 1; for (const d of [0.03, 0.025, 0.035, 0.02, 0.04, 0.045]){ const p = { u:S.home.u + sg * w.x * d, v:S.home.v + sg * w.y * d * WA }; if (fenceSpotOk(p)) return p; } return null; },
  fence(u, v){ return buildFence({ u, v }); },
  spawnSign(k){ spawnSign(k); const sg = S.signs[S.signs.length - 1], q = signPos(sg, nowMs()); return { x:Math.round(X(q.u)), y:Math.round(Y(q.v)) }; },
  signPx(){ const sg = S.signs[S.signs.length - 1]; if (!sg) return null; const q = signPos(sg, nowMs()); return { x:Math.round(X(q.u)), y:Math.round(Y(q.v)) }; },
  forceMw(){ Object.assign(S.mw, { start:S.day + 0.01, on:false, done:false }); }, eagleFly(){ S.eagleNext = S.day; eagleStep(); return S.eagleSeen; },
  eagle(){ const L = devLayout(); return deviceDown(L.feather.x + 10, L.feather.y + 10); },
  cam(z, u, v){ camCenter(u === undefined ? camMid().u : u, v === undefined ? camMid().v : v, z); userCam(); return { z:r2(CAM.z), ox:r2(CAM.ox), oy:r2(CAM.oy) }; },

  solar(h){ if (h == null){ CLOCK_FAKE = null; LIGHT = null; return null; } const d0 = new Date(), mid = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), d0.getUTCDate()); CLOCK_FAKE = mid + (h - S.geo.lon / 15) * 3600e3; LIGHT = null; return r1(light().alt); },
