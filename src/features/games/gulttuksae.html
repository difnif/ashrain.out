<title>굴뚝새</title>
<!--
  굴뚝새(가제) v3 — 덤불의 터전 · 그림책 겨울(1막 스페이스, 베타). 한 장짜리 HTML, 바깥 의존은 구글 폰트뿐.
  앱에서는 시록고(강사앱) #/games(src/apps/seirocco/pages/Games.jsx)가 샌드박스 iframe 으로 띄운다.
  · 테마: <html data-theme> + postMessage({ type: "ash-theme" }) · 전체 화면: Fullscreen API, 막히면 { type: "ash-immersive", on }
  · 저장: 샌드박스라 localStorage 를 못 쓰면 부모에게 { type: "ash-store-get" | "ash-store-set", key: "gulttuksae", data } 로 맡긴다(20KB 까지).
  · window.__gulttuksae() — 스모크 테스트가 읽는 상태 요약, window.__gtDebug — 시험용 갈고리.
  화면엔 글이 거의 없다. 그림책 표지 → 책장 넘기기(독수리 날개에서 솟는 굴뚝새) → 빈 종이 위에 터전(가시덤불 둥지)이 생긴다.
  길은 손가락으로 그리고, 걸어간 만큼 종이에 세상이 그려진다. 고르기는 장치로: 가지 뽑기 · 얼음 재기 · 돌림판 · 장터 머신 · 둥지 놓기.
  장치마다 숨은 규칙(비율 · 일차함수 · 넓이 확률과 결정된 회전 · 주기와 때 · 바람 그늘 · 산의 기울기)이 있고, 해 보면서 찾아낸다.
  설계 문서: 프로젝트 claude/굴뚝새.md(강사용 숨은 규칙 메모 포함)
-->

<div class="lobby" id="lobby">
  <button class="ib" id="btnFull" type="button" aria-label="전체 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

      <button class="tbtn" id="tExport" type="button">값 내보내기</button>
      <button class="tbtn" id="tImport" type="button">값 가져오기</button>
      <button class="tbtn" id="tClose" type="button">닫기</button>
    </div>
  </div>
</div>
<script>
'use strict';
(function(){
/* =================== 3-core: 도구 · 종이 · 먹 · 물감 · 그림 조각 · 소리 =================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const nowMs = () => performance.now();
const $ = (id) => document.getElementById(id);
function mulberry(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashS(s){ let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffleR(R, a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const fmtN = (x) => { const v = Math.round(x * 10) / 10; return (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1)); };
function hexA(h, a){ const n = parseInt(String(h).slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
function mixHex(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const m = (s) => Math.round(lerp((A >> s) & 255, (B >> s) & 255, t)); return `rgb(${m(16)},${m(8)},${m(0)})`; }

/* ---------- 빛깔 — 낮의 종이 · 밤의 종이 ---------- */
const PAL_L = {
  desk0:'#2A231E', desk1:'#3B3029', paper:'#F3EDE1', paperBack:'#EDE5D6', fiber:'rgba(120,98,66,', vig:'rgba(96,74,46,.16)',
  ink:'#2F2924', snowSh:'#C6D1DA', snowSh2:'#AEBCC8', grass:'#B9A77A',
  furze:'#5E6B37', furze2:'#46532A', bloom:'#E2AE32', pine:'#3D5946', pine2:'#2C4536', trunk:'#6E5138',
  river:'#A8C2CF', ice:'#E4EDF2', iceThin:'#7F98A8', sea:'#7896A8', sea2:'#56768B', foam:'rgba(255,255,255,.85)', sand:'#D9C9A5',
  mount:'#B3BDC6', mount2:'#8E9CA9', roof:'#B25A3B', wall:'#EAD9BD', wood:'#8B6643', grain:'#D7B158', stone:'#9C978F', stone2:'#7B766E',
  blossom:'#E79AB3', blossom2:'#F4C6D4', spring:'#9DBB78',
  night:'#2B3456', warm:'255,212,138', dawn:'244,176,160', dusk:'236,158,104', glow:'255,196,108', smoke:'#9AA3AB',
  calm:'#A7CADB', swell:'#7E97A8', storm:'#3C4862', lantern:'#F0B43C', frost:'rgba(255,255,255,', shadow:'rgba(40,30,20,.16)',
};
const PAL_D = {
  desk0:'#0B0C0E', desk1:'#15171A', paper:'#20262D', paperBack:'#262C34', fiber:'rgba(220,210,190,', vig:'rgba(0,0,0,.38)',
  ink:'#E0D8C8', snowSh:'#2F3A46', snowSh2:'#3B4856', grass:'#6E6650',
  furze:'#4E5C30', furze2:'#3B4724', bloom:'#C89A2E', pine:'#2F4A3B', pine2:'#243A2E', trunk:'#5B4430',
  river:'#3E5A6A', ice:'#5B7383', iceThin:'#2A3B47', sea:'#35566B', sea2:'#26425A', foam:'rgba(210,228,240,.55)', sand:'#5B5141',
  mount:'#46525E', mount2:'#36424E', roof:'#8E4429', wall:'#4A4236', wood:'#7A5A3B', grain:'#B8954A', stone:'#6A665F', stone2:'#55514B',
  blossom:'#C27A93', blossom2:'#D79AB0', spring:'#6E8B55',
  night:'#3A4570', warm:'255,196,120', dawn:'230,150,140', dusk:'220,140,90', glow:'255,186,96', smoke:'#6C757D',
  calm:'#5E8BA3', swell:'#4B6475', storm:'#1E2638', lantern:'#E9A92F', frost:'rgba(190,214,236,', shadow:'rgba(0,0,0,.35)',
};
let PAL = PAL_L;
const isDark = () => PAL === PAL_D;
// 다섯 자아의 빛깔 — 이름은 끝 장에만 나온다
const SELVES = {
  wren:{ name:'굴뚝새', color:'#A0703F' }, swallow:{ name:'제비', color:'#2C6A8A' }, owl:{ name:'올빼미', color:'#7A5C9E' },
  magpie:{ name:'까치', color:'#2E7D74' }, crane:{ name:'두루미', color:'#B8433A' },
};

/* ---------- 쪽 · 그림판 좌표 ---------- */
// 화면 = 펼친 책 한 쪽(P). 세상은 그 안의 일정한 비율 그림판(Wr, 가로 : 세로 = WA)에 그린다 — 어떤 기기든 같은 세상.
const WA = 1.45;
let W = 0, H = 0, DPR = 1, CDPR = 1, K = 800;
const P = { x:0, y:0, w:0, h:0 }, Wr = { x:0, y:0, w:0, h:0 };
const X = (u) => Wr.x + u * Wr.w, Y = (v) => Wr.y + v * Wr.h;
const U = (x) => (x - Wr.x) / Wr.w, V = (y) => (y - Wr.y) / Wr.h;
const dist = (a, b) => Math.hypot(a.u - b.u, (a.v - b.v) / WA);      // 그림판 너비 = 1

/* ---------- 먹선 · 물감 ---------- */
const mid = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });
function smoothPath(g, pts, closed){
  const n = pts.length; if (n < 2) return;
  g.beginPath();
  if (closed){ let m = mid(pts[n - 1], pts[0]); g.moveTo(m.x, m.y); for (let i = 0; i < n; i++){ const p = pts[i], mm = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p.x, p.y, mm.x, mm.y); } g.closePath(); }
  else { g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n - 1; i++){ const mm = mid(pts[i], pts[i + 1]); g.quadraticCurveTo(pts[i].x, pts[i].y, mm.x, mm.y); } g.lineTo(pts[n - 1].x, pts[n - 1].y); }
}
const wob = (pts, amp, R) => pts.map((p) => ({ x:p.x + (R() - 0.5) * amp, y:p.y + (R() - 0.5) * amp }));
// 손으로 그은 듯 — 두 번 긋는다
function inkLine(g, pts, w, col, R, a){
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col;
  g.globalAlpha = a === undefined ? 1 : a; g.lineWidth = w; smoothPath(g, R ? wob(pts, w * 0.7, R) : pts); g.stroke();
  if (R){ g.globalAlpha = (a === undefined ? 1 : a) * 0.3; g.lineWidth = w * 0.55; smoothPath(g, wob(pts, w * 1.8, R)); g.stroke(); }
  g.globalAlpha = 1;
}
// 곧은 먹선(집 · 나무 · 상자) — 손 떨림만 조금
function inkPoly(g, pts, w, col, R, a, closed){
  const q = R ? wob(pts, w * 0.5, R) : pts;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col; g.lineWidth = w; g.globalAlpha = a === undefined ? 1 : a;
  g.beginPath(); q.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); if (closed) g.closePath(); g.stroke();
  g.globalAlpha = 1;
}
function blob(cx, cy, r, R, n, irr, sx, sy){ const pts = []; for (let i = 0; i < n; i++){ const a = i / n * TAU, k = 1 + (R() - 0.5) * irr; pts.push({ x:cx + Math.cos(a) * r * k * (sx || 1), y:cy + Math.sin(a) * r * k * (sy || 1) }); } return pts; }
// 수채 — 결이 다른 얇은 막 여러 겹, 가장자리는 조금 진하게
function wash(g, cx, cy, r, col, a, R, o){
  o = o || {};
  const layers = o.layers || 3;
  let last = null;
  for (let l = 0; l < layers; l++){ last = blob(cx, cy, r * (0.84 + 0.09 * l), R, o.n || 14, o.irr || 0.34, o.sx, o.sy); smoothPath(g, last, true); g.globalAlpha = a / layers * 1.25; g.fillStyle = col; g.fill(); }
  if (o.edge !== false){ g.globalAlpha = a * 0.3; g.strokeStyle = col; g.lineWidth = 1; smoothPath(g, last, true); g.stroke(); }
  g.globalAlpha = 1;
}
function glow(g, x, y, r, rgb, a){ if (r <= 0 || a <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function star(g, x, y, r, col){ g.fillStyle = col; g.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }

/* ---------- 종이 ---------- */
function makePaper(w, h, dpr, col, seed){
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w * dpr)); c.height = Math.max(2, Math.round(h * dpr));
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = col; g.fillRect(0, 0, w, h);
  const R = mulberry(seed);
  for (let i = 0; i < 16; i++){ const x = R() * w, y = R() * h, r = 50 + R() * 180, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, PAL.fiber + '0.05)'); gr.addColorStop(1, PAL.fiber + '0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  g.lineWidth = 0.6;
  const n = Math.min(9000, Math.round(w * h / 240));
  for (let i = 0; i < n; i++){ const x = R() * w, y = R() * h, a = R() * TAU, l = 2 + R() * 7; g.strokeStyle = PAL.fiber + (0.04 + R() * 0.07).toFixed(3) + ')'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  for (let i = 0; i < n / 3; i++){ g.fillStyle = PAL.fiber + (0.05 + R() * 0.08).toFixed(3) + ')'; g.fillRect(R() * w, R() * h, 1, 1); }
  const gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.38, w / 2, h / 2, Math.max(w, h) * 0.78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, PAL.vig); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  return c;
}

/* ---------- 그림 조각 ---------- */
// 가시덤불(gorse) — 한겨울에도 노란 꽃이 몇 송이
function drawFurze(g, x, y, s, R, o){
  o = o || {};
  const grey = o.stone, c1 = grey ? PAL.stone2 : PAL.furze2, c2 = grey ? PAL.stone : PAL.furze;
  g.fillStyle = PAL.shadow; g.beginPath(); g.ellipse(x + s * 0.15, y + s * 0.2, s * 1.05, s * 0.28, 0, 0, TAU); g.fill();
  wash(g, x, y - s * 0.4, s * 0.88, c2, 0.85, R, { sy:0.78, n:13, irr:0.48, layers:2 });
  wash(g, x - s * 0.25, y - s * 0.55, s * 0.5, c1, 0.6, R, { sy:0.8, n:10, irr:0.55, layers:2, edge:false });
  wash(g, x + s * 0.35, y - s * 0.3, s * 0.42, c1, 0.45, R, { sy:0.7, n:9, irr:0.5, layers:1, edge:false });
  // 가시 — 짧은 먹선
  g.strokeStyle = PAL.ink; g.lineWidth = Math.max(0.7, s * 0.05); g.globalAlpha = 0.65; g.lineCap = 'round';
  for (let i = 0; i < 14; i++){ const a = Math.PI * (1.02 + R() * 0.96), d = s * (0.65 + R() * 0.3), px = x + Math.cos(a) * d, py = y - s * 0.35 + Math.sin(a) * d * 0.72; g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * s * 0.22, py + Math.sin(a) * s * 0.22); g.stroke(); }
  g.globalAlpha = 1;
  if (!grey){ const k = o.bloom === undefined ? 1 : o.bloom; g.fillStyle = PAL.bloom; for (let i = 0; i < Math.round(6 * k); i++){ const a = Math.PI * (1.08 + R() * 0.84), d = s * (0.25 + R() * 0.5); g.beginPath(); g.arc(x + Math.cos(a) * d, y - s * 0.35 + Math.sin(a) * d * 0.7, Math.max(1, s * 0.09 + R() * s * 0.05), 0, TAU); g.fill(); } }
  if (!o.noSnow){ g.globalAlpha = 0.9; g.fillStyle = PAL.paper; g.beginPath(); g.ellipse(x - s * 0.1, y - s * 0.86, s * 0.5, s * 0.12, -0.08, 0, TAU); g.fill(); g.globalAlpha = 1; }

};
// 이따금 피리 한 음 — 서정의 끈
function sndAmbient(now, mood){

/* =================== 4-world: 세상 · 시간 · 살림 · 길 · 둥지 · 떠돌이 · 징조 · 독수리 · 자아 =================== */

const DEFAULTS = Object.fromEntries(PARAM_DEFS.flatMap(([, rows]) => rows.map(([k, , v]) => [k, v])));
let PR = Object.assign({}, DEFAULTS);
const HOME = { u:0.36, v:0.6 };
let S = null;
let SAVE = { v:3, params:{}, self:{ A:0, B:0, C:0, name:'wren', center:0 }, runs:[], cur:null, seen:{}, mute:false };
const SELF = () => SAVE.self;
const TOD = (d) => { const f = d - Math.floor(d); return f < 0.15 ? 'dawn' : f < 0.66 ? 'day' : f < 0.8 ? 'dusk' : 'night'; };
const dayFrac = (d) => d - Math.floor(d);
let FX = [];
function fx(kind, o){ FX.push(Object.assign({ kind, born:nowMs(), life:({ star:2400, eagle:3200, dive:1800, link:1600, pop:1100, catch:900, feather:3000, crack:1400, ring:1200, stone:1600 })[kind] || 1200 }, o || {})); if (FX.length > 40) FX.splice(0, FX.length - 40); }

/* ---------- 세상 만들기 — 씨앗 하나로 늘 같은 세상 ---------- */
function genWorld(R){
  return {
    river:{ c:0.6 + R() * 0.05, p1:R() * TAU, p2:R() * TAU, a1:0.038 + R() * 0.014, a2:0.011 + R() * 0.007, hw:0.017 },
    sea:{ b:0.865 + R() * 0.02, p:R() * TAU, q:R() * TAU },
    mount:{ b:0.21 + R() * 0.03, p:R() * TAU, q:R() * TAU, right:0.55 },
    wind:{ a:[0.35, 0.75, 2.4, 2.75, -0.35][Math.floor(R() * 5)] + (R() - 0.5) * 0.3, sway:R() * TAU },
  };
}
function riverU(v){ const r = S.world.river; return r.c + r.a1 * Math.sin(v * Math.PI * 1.6 + r.p1) + r.a2 * Math.sin(v * Math.PI * 4.3 + r.p2); }
function seaV(u){ const s = S.world.sea; return s.b + 0.03 * Math.sin(u * Math.PI * 2.4 + s.p) + 0.016 * Math.sin(u * Math.PI * 6.5 + s.q); }
function mountV(u){
  const m = S.world.mount; if (u > m.right + 0.1) return -1;
  const k = u > m.right ? 1 - (u - m.right) / 0.1 : 1;
  return (m.b + 0.05 * Math.sin(u * Math.PI * 1.7 + m.p) + 0.025 * Math.sin(u * Math.PI * 5 + m.q)) * k;
}
const inSea = (p) => p.v > seaV(p.u);
const inMount = (p) => p.v < mountV(p.u);
const riverSide = (p) => (p.u - riverU(p.v) >= 0 ? 1 : -1);
const nearRiver = (p, w) => Math.abs(p.u - riverU(p.v)) < w;
function windBase(){ const a = S.world.wind.a; return { x:Math.cos(a), y:Math.sin(a) }; }
function windNow(){ const a = S.world.wind.a + 0.22 * Math.sin(S.day * 0.8 + S.world.wind.sway); return { x:Math.cos(a), y:Math.sin(a) }; }
function genSites(R){
  const j = (a) => (R() - 0.5) * a, s = {};
  s.forestA = { type:'forest', u:HOME.u - 0.16 + j(0.04), v:HOME.v - 0.2 + j(0.05) };
  s.shore = { type:'shore', u:0.19 + j(0.08), v:0 }; s.shore.v = seaV(s.shore.u) - 0.05;
  s.village = { type:'village', u:0.82 + j(0.05), v:0.5 + j(0.08) };
  s.forestB = { type:'forest', u:0.79 + j(0.06), v:0.22 + j(0.05) };
  // 산마루 — 산기슭이 가장 깊은 곳 위에(오를 높이가 넉넉하게)
  let su = 0.25; for (let u = 0.15; u <= 0.381; u += 0.02) if (mountV(u) > mountV(su)) su = u;
  s.summit = { type:'summit', u:clamp(su + j(0.04), 0.12, 0.42), v:0 }; s.summit.v = Math.max(0.05, mountV(s.summit.u) * 0.26);
  s.ford = { type:'river', u:-1, v:-1, placed:false };
  Object.entries(s).forEach(([id, x]) => Object.assign(x, { id, found:false, linked:false, stone:false, seed:hashS(id + ':' + S.seed), data:{}, buf:0 }));
  return s;
}
function genBushes(R){
  const out = [];
  const ok = (p, gap) => p.u > 0.03 && p.u < 0.97 && p.v > 0.05 && p.v < 0.97 && !inSea({ u:p.u, v:p.v + 0.02 }) && !inMount(p) && !nearRiver(p, 0.045)
    && Object.values(S.sites).every((x) => x.type === 'river' || dist(p, x) > 0.075) && dist(p, HOME) > 0.045 && out.every((b) => dist(p, b) > gap);
  let tries = 0;
  while (out.length < 22 && tries++ < 800){ const a = R() * TAU, d = 0.05 + R() * 0.15, p = { u:HOME.u + Math.cos(a) * d, v:HOME.v + Math.sin(a) * d * WA * 0.8 }; if (ok(p, 0.028)) out.push({ u:p.u, v:p.v, s:0.8 + R() * 0.5, seed:Math.floor(R() * 1e9) }); }
  tries = 0;
  while (out.length < 58 && tries++ < 2000){ const p = { u:R(), v:R() }; if (ok(p, 0.045)) out.push({ u:p.u, v:p.v, s:0.6 + R() * 0.6, seed:Math.floor(R() * 1e9) }); }
  return out;
}
function leeOf(p){
  const w = windBase();
  return S.bushes.some((b) => { const dx = p.u - b.u, dy = (p.v - b.v) / WA, d = Math.hypot(dx, dy); if (d < 0.012 || d > 0.062) return false; return (dx * w.x + dy * w.y) / d > Math.cos(0.95); });
}
function buildWorld(seed){
  const R = mulberry(seed);
  S.world = genWorld(R);
  S.sites = genSites(R);
  S.bushes = genBushes(R);
}

/* ---------- 새 겨울 ---------- */
function newSeason(){
  const seed = (Math.random() * 2147483647) | 0;
  S = { v:3, seed, day:0.2, speed:1, over:null,
    res:{ wood:PR.startWood, food:PR.startFood, hope:PR.startHope }, people:PR.startPeople, hungry:0, cold:false,
    nests:[], stones:[], stars:{}, paths:[], walk:null, blocked:null, reveal:[], riverCrossed:false,
    signs:[], nextSign:2 + Math.random(), eagleNext:PR.eagleEvery ? PR.eagleEvery * (0.9 + Math.random() * 0.3) : 1e9,
    wand:[], lastWander:-1, flows:[], forming:0, maskN:0,
    mw:{ start:PR.mwFrom + Math.random() * Math.max(0, PR.mwTo - PR.mwFrom), len:PR.mwLen, on:false, known:false, done:false },
    stats:{ probes:0, commits:0, eagle:0, pulls:0, good:0, drills:0, waits:0, spins:0, voyages:0, slot:0, jackpots:0, nests:0, welcomed:0, turned:0, signs:0, missed:0, paths:0, walked:0 },
    seen:{} };
  buildWorld(seed);
  S.nests.push({ u:HOME.u, v:HOME.v, home:true, lee:leeOf(HOME), seed:hashS('home' + seed) });
  S.reveal.push({ u:HOME.u, v:HOME.v, r:0.13 });
  return S;
}
const capacity = () => S.nests.length * PR.nestCap;

/* ---------- 자아 — 고르지 않고 쌓인다 ---------- */
function sigmaOf(name){
  const s = SAVE.self, a = Math.abs(s.A), b = Math.abs(s.B);
  if (name === 'wren') return clamp(1 - Math.max(a, b) / 0.25, 0, 1);
  return clamp((Math.min(a, b) * 0.6 + Math.max(a, b) * 0.4 - 0.25) / 0.75, 0, 1);
}
function quadOf(A, B){ return A >= 0 ? (B >= 0 ? 'owl' : 'magpie') : (B >= 0 ? 'crane' : 'swallow'); }
function updateName(){
  const s = SAVE.self, m = Math.max(Math.abs(s.A), Math.abs(s.B));
  if (s.name === 'wren'){ if (m >= 0.25) s.name = quadOf(s.A, s.B); }
  else if (m < 0.15) s.name = 'wren';
  else { const q = quadOf(s.A, s.B); if (q !== s.name && Math.min(Math.abs(s.A), Math.abs(s.B)) > 0.08) s.name = q; }
}
function nudge(kind, w){
  const s = SAVE.self, a = PR.selfAlpha * (w === undefined ? 1 : w), before = s.name;
  if (kind === 'probe') s.A += a * (1 - s.A);
  else if (kind === 'commit') s.A += a * (-1 - s.A);
  else if (kind === 'careful') s.B += a * (1 - s.B);
  else if (kind === 'bold') s.B += a * (-1 - s.B);
  else if (kind === 'lean') s.C += a * (-1 - s.C);
  else if (kind === 'alone') s.C += a * (1 - s.C);
  s.A = clamp(s.A, -1, 1); s.B = clamp(s.B, -1, 1); s.C = clamp(s.C, -1, 1);
  updateName();
  if (s.name !== before && S){ fx('feather', { color:SELVES[s.name].color }); SFX.chime(); }
}
function rates(){
  const n = SAVE.self.name, sg = sigmaOf(n) * PR.selfK;
  return {
    walk:n === 'swallow' ? 1 + 0.3 * sg : n === 'owl' ? 1 - 0.1 * sg : 1,
    probe:n === 'owl' ? 1 - 0.4 * sg : n === 'swallow' ? 1 + 0.2 * sg : 1,
    signLife:n === 'magpie' ? 1 + 0.6 * sg : 1,
    tell:n === 'magpie' ? 1 + sg : 1,
    fog:n === 'magpie' ? 1 + 0.5 * sg : 1,
    wait:n === 'crane' ? 1 - 0.3 * sg : 1,
    burn:n === 'crane' ? 1 - 0.1 * sg : 1,
    hope:n === 'wren' ? 1 + 0.5 * sg : 1,
  };
}
// 물어보기(살펴보기)와 해 보기 — 해 보기 전에 몇 번 살폈는지가 '신중 ↔ 결단'
function probe(site, w){ S.stats.probes++; if (site) site.data.since = (site.data.since || 0) + 1; nudge('probe', w); }
function commit(site, w){ S.stats.commits++; nudge('commit', w); if (site){ nudge((site.data.since || 0) >= 2 ? 'careful' : 'bold', w); site.data.since = 0; } }
function discover(key){
  if (S.stars[key]) return;
  S.stars[key] = r1(S.day); S.res.hope = Math.min(10, S.res.hope + PR.starHope);
  fx('star', { key }); SFX.star(); nudge('alone', 0.6);
}

/* ---------- 시간 ---------- */
function tick(dt){
  if (!S || S.over || dt <= 0) return;
  S.day += dt;
  const R = rates(), night = TOD(S.day) === 'night';
  mwCheck();
  S.res.food -= S.people * PR.eat * dt;
  const units = S.nests.reduce((t, n) => t + (n.lee ? PR.leeBurn : 1), 0);
  S.res.wood -= units * PR.burn * dt * R.burn * (S.mw.on ? (S.mw.known ? PR.mwBurnKnown : PR.mwBurn) : 1) * (night ? 1.15 : 1);
  produce(dt);
  if (S.res.food <= 0){ S.res.food = 0; S.hungry += dt; S.res.hope -= PR.coldHope * dt; if (S.hungry > 1.5 && S.people > 1){ S.people--; S.hungry = 0.6; leaveFigure(); } }
  else S.hungry = Math.max(0, S.hungry - dt);
  if (S.res.wood <= 0){ S.res.wood = 0; S.cold = true; S.res.hope -= PR.coldHope * dt; } else S.cold = false;
  if (S.res.food > 0 && S.res.wood > 0) S.res.hope = Math.min(10, S.res.hope + 0.06 * dt * R.hope);
  walkStep(dt);
  wanderStep(dt);
  signStep();
  eagleStep();
  if (S.res.hope <= 0){ S.res.hope = 0; endSeason('scatter'); return; }
  if (S.day >= PR.seasonDays) endSeason('spring');
}
function mwCheck(){
  const m = S.mw;
  if (!m.on && !m.done && S.day >= m.start){ m.on = true; fx('ring', { color:'#9CC2DA' }); SFX.wind(); }
  if (m.on && S.day >= m.start + m.len){ m.on = false; m.done = true; }
}

/* ---------- 살림이 길을 따라 흐른다 ---------- */
function produce(dt){
  const hands = clamp(1 + 0.12 * (S.people - PR.startPeople), 0.6, 2.2);
  Object.values(S.sites).forEach((st) => {
    if (!st.linked || !st.route) return;
    let rate = 0, kind = null;
    if (st.type === 'forest'){ rate = PR.forestFlow; kind = 'wood'; }
    else if (st.type === 'shore'){ rate = S.mw.on ? 0 : PR.fishFlow; kind = 'food'; }
    if (!rate) return;
    if (st.stone) rate *= 0.5;
    st.buf = (st.buf || 0) + rate * hands * dt;
    while (st.buf >= 0.5){ st.buf -= 0.5; S.flows.push({ site:st.id, kind, amt:0.5, s:0 }); }
  });
  const sp = PR.walk * 2.2;
  S.flows = S.flows.filter((f) => {
    const st = S.sites[f.site]; if (!st || !st.route){ return false; }
    f.s += sp * dt;
    if (f.s >= st.routeL){ S.res[f.kind] += f.amt; S.lastGain = { kind:f.kind, at:nowMs() }; return false; }
    return true;
  });
}

/* ---------- 길 — 손가락으로 그리고, 걸은 만큼 세상이 그려진다 ---------- */
function polyCum(pts){ const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i - 1] + dist(pts[i - 1], pts[i])); return c; }
function ptAt(pts, cum, s){
  if (s <= 0) return { u:pts[0].u, v:pts[0].v };
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s){ const t = (s - cum[i - 1]) / Math.max(1e-9, cum[i] - cum[i - 1]); return { u:lerp(pts[i - 1].u, pts[i].u, t), v:lerp(pts[i - 1].v, pts[i].v, t) }; } }
  const l = pts[pts.length - 1]; return { u:l.u, v:l.v };
}
function dirAt(pts, cum, s){
  for (let i = 1; i < pts.length; i++){ if (cum[i] >= s || i === pts.length - 1){ const a = pts[i - 1], b = pts[i], dx = b.u - a.u, dy = (b.v - a.v) / WA, d = Math.hypot(dx, dy) || 1; return { x:dx / d, y:dy / d }; } }
  return { x:1, y:0 };
}
const pathAt = (p, s) => ptAt(p.pts, p.cum, s);
function prefix(p, s){ const out = []; for (let i = 0; i < p.pts.length && p.cum[i] < s; i++) out.push(p.pts[i]); out.push(pathAt(p, s)); return out; }
function routeToHome(pi, s){
  let pts = [], guard = 0;
  while (pi >= 0 && guard++ < 40){ const p = S.paths[pi]; pts = pts.concat(prefix(p, s).reverse()); s = p.from.s; pi = p.from.pi; }
  pts.push({ u:HOME.u, v:HOME.v });
  return pts;
}
function walkSpeed(pos, dir){
  let k = PR.walk * rates().walk * (S.mw.on ? 0.35 : 1);
  if (inMount(pos)) k *= PR.mountSlow + (1 - PR.mountSlow) * Math.abs(dir.x);   // 곧장 오르면 느리고, 비스듬히 돌면 덜 느리다(기울기)
  if (S.cold) k *= 0.8;
  return Math.max(0.02, k);
}
// 그린 선을 실제 길로 — 바다 앞에서 멈추고, 강은 건너기 전까지 둑에서 멈춘다
function makePath(raw, from){
  let pts = raw.map((p) => ({ u:clamp(p.u, 0.01, 0.99), v:clamp(p.v, 0.01, 0.985) }));
  let rest = null, stopAt = null;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i - 1], b = pts[i];
    if (inSea(b)){ let lo = 0, hi = 1; for (let k = 0; k < 18; k++){ const m = (lo + hi) / 2, q = { u:lerp(a.u, b.u, m), v:lerp(a.v, b.v, m) }; if (inSea(q)) hi = m; else lo = m; } const q = { u:lerp(a.u, b.u, lo * 0.97), v:lerp(a.v, b.v, lo * 0.97) }; pts = pts.slice(0, i).concat([q]); break; }
    if (!S.riverCrossed && !S.mw.on && riverSide(a) !== riverSide(b)){
      let lo = 0, hi = 1; for (let k = 0; k < 18; k++){ const m = (lo + hi) / 2, q = { u:lerp(a.u, b.u, m), v:lerp(a.v, b.v, m) }; if (riverSide(q) === riverSide(a)) lo = m; else hi = m; }
      const cross = { u:lerp(a.u, b.u, lo), v:lerp(a.v, b.v, lo) }, len = dist(a, b) || 1, back = Math.min(lo, 0.03 / len);
      const bank = { u:lerp(a.u, b.u, lo - back), v:lerp(a.v, b.v, lo - back) };
      const far = { u:lerp(a.u, b.u, Math.min(1, hi + back)), v:lerp(a.v, b.v, Math.min(1, hi + back)) };

}
function startPath(raw, from){
  if (S.walk || S.over || raw.length < 2) return null;
  const p = makePath(raw, from);
  if (p.L < 0.02) return null;
  S.paths.push(p); S.walk = { pi:S.paths.length - 1 }; S.stats.paths++;
  commit(null, 0.4);
  SFX.scratch();
  return p;
}
function revealAt(pos, r){
  const last = S.reveal[S.reveal.length - 1];
  if (!r && last && dist(last, pos) < 0.022) return;
  S.reveal.push({ u:r2(pos.u * 10) / 10, v:r2(pos.v * 10) / 10, r:r || PR.revealR });
  S.maskN++;
  Object.values(S.sites).forEach((st) => { if (!st.found && st.type !== 'river' && dist(st, pos) < (r || PR.revealR) + 0.03){ st.found = true; fx('pop', { u:st.u, v:st.v }); } });
}
function linkCheck(pos, pi, s){
  Object.values(S.sites).forEach((st) => {
    if (st.linked || st.type === 'river') return;
    if (dist(st, pos) < (st.type === 'summit' ? 0.028 : 0.05)){
      st.found = true; st.linked = true; st.link = { pi, s };
      st.route = [{ u:st.u, v:st.v }].concat(routeToHome(pi, s)); st.routeL = polyCum(st.route).pop();
      fx('link', { u:st.u, v:st.v }); SFX.good();

}
// 산 — 곧장 오르기보다 비스듬히 돌아 오르는 길이 빠르다(숨은 기울기 규칙)
function mountCheck(pi){
  if (S.stars.mount) return;
  let mt = 0, ms = 0, mc = 0, p = S.paths[pi], guard = 0;
  while (p && guard++ < 20){ mt += p.mt || 0; ms += p.ms || 0; mc += p.mc || 0; p = p.from.pi >= 0 ? S.paths[p.from.pi] : null; }
  // 오른 높이만큼 곧장 올랐다면 걸렸을 날(ms)보다 넉넉히 빨랐다면 — '비스듬히 돌아 오르기'를 찾은 것
  S.mountTry = { mt:r2(mt), ms:r2(ms), mc:r2(mc) };
  if (mc > 0.03 && mt < ms * 0.85) discover('mount');
}
function walkStep(dt){
  const wk = S.walk; if (!wk) return;
  const p = S.paths[wk.pi];
  let remain = dt, guard = 0;
  while (remain > 1e-7 && p.walked < p.L - 1e-9 && guard++ < 200){
    const pos = pathAt(p, p.walked), sp = walkSpeed(pos, dirAt(p.pts, p.cum, p.walked + 1e-4));
    const step = Math.min(sp * remain, p.L - p.walked, 0.008);
    p.walked += step; remain -= step / sp; S.stats.walked += step;
    const np = pathAt(p, p.walked);
    if (inMount(pos)){
      // 산에서 쓴 날(mt)과, 같은 높이를 곧장 올랐다면 쓸 날(ms)
      p.mt = (p.mt || 0) + step / sp;
      const up = Math.max(0, pos.v - np.v) / WA;
      if (up > 0){ p.mc = (p.mc || 0) + up; p.ms = (p.ms || 0) + up / walkSpeed(pos, { x:0, y:-1 }); }
    }

  }

    p.done = true; p.t1 = S.day; S.walk = null;
    if (p.rest){
      // 강가에서 멈췄다 — 여울(얼음)이 이 자리로
      const f = S.sites.ford;
      Object.assign(f, { u:p.cross.u, v:p.cross.v, placed:true, found:true, linked:true });
      S.blocked = { pi:S.paths.indexOf(p) };
      fx('link', { u:f.u, v:f.v }); SFX.good();
    }
  }
}
// 얼음을 건넜다 — 멈춘 길이 이어진다
function resumeAcross(){
  const b = S.blocked; if (!b) return;
  const p = S.paths[b.pi];
  if (p.rest){ p.pts = p.pts.concat(p.rest); p.cum = polyCum(p.pts); p.L = p.cum[p.cum.length - 1]; p.rest = null; p.done = false; S.walk = { pi:b.pi }; }
  S.blocked = null;
}
// 길이 시작될 수 있는 곳 — 집이나 이미 걸은 길 위
function networkPoint(u, v, tolU){
  let best = null, bd = tolU;
  const dh = dist({ u, v }, HOME); if (dh < bd){ bd = dh; best = { pi:-1, s:0, pt:{ u:HOME.u, v:HOME.v } }; }
  S.paths.forEach((p, pi) => {
    const L = p.done ? p.L : p.walked;
    for (let s = 0; s <= L; s += 0.008){ const q = pathAt(p, s), d = dist(q, { u, v }); if (d < bd){ bd = d; best = { pi, s, pt:q }; } }

}
// 길이 걸릴 날 — 그리는 동안 손끝에 해로 보여 준다
function estimateDays(raw){
  const p = makePath(raw, null); let t = 0;
  for (let s = 0; s < p.L; s += 0.01){ const pos = pathAt(p, s); t += Math.min(0.01, p.L - s) / walkSpeed(pos, dirAt(p.pts, p.cum, s + 1e-4)); }
  return { days:t, blocked:!!p.rest, end:p.pts[p.pts.length - 1] };
}

/* ---------- 둥지 ---------- */
function nestSpotOk(p){
  return dist(p, HOME) < 0.17 && !inSea({ u:p.u, v:p.v + 0.02 }) && !nearRiver(p, 0.035) && !inMount(p)
    && S.nests.every((n) => dist(n, p) > 0.034) && S.bushes.every((b) => dist(b, p) > 0.014);
}
function buildNest(p){
  if (S.over || S.mw.on || S.res.wood < PR.nestWood || !nestSpotOk(p)) return false;
  S.res.wood -= PR.nestWood;
  const lee = leeOf(p);
  S.nests.push({ u:p.u, v:p.v, lee, seed:hashS('n' + S.nests.length + S.seed) });
  S.res.hope = Math.min(10, S.res.hope + 0.4); S.stats.nests++;
  commit(null, 0.5);
  if (S.nests.filter((n) => !n.home && n.lee).length >= 2) discover('nest');
  fx('ring', { u:p.u, v:p.v, color:PAL.bloom }); SFX.pull();
  return true;
}

/* ---------- 떠돌이 — 해 질 녘에 불빛을 보고 온다 ---------- */
function wanderStep(dt){
  const f = dayFrac(S.day), dn = Math.floor(S.day);
  if (f > 0.66 && f < 0.8 && S.lastWander !== dn && !S.mw.on){
    S.lastWander = dn;
    const waiting = S.wand.filter((w) => w.st !== 'leave').length;
    if (S.res.hope >= 3.5 && capacity() > S.people + waiting && Math.random() < 0.75) spawnWanderer();
  }
  const sp = 0.32 * dt;
  S.wand = S.wand.filter((w) => {
    const tgt = w.st === 'come' || w.st === 'join' ? HOME : w.out;
    const d = dist(w, tgt);
    if (w.st === 'wait'){ if (S.day > w.until){ w.st = 'leave'; S.res.hope = Math.max(0, S.res.hope - 0.15); S.stats.turned++; } return true; }
    if (d > 0.001){ const k = Math.min(1, sp / d); w.u = lerp(w.u, tgt.u, k); w.v = lerp(w.v, tgt.v, k); }
    if (w.st === 'come' && dist(w, HOME) < 0.075){ w.st = 'wait'; w.until = S.day + 1.1; }
    if (w.st === 'join' && dist(w, HOME) < 0.012){ S.people++; return false; }
    if (w.st === 'leave' && dist(w, w.out) < 0.01) return false;
    return true;
  });
}
function edgePoint(){ const r = Math.random(); return r < 0.4 ? { u:0.01, v:0.25 + Math.random() * 0.5 } : r < 0.75 ? { u:0.2 + Math.random() * 0.6, v:0.015 } : { u:0.99, v:0.25 + Math.random() * 0.5 }; }
function spawnWanderer(){ const e = edgePoint(); S.wand.push({ u:e.u, v:e.v, out:e, st:'come', seed:Math.floor(Math.random() * 1e9) }); }
function welcome(w){
  if (w.st !== 'wait' && w.st !== 'come') return false;
  w.st = 'join'; S.res.hope = Math.min(10, S.res.hope + PR.welcomeHope); S.stats.welcomed++;
  fx('ring', { u:w.u, v:w.v, color:PAL.lantern }); SFX.welcome();

}
function leaveFigure(){ const e = edgePoint(); S.wand.push({ u:HOME.u, v:HOME.v, out:e, st:'leave', seed:1 }); }

/* ---------- 징조 — 지나가는 새 떼를 잡는다 ---------- */
function shoreStorm(){ const d = S.sites.shore.data; if (d.period === undefined) return 0.3; return S.mw.on ? 0.8 : clamp(0.12 + 0.42 * (0.5 + 0.5 * Math.cos(TAU * (S.day - d.phase) / d.period)), 0.1, 0.6); }

  if (S.day < S.nextSign) return;

  if (!S.mw.known && !S.mw.on && !S.mw.done && toMw > 0 && toMw < 4.5) kind = 'crow';

}

}
function catchSign(sg){
  S.signs = S.signs.filter((x) => x !== sg); S.stats.signs++;
  if (sg.kind === 'crow') S.mw.known = true;
  else if (sg.kind === 'gull'){ const d = S.sites.shore.data; d.fog = Math.max(0, (d.fog === undefined ? 0.85 : d.fog) - 0.3); }

}

/* ---------- 독수리 — 빈자리를 먼저 굳히고, 장치에선 답을 바로 준다 ---------- */

}

/* ---------- 끝 ---------- */

/* ---------- 저장 — 씨앗으로 다시 그릴 수 있는 건 빼고 ---------- */
const q3 = (x) => Math.round(x * 1000) / 1000;
function pack(){

    nests:S.nests.map((n) => [q3(n.u), q3(n.v), n.lee ? 1 : 0, n.home ? 1 : 0]), stones:S.stones.map((x) => [q3(x.u), q3(x.v)]), stoneB:S.bushes.map((b, i) => (b.stone ? i : -1)).filter((i) => i >= 0),
    stars:S.stars, paths:S.paths.map((p) => ({ pts:p.pts.map((q) => [q3(q.u), q3(q.v)]), from:p.from, walked:r2(p.walked * 100) / 100, done:p.done, rest:p.rest ? p.rest.map((q) => [q3(q.u), q3(q.v)]) : null, cross:p.cross, t0:p.t0, t1:p.t1, m:p.mt ? [q3(p.mt), q3(p.ms || 0), q3(p.mc || 0)] : null })),

}
function unpack(o){
  if (!o || o.v !== 3) return null;
  S = { v:3, seed:o.seed, day:o.day, speed:o.speed || 1, over:null, res:o.res, people:o.people, hungry:o.hungry || 0, cold:false, stars:o.stars || {},
    paths:[], walk:o.walk, blocked:o.blocked, reveal:[], riverCrossed:o.riverCrossed, signs:[], nextSign:o.nextSign, eagleNext:o.eagleNext,
    wand:[], lastWander:o.lastWander, flows:[], forming:1, maskN:0, mw:o.mw, stats:o.stats, seen:o.seen || {} };
  buildWorld(o.seed);
  (o.stoneB || []).forEach((i) => { if (S.bushes[i]) S.bushes[i].stone = true; });
  S.nests = o.nests.map((a, i) => ({ u:a[0], v:a[1], lee:!!a[2], home:!!a[3], seed:hashS('n' + i + o.seed) }));
  S.stones = (o.stones || []).map((a) => ({ u:a[0], v:a[1] }));
  S.paths = o.paths.map((p) => { const pts = p.pts.map((a) => ({ u:a[0], v:a[1] })), cum = polyCum(pts); return { pts, cum, L:cum[cum.length - 1], from:p.from, walked:p.walked, done:p.done, rest:p.rest ? p.rest.map((a) => ({ u:a[0], v:a[1] })) : null, cross:p.cross, t0:p.t0, t1:p.t1, mt:p.m ? p.m[0] : 0, ms:p.m ? p.m[1] : 0, mc:p.m ? p.m[2] : 0 }; });

/* =================== 5-devices: 고르는 장치 — 가지 뽑기 · 얼음 재기 · 돌림판 · 장터 머신 ===================
   장치는 책에서 튀어나오는 '팝업 쪽'이다. 글은 없고, 손으로 움직인다. 장치마다 숨은 규칙이 있고, 해 보면 보인다.
   여백(공책)에는 해 본 만큼 기록이 쌓인다 — 셈 막대 · 점 · 줄. 독수리 깃털을 누르면 답이 바로 보이지만, 터전의 덤불 하나가 돌이 된다. */
const DV = { id:null, t0:0, drag:null, anim:[], done:{}, sunAt:0, lastW:0 };
function devSite(){ return DV.id && S ? S.sites[DV.id] : null; }
function devLayout(){
  const pw = Math.min(W * 0.95, 1020), ph = Math.min(H * 0.92, 680), D = { x:(W - pw) / 2, y:(H - ph) / 2, w:pw, h:ph };
  const portrait = pw < 620 || W < H * 0.95, pad = clamp(pw * 0.025, 10, 20), hdr = 46;

  if (!portrait){ const mw = Math.round(pw * 0.26); A = { x:D.x + pad, y:D.y + hdr, w:pw - mw - pad * 3, h:ph - hdr - pad }; M = { x:A.x + A.w + pad, y:A.y, w:mw, h:A.h }; }
  else { const mh = Math.round(ph * 0.27); A = { x:D.x + pad, y:D.y + hdr, w:pw - pad * 2, h:ph - hdr - mh - pad * 2 }; M = { x:A.x, y:A.y + A.h + pad, w:A.w, h:mh }; }
  return { D, A, M, portrait, close:{ x:D.x + D.w - 50, y:D.y + 4, w:46, h:40 }, feather:{ x:D.x + 6, y:D.y + 4, w:46, h:40 } };
}
const inR = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function openDevice(id){
  const st = S.sites[id]; if (!st || !st.linked || S.over) return false;
  DV.id = id; DV.t0 = nowMs(); DV.drag = null; DV.anim = [];
  DEVICES[st.type].init(st);
  S.seen['dev_' + st.type] = (S.seen['dev_' + st.type] || 0) + 1;
  SFX.page();
  return true;
}
function closeDevice(){ if (!DV.id) return; DV.id = null; DV.drag = null; DV.anim = []; SFX.page(); }
// 장치 안에서 흐르는 시간 — 해가 머리 위 호를 따라 움직인다
function devTime(days, o){
  const steps = Math.max(1, Math.ceil(days / 0.02));
  for (let i = 0; i < steps && S && !S.over; i++) tick(days / steps);
  if (o && o.wait && S && !S.over){ const save = (1 - rates().wait) * S.people * PR.eat * days; S.res.food += save; }
  DV.sunAt = nowMs();

function devAnim(kind, o){ DV.anim.push(Object.assign({ kind, t0:nowMs(), life:900 }, o)); }
function ghostDone(type){ SAVE.seen['g_' + type] = 1; }
function ghostOn(type){ return !SAVE.seen['g_' + type]; }
// 공책 — 줄 그은 여백
function drawMarginPaper(g, M){
  g.fillStyle = isDark() ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.35)'; g.fillRect(M.x, M.y, M.w, M.h);
  g.strokeStyle = isDark() ? 'rgba(160,190,220,.12)' : 'rgba(110,150,190,.22)'; g.lineWidth = 1;
  for (let y = M.y + 22; y < M.y + M.h - 4; y += 22){ g.beginPath(); g.moveTo(M.x + 4, y); g.lineTo(M.x + M.w - 4, y); g.stroke(); }
  g.strokeStyle = 'rgba(200,90,80,.3)'; g.beginPath(); g.moveTo(M.x + 14, M.y + 4); g.lineTo(M.x + 14, M.y + M.h - 4); g.stroke();
}
function tally(g, x, y, n, h, col){
  g.strokeStyle = col; g.lineWidth = 1.6; g.lineCap = 'round';

/* ======================= 숲 — 가지 뽑기(제비뽑기) =======================
   숨은 규칙: 두 통의 좋은 가지 비율이 다르다(표본으로 비율을 어림한다).
   편법: 썩은 가지는 끝이 아주 조금 이끼빛이다 — 끝만 보고 골라 뽑으면 연달아 좋은 가지가 나온다. */
const DEV_FOREST = {
  init(st){
    const d = st.data;
    if (!d.cups){ const R = mulberry(st.seed); const rs = R() < 0.5 ? [0.78, 0.42] : [0.42, 0.78]; d.cups = rs.map((ratio) => ({ ratio:r2(ratio + (R() - 0.5) * 0.08), sticks:Array.from({ length:11 }, () => ({ good:R() < ratio, sh:R() })), log:[], streak:0 })); d.last = S.day; }
    const add = Math.floor(S.day - d.last);
    if (add > 0){ d.cups.forEach((c) => { for (let i = 0; i < add && c.sticks.length < 11; i++) c.sticks.push({ good:Math.random() < c.ratio, sh:Math.random() }); }); d.last += add; }
  },
  geo(L){
    const A = L.A, cw = Math.min(A.w * 0.2, 170), ch = Math.min(A.h * 0.26, 150);
    return [0, 1].map((i) => ({ cx:A.x + A.w * (i ? 0.7 : 0.3), cy:A.y + A.h * 0.78, cw, ch, Ls:Math.min(A.h * 0.36, 210) }));
  },
  stickPose(c, i, n){ const k = i - (n - 1) / 2, ang = -Math.PI / 2 + k * 0.085; const bx = c.cx + k * c.cw * 0.055, by = c.cy - c.ch * 0.62; return { bx, by, dx:Math.cos(ang), dy:Math.sin(ang) }; },
  tipCol(sk, st){
    const good = isDark() ? '#CDB58A' : '#D8B987', moss = isDark() ? '#8D9A68' : '#8F9B68';
    const k = sk.good ? 0 : clamp(PR.tellShade * rates().tell, 0, 1);
    const noise = (sk.sh - 0.5) * 0.12;
    return mixHex(good, moss, clamp(k + noise * (sk.good ? 1 : 0.6), 0, 1));
  },
  draw(g, L, now, st){
    const A = L.A, R = mulberry(st.seed + 7), d = st.data;
    // 숲 바닥과 뒤편 소나무
    g.globalAlpha = 0.55; for (let i = 0; i < 10; i++) drawPine(g, A.x + A.w * (0.03 + i * 0.105) + (R() - 0.5) * 16, A.y + A.h * (0.36 + R() * 0.06), A.h * (0.16 + R() * 0.08), R, { stone:st.stone }); g.globalAlpha = 1;
    wash(g, A.x + A.w * 0.5, A.y + A.h * 0.86, A.w * 0.55, PAL.snowSh, 0.35, R, { sy:0.22, edge:false });
    // 땔감 더미 — 지금 가진 땔감
    const wx = A.x + A.w * 0.5, wy = A.y + A.h * 0.95, n = clamp(Math.round(S.res.wood), 0, 14);
    for (let i = 0; i < n; i++){ const row = Math.floor(i / 5), col = i % 5; iconLogs(g, wx + (col - 2) * 16 + row * 8, wy - row * 11, 7); }
    this.geo(L).forEach((c, ci) => {
      const cup = d.cups[ci], sticks = cup.sticks;
      sticks.forEach((sk, i) => {
        const p = this.stickPose(c, i, sticks.length);
        let off = 0; if (DV.drag && DV.drag.ci === ci && DV.drag.i === i) off = DV.drag.off;
        const tx = p.bx + p.dx * (c.Ls * 0.62 + off), ty = p.by + p.dy * (c.Ls * 0.62 + off), sx = p.bx + p.dx * off, sy = p.by + p.dy * off + c.ch * 0.5;
        g.strokeStyle = PAL.ink; g.lineWidth = 5; g.lineCap = 'round'; g.globalAlpha = 0.75; g.beginPath(); g.moveTo(sx, sy); g.lineTo(tx, ty); g.stroke();
        g.strokeStyle = PAL.wood; g.lineWidth = 3.4; g.globalAlpha = 1; g.beginPath(); g.moveTo(sx, sy); g.lineTo(tx, ty); g.stroke();
        g.fillStyle = this.tipCol(sk, st); g.beginPath(); g.ellipse(tx, ty, 4.2, 5.4, Math.atan2(p.dy, p.dx) + Math.PI / 2, 0, TAU); g.fill();
        if (d.eagle && !sk.good){ g.fillStyle = PAL.stone2; g.beginPath(); g.arc(tx, ty - 9, 3, 0, TAU); g.fill(); }
      });
      // 나무통
      const top = c.cy - c.ch * 0.62, bot = c.cy + c.ch * 0.25;
      g.fillStyle = PAL.trunk; g.beginPath(); g.moveTo(c.cx - c.cw / 2, top); g.lineTo(c.cx + c.cw / 2, top); g.lineTo(c.cx + c.cw * 0.42, bot); g.lineTo(c.cx - c.cw * 0.42, bot); g.closePath(); g.fill();
      inkPoly(g, [{ x:c.cx - c.cw / 2, y:top }, { x:c.cx - c.cw * 0.42, y:bot }, { x:c.cx + c.cw * 0.42, y:bot }, { x:c.cx + c.cw / 2, y:top }], 1.6, PAL.ink, R, 0.8);
      g.strokeStyle = PAL.ink; g.globalAlpha = 0.45; g.lineWidth = 1.2; [0.3, 0.65].forEach((k) => { const y = lerp(top, bot, k), hw = lerp(c.cw / 2, c.cw * 0.42, k); g.beginPath(); g.moveTo(c.cx - hw, y); g.lineTo(c.cx + hw, y); g.stroke(); }); g.globalAlpha = 1;
      g.fillStyle = 'rgba(20,14,8,.55)'; g.beginPath(); g.ellipse(c.cx, top, c.cw / 2, c.cw * 0.08, 0, 0, TAU); g.fill();
    });
    // 뽑힌 가지의 끝 — 통나무가 되어 날아가거나, 부서진다
    DV.anim = DV.anim.filter((a) => {
      const p = clamp((now - a.t0) / a.life, 0, 1);
      if (a.kind === 'log'){ const x = lerp(a.x, wx, easeOut(p)), y = lerp(a.y, wy - 30, easeOut(p)) - Math.sin(p * Math.PI) * 60; g.save(); g.translate(x, y); g.rotate(p * 6); iconLogs(g, 0, 0, 9); g.restore(); }
      else if (a.kind === 'dust'){ g.fillStyle = PAL.stone2; for (let i = 0; i < 12; i++){ const ang = i / 12 * TAU, r = p * 34; g.globalAlpha = (1 - p) * 0.7; g.beginPath(); g.arc(a.x + Math.cos(ang) * r, a.y + Math.sin(ang) * r * 0.6 + p * 20, 2.2 * (1 - p) + 0.6, 0, TAU); g.fill(); } g.globalAlpha = 1; }
      return p < 1;
    });
  },
  hit(L, st, x, y){
    const d = st.data, gs = this.geo(L);
    for (let ci = 0; ci < 2; ci++){ const c = gs[ci], n = d.cups[ci].sticks.length; for (let i = n - 1; i >= 0; i--){ const p = this.stickPose(c, i, n), tx = p.bx + p.dx * c.Ls * 0.62, ty = p.by + p.dy * c.Ls * 0.62; if (Math.hypot(tx - x, ty - y) < 16) return { ci, i, p, c }; } }
    return null;
  },
  down(L, st, x, y){ const h = this.hit(L, st, x, y); if (!h) return false; DV.drag = { ci:h.ci, i:h.i, off:0, y0:y, x0:x, p:h.p, c:h.c }; SFX.scratch(); return true; },
  move(L, st, x, y){ const dr = DV.drag; if (!dr) return; const along = (x - dr.x0) * dr.p.dx + (y - dr.y0) * dr.p.dy; dr.off = clamp(along, 0, dr.c.Ls * 0.9); },
  up(L, st){
    const dr = DV.drag; DV.drag = null; if (!dr) return;
    if (dr.off < dr.c.Ls * 0.5) return;            // 덜 뽑았다 — 도로 들어간다
    const cup = st.data.cups[dr.ci], sk = cup.sticks.splice(dr.i, 1)[0];
    const tx = dr.p.bx + dr.p.dx * (dr.c.Ls * 0.62 + dr.off), ty = dr.p.by + dr.p.dy * (dr.c.Ls * 0.62 + dr.off);
    cup.log.push(sk.good ? 1 : 0); if (cup.log.length > 30) cup.log.shift();
    S.stats.pulls++; ghostDone('forest');
    if (sk.good){ S.res.wood += PR.stickWood * (st.stone ? 0.5 : 1); S.stats.good++; cup.streak++; devAnim('log', { x:tx, y:ty, life:700 }); SFX.pull(); }
    else { cup.streak = 0; devAnim('dust', { x:tx, y:ty, life:800 }); SFX.bad(); }
    nudge('commit', 0.15);
    if (cup.streak >= 5 && cup.ratio <= 0.62 && !st.data.eagle && !st.stone) discover('forest');
    devTime(PR.pullTime);
  },
  margin(g, M, st){
    const d = st.data;
    d.cups.forEach((cup, ci) => {
      const x = M.x + 24 + ci * (M.w - 30) / 2, cw = (M.w - 44) / 2;
      // 통 그림 하나 — 어느 통인지
      g.fillStyle = PAL.trunk; g.beginPath(); g.moveTo(x, M.y + 12); g.lineTo(x + 18, M.y + 12); g.lineTo(x + 15, M.y + 30); g.lineTo(x + 3, M.y + 30); g.closePath(); g.fill();
      let gy = M.y + 62, k = 0;
      const good = cup.log.filter((v) => v).length, bad = cup.log.length - good;
      tally(g, x, gy, Math.min(good, 25), 14, PAL.wood);
      gy += 30;
      g.strokeStyle = PAL.stone2; g.lineWidth = 1.6;
      for (let i = 0; i < Math.min(bad, 20); i++){ const bx = x + (i % 8) * 8, by = gy + Math.floor(i / 8) * 10; g.beginPath(); g.moveTo(bx - 3, by - 3); g.lineTo(bx + 3, by + 3); g.moveTo(bx + 3, by - 3); g.lineTo(bx - 3, by + 3); g.stroke(); k++; }
      // 비율 막대 — 해 본 만큼
      const by = M.y + M.h - 26;
      g.strokeStyle = PAL.ink; g.globalAlpha = 0.5; g.lineWidth = 1; g.strokeRect(x, by, cw, 10); g.globalAlpha = 1;
      if (cup.log.length){ g.fillStyle = PAL.wood; g.fillRect(x, by, cw * good / cup.log.length, 10); }
      if (d.eagle){ g.strokeStyle = PAL.stone2; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x + cw * cup.ratio, by - 5); g.lineTo(x + cw * cup.ratio, by + 15); g.stroke(); }
    });
  },
  ghost(L, st, t){
    const c = this.geo(L)[0], n = st.data.cups[0].sticks.length; if (!n) return null;
    const p = this.stickPose(c, Math.floor(n / 2), n), tx = p.bx + p.dx * c.Ls * 0.62, ty = p.by + p.dy * c.Ls * 0.62;
    const k = ease(clamp(t * 1.6, 0, 1));
    return { x:tx + 4, y:ty - k * 70, a:Math.sin(clamp(t, 0, 1) * Math.PI) };
  },
};

/* ======================= 강 — 얼음 재기 =======================
   숨은 규칙: 얼음 두께는 날마다 같은 만큼 는다(일차함수). 두 번 재면 줄이 그어지고, 썰매 줄과 만나는 날이 건너는 날.
   편법: 한겨울엔 물이 돌처럼 언다 — 아무 데서나 건넌다. */
const DEV_RIVER = {
  init(st){ const d = st.data; if (d.rate === undefined){ const R = mulberry(st.seed); d.d0 = r2(S.day - 1); d.base = r2(4.2 + R() * 2.4); d.rate = r2(0.85 + R() * 0.6); d.probes = []; d.wait = 2; d.fails = 0; d.sled = 0; d.core = null; } },
  th(d, day){ const t = d.base + d.rate * (day - d.d0); return S.mw.on ? Math.max(t, 32) : t; },
  safeDay(d){ return d.d0 + (PR.iceNeed - d.base) / d.rate; },
  geo(L){
    const A = L.A;
    return { iceT:A.y + A.h * 0.3, iceB:A.y + A.h * 0.62, drill:{ x:A.x + A.w * 0.14, y:A.y + A.h * 0.84 }, sled:{ x:A.x + A.w * 0.48, y:A.y + A.h * 0.8 },
      minus:{ x:A.x + A.w * 0.64, y:A.y + A.h * 0.9, r:16 }, plus:{ x:A.x + A.w * 0.9, y:A.y + A.h * 0.9, r:16 }, glass:{ x:A.x + A.w * 0.77, y:A.y + A.h * 0.79, r:20 } };
  },
  draw(g, L, now, st){
    const A = L.A, d = st.data, G = this.geo(L), R = mulberry(st.seed + 3), th = this.th(d, S.day);
    // 건너편 — 마을이 있을 것 같은 둑
    wash(g, A.x + A.w * 0.5, A.y + A.h * 0.16, A.w * 0.6, PAL.snowSh, 0.4, R, { sy:0.18, edge:false });
    for (let i = 0; i < 6; i++) drawPine(g, A.x + A.w * (0.08 + i * 0.17), A.y + A.h * 0.26, A.h * 0.12, R);
    drawCottage(g, A.x + A.w * 0.78, A.y + A.h * 0.22, A.h * 0.1, R);
    // 얼음 — 얇을수록 어둡고 금이 많다(친절하지 않은 근거)
    const k = clamp((th - 4) / (PR.iceNeed + 6 - 4), 0, 1);
    g.fillStyle = mixHex(PAL.iceThin, PAL.ice, k); g.fillRect(A.x, G.iceT, A.w, G.iceB - G.iceT);
    inkLine(g, [{ x:A.x, y:G.iceT }, { x:A.x + A.w * 0.5, y:G.iceT + 4 }, { x:A.x + A.w, y:G.iceT - 2 }], 1.6, PAL.ink, R, 0.7);
    inkLine(g, [{ x:A.x, y:G.iceB }, { x:A.x + A.w * 0.5, y:G.iceB - 3 }, { x:A.x + A.w, y:G.iceB + 2 }], 1.6, PAL.ink, R, 0.7);
    g.strokeStyle = isDark() ? 'rgba(220,235,245,.5)' : 'rgba(255,255,255,.95)'; g.lineWidth = 1;
    const cracks = Math.round(lerp(14, 3, k));
    for (let i = 0; i < cracks; i++){ const cx = A.x + R() * A.w, cy = lerp(G.iceT, G.iceB, R()); g.beginPath(); g.moveTo(cx, cy); for (let j = 0; j < 4; j++) g.lineTo(cx + (R() - 0.3) * 30 * (j + 1) * 0.5, cy + (R() - 0.5) * 12); g.stroke(); }
    // 가까운 둑
    wash(g, A.x + A.w * 0.5, A.y + A.h * 0.9, A.w * 0.62, PAL.snowSh, 0.3, R, { sy:0.16, edge:false });
    for (let i = 0; i < 12; i++){ const rx = A.x + R() * A.w, ry = G.iceB + 6 + R() * 10; inkLine(g, [{ x:rx, y:ry + 10 }, { x:rx + (R() - 0.5) * 6, y:ry - 8 }], 1, PAL.ink, null, 0.4); }
    // 잰 자리 — 얼음 기둥
    if (d.core){ const p = clamp((now - d.core.t) / 700, 0, 1), ch = d.core.th * 4.2; g.fillStyle = PAL.ice; g.strokeStyle = PAL.ink; g.lineWidth = 1.2; g.fillRect(d.core.x - 7, d.core.y - ch * p, 14, ch * p); g.strokeRect(d.core.x - 7, d.core.y - ch * p, 14, ch * p);
      g.strokeStyle = PAL.ink; g.globalAlpha = 0.5; for (let c = 0; c <= 20; c += 2){ g.beginPath(); g.moveTo(d.core.x + 9, d.core.y - c * 4.2); g.lineTo(d.core.x + (c % 4 ? 13 : 17), d.core.y - c * 4.2); g.stroke(); } g.globalAlpha = 1; }
    // 송곳
    if (!(DV.drag && DV.drag.what === 'drill')) this.drawDrill(g, G.drill.x, G.drill.y);
    // 기다림 — 해 몇 개(반나절씩)
    [G.minus, G.plus].forEach((b, i) => { g.strokeStyle = PAL.ink; g.lineWidth = 1.6; g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.stroke(); g.beginPath(); g.moveTo(b.x - 7, b.y); g.lineTo(b.x + 7, b.y); if (i){ g.moveTo(b.x, b.y - 7); g.lineTo(b.x, b.y + 7); } g.stroke(); });
    const nS = d.wait, sx0 = G.minus.x + 26, span = G.plus.x - G.minus.x - 52;
    for (let i = 0; i < nS; i++){ const x = sx0 + (span / Math.max(1, nS)) * (i + 0.5); if (i % 2 === 0){ g.fillStyle = '#F0B13A'; g.beginPath(); g.arc(x, G.minus.y, 6, Math.PI / 2, Math.PI * 1.5); g.fill(); } else { g.fillStyle = '#F0B13A'; g.beginPath(); g.arc(x - span / Math.max(1, nS), G.minus.y, 6, -Math.PI / 2, Math.PI / 2); g.fill(); } }
    // 모래시계
    const gl = G.glass; g.strokeStyle = PAL.ink; g.lineWidth = 1.8; g.beginPath(); g.moveTo(gl.x - 10, gl.y - 14); g.lineTo(gl.x + 10, gl.y - 14); g.lineTo(gl.x - 10, gl.y + 14); g.lineTo(gl.x + 10, gl.y + 14); g.closePath(); g.stroke();
    g.fillStyle = PAL.grain; g.beginPath(); g.moveTo(gl.x - 5, gl.y + 12); g.lineTo(gl.x + 5, gl.y + 12); g.lineTo(gl.x, gl.y + 5); g.closePath(); g.fill();
    // 썰매
    let sy = G.sled.y; if (DV.drag && DV.drag.what === 'sled') sy = DV.drag.y;
    DV.anim.forEach((a) => { if (a.kind === 'cross'){ const p = clamp((now - a.t0) / a.life, 0, 1); sy = lerp(a.y, a.ok ? G.iceT - 30 : G.sled.y, a.ok ? easeOut(p) : p < 0.4 ? 0 : (p - 0.4) / 0.6); } });
    this.drawSled(g, G.sled.x, sy);
    DV.anim = DV.anim.filter((a) => {
      const p = clamp((now - a.t0) / a.life, 0, 1);
      if (a.kind === 'crack'){ g.strokeStyle = PAL.ink; g.lineWidth = 1.6; g.globalAlpha = 1 - p * 0.6; for (let i = 0; i < 8; i++){ const ang = i / 8 * TAU; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(a.x + Math.cos(ang) * 50 * Math.min(1, p * 3), a.y + Math.sin(ang) * 22 * Math.min(1, p * 3)); g.stroke(); } g.globalAlpha = 1;
        if (p > 0.2){ g.fillStyle = PAL.sea2; g.globalAlpha = (1 - p) * 0.8; g.beginPath(); g.ellipse(a.x, a.y, 30, 12, 0, 0, TAU); g.fill(); g.globalAlpha = 1; } }
      return p < 1;
    });
    if (DV.drag && DV.drag.what === 'drill') this.drawDrill(g, DV.drag.x, DV.drag.y);
  },
  drawDrill(g, x, y){
    g.strokeStyle = PAL.ink; g.lineWidth = 2.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - 14, y - 22); g.lineTo(x + 14, y - 22); g.moveTo(x, y - 22); g.lineTo(x, y + 12); g.stroke();
    g.lineWidth = 1.4; for (let i = 0; i < 4; i++){ g.beginPath(); g.moveTo(x - 4, y - 6 + i * 5); g.lineTo(x + 4, y - 3 + i * 5); g.stroke(); }
    g.fillStyle = PAL.wood; g.fillRect(x - 16, y - 25, 6, 6); g.fillRect(x + 10, y - 25, 6, 6);
  },
  drawSled(g, x, y){
    g.fillStyle = PAL.shadow; g.beginPath(); g.ellipse(x, y + 12, 40, 8, 0, 0, TAU); g.fill();
    g.fillStyle = PAL.wood; g.fillRect(x - 32, y - 8, 64, 10);
    g.strokeStyle = PAL.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(x - 38, y + 8); g.lineTo(x + 32, y + 8); g.quadraticCurveTo(x + 44, y + 8, x + 40, y - 2); g.stroke();
    g.fillStyle = PAL.grain; g.beginPath(); g.ellipse(x - 12, y - 14, 14, 9, 0, 0, TAU); g.fill(); iconLogs(g, x + 14, y - 14, 9);
  },
  down(L, st, x, y){
    const G = this.geo(L), d = st.data;
    if (Math.hypot(x - G.drill.x, y - G.drill.y) < 30){ DV.drag = { what:'drill', x, y }; return true; }
    if (Math.abs(x - G.sled.x) < 48 && Math.abs(y - G.sled.y) < 34){ DV.drag = { what:'sled', x:G.sled.x, y }; return true; }
    if (Math.hypot(x - G.minus.x, y - G.minus.y) < G.minus.r + 8){ d.wait = Math.max(1, d.wait - 1); SFX.tick(); return true; }
    if (Math.hypot(x - G.plus.x, y - G.plus.y) < G.plus.r + 8){ d.wait = Math.min(12, d.wait + 1); SFX.tick(); return true; }
    if (Math.hypot(x - G.glass.x, y - G.glass.y) < G.glass.r + 10){ S.stats.waits++; nudge('careful', 0.4); devTime(d.wait / 2, { wait:true }); SFX.chime(); return true; }
    return false;
  },
  move(L, st, x, y){ const dr = DV.drag; if (!dr) return; if (dr.what === 'drill'){ dr.x = x; dr.y = y; } else dr.y = clamp(y, this.geo(L).iceT - 30, this.geo(L).sled.y); },
  up(L, st){
    const dr = DV.drag; DV.drag = null; if (!dr) return;
    const G = this.geo(L), d = st.data;
    if (dr.what === 'drill'){
      if (dr.y > G.iceT && dr.y < G.iceB){
        devTime(PR.drillTime * rates().probe); if (!DV.id) return;
        const th = r1(this.th(d, S.day));
        d.probes.push({ day:r2(S.day), th }); if (d.probes.length > 12) d.probes.shift();
        d.core = { x:dr.x, y:G.iceB - 4, th, t:nowMs() };
        S.stats.drills++; probe(st); ghostDone('river'); SFX.drill();
      }
      return;
    }
    if (dr.y > (G.iceT + G.iceB) / 2) return;      // 얼음 가운데를 넘지 않았다 — 도로 둑으로
    const th = this.th(d, S.day), ok = th >= PR.iceNeed;
    commit(st);
    if (ok){
      devAnim('cross', { y:dr.y, ok:true, life:900 }); SFX.good();
      if (!d.eagle && (d.probes.length >= 2) && S.day - this.safeDay(d) <= 0.75 && !S.mw.on) discover('river');
      S.riverCrossed = true;
      setTimeout(() => { if (DV.id === st.id){ closeDevice(); resumeAcross(); } }, 950);
    } else {
      devAnim('cross', { y:dr.y, ok:false, life:1100 }); devAnim('crack', { x:G.sled.x, y:(G.iceT + G.iceB) / 2, life:1300 });
      SFX.crack(); setTimeout(() => SFX.splash(), 200);
      d.fails++; S.res.food = Math.max(0, S.res.food - PR.failFood); S.res.hope = Math.max(0, S.res.hope - 0.8);
      devTime(0.5);
    }
  },

    const tx = X(0.93), ty = Y(Math.min(0.74, seaV(0.93) - 0.1)) - Wr.w * 0.03; for (let k = 0; k < Math.round(30 * p); k++){ const R = mulberry(k), a = R() * TAU, d = R() * Wr.w * 0.022; g.fillStyle = k % 2 ? PAL.blossom : PAL.blossom2; g.beginPath(); g.arc(tx + Math.cos(a) * d, ty + Math.sin(a) * d * 0.7, 3, 0, TAU); g.fill(); }
    for (let k = 0; k < 4; k++){ const q = (now / 4000 + k * 0.25) % 1; drawBird(g, 'swallow', lerp(P.x, P.x + P.w, q), P.y + P.h * (0.25 + 0.1 * Math.sin(q * 9 + k)), 14, PAL.ink); }
  } else if (kind === 'scatter'){ g.fillStyle = `rgba(110,110,116,${0.4 * p})`; g.fillRect(P.x, P.y, P.w, P.h); }
  else { g.fillStyle = `rgba(140,134,126,${0.45 * p})`; g.fillRect(P.x, P.y, P.w, P.h); for (let k = 0; k < 3; k++){ const q = (now / 3000 + k / 3) % 1; drawEagle(g, W / 2 + Math.cos(q * TAU) * W * 0.25, H * 0.35 + Math.sin(q * TAU) * H * 0.1, 40, (Math.sin(now / 260) + 1) / 2, '#4D453E'); } }

/* ---------- 장면 넘기기 ---------- */

}

  const t0 = legendT0;
  startTurn((ga) => drawLegend(ga, nowMs(), t0), (gb, now) => drawWorldScene(gb, now, 16), () => { scene = 'world'; save(true); }, 1000);
}
function resume(){
  const s = unpack(SAVE.cur); if (!s){ SAVE.cur = null; return; }
  sndInit(); resetScene(); paused = false;
  startTurn((ga) => drawCover(ga, nowMs()), (gb, now) => drawWorldScene(gb, now, 16), () => { scene = 'world'; });
}

}
// 끝 장에 붙일 한 장 — 한낮의 빛으로 다시 그린다(밤 · 눈보라 없이)
function snapWorld(){
  const big = document.createElement('canvas'); big.width = CV.width; big.height = CV.height;
  const g = big.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const d0 = S.day; S.day = Math.floor(S.day) + 0.42;
  drawDesk(g); drawPage(g); buildRev(nowMs(), true); g.drawImage(C.rev, Wr.x, Wr.y, Wr.w, Wr.h);
  drawPaths(g, nowMs()); Object.values(S.sites).forEach((st) => { if (st.type === 'river' && !st.placed) return; if (st.found || st.linked) siteToken(g, st, nowMs()); }); drawHome(g, nowMs());
  if (S.over && S.over.kind === 'spring'){ const e0 = endAt; endAt = nowMs() - 3000; drawEnding(g, nowMs()); endAt = e0; }
  S.day = d0;
  const snap = document.createElement('canvas'); snap.width = Math.round(Wr.w * CDPR); snap.height = Math.round(Wr.h * CDPR);
  snap.getContext('2d').drawImage(big, Wr.x * DPR, Wr.y * DPR, Wr.w * DPR, Wr.h * DPR, 0, 0, snap.width, snap.height);

}
function toKeep(){
  const run = SAVE.runs[SAVE.runs.length - 1];
  const snap = snapWorld();
  const meets = run && run.coef ? SAVE.runs.slice(0, -1).slice(-5).reduce((t, r) => t + (r.coef ? meetXs(run.coef, r.coef).length : 0), 0) : 0;
  KEEP = { run, snap, meets };
  startTurn((ga) => ga.drawImage(CV, 0, 0, W, H), (gb, now) => drawKeepsake(gb, now, KEEP.run, KEEP.snap), () => { scene = 'keep'; S = null; save(true); }, 1100);
}
function closeBook(){ startTurn((ga) => drawKeepsake(ga, nowMs(), KEEP.run, KEEP.snap), (gb, now) => drawCover(gb, now), () => { scene = 'cover'; KEEP = null; }); }
onEnd = (kind) => { closeDevice(); if (S) S.nestTok = null; preview = null; PTR = null; endAt = 0; if (kind === 'spring') SFX.chime(); else SFX.wind(); save(true); };

/* ---------- 손 ---------- */
function pt(e){ const r = CV.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hudAction(id){
  if (id === 'pause') setPaused(!paused);
  else if (id === 'speed'){ S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; SFX.tick(); }
  else if (id === 'sound'){ sndSet(!SND.on); SAVE.mute = !SND.on; save(); }
  else if (id === 'full') toggleFull();
  else if (id === 'leave'){ const now = nowMs(); if (S.leaveArm && now - S.leaveArm < 2200){ S.leaveArm = 0; leaveToCover(); } else { S.leaveArm = now; SFX.tick(); } }
}
function siteAt(x, y){ return Object.values(S.sites).find((st) => st.linked && st.type !== 'summit' && (st.type !== 'river' || st.placed) && Math.hypot(X(st.u) - x, Y(st.v) - y) < Math.max(24, su() * 0.03)); }
function tapWorld(x, y){
  const st = siteAt(x, y);
  if (st){ SAVE.seen['g_open_' + st.type] = 1; openDevice(st.id); return; }
  if (Math.hypot(X(HOME.u) - x, Y(HOME.v) - y) < Math.max(28, su() * 0.035)){
    SAVE.seen.g_nest = 1;
    if (S.res.wood >= PR.nestWood && !S.mw.on) S.nestTok = { u:HOME.u + 0.035, v:HOME.v - 0.06 };
    else { S.lastShort = 'wood'; S.lastShortAt = nowMs(); SFX.bad(); }
  }
}
function down(e){
  sndInit();
  const [x, y] = pt(e);
  try { CV.setPointerCapture(e.pointerId); } catch (er){ /* */ }
  if (TURN.on) return;
  if (scene === 'cover'){ const B = coverRect(); if (SAVE.cur && inR(ribbonRect(B), x, y)){ resume(); return; } if (inR(B, x, y)) openBook(); return; }
  if (scene === 'legend'){ if (nowMs() - legendT0 < LEGEND_T){ legendT0 = nowMs() - LEGEND_T; return; } toWorld(); return; }
  if (scene === 'keep'){ closeBook(); return; }
  if (scene !== 'world' || !S || S.over) return;
  const hb = HUDR.find((r) => !r.deco && inR(r, x, y));
  if (hb && !DV.id){ hudAction(hb.id); return; }
  if (DV.id){ deviceDown(x, y); PTR = { mode:'device' }; return; }
  if (S.forming < 1) return;
  if (paused){ setPaused(false); return; }
  if (S.nestTok){ if (Math.hypot(X(S.nestTok.u) - x, Y(S.nestTok.v) - y) < 36){ PTR = { mode:'nest' }; return; } S.nestTok = null; }
  for (const sg of S.signs.slice().reverse()){ const q = signPos(sg, nowMs()); if (Math.hypot(X(q.u) - x, Y(q.v) - y) < 36){ catchSign(sg); return; } }
  for (const w of S.wand){ if ((w.st === 'wait' || w.st === 'come') && Math.hypot(X(w.u) - x, Y(w.v) - su() * 0.007 - y) < 28){ welcome(w); return; } }
  const np = networkPoint(U(x), V(y), Math.max(0.03, 28 / Wr.w));
  PTR = { mode:'pending', x0:x, y0:y, t0:nowMs(), np };
}
function move(e){
  if (!PTR) return;
  const [x, y] = pt(e);
  if (PTR.mode === 'device'){ deviceMove(x, y); return; }
  if (PTR.mode === 'nest'){ S.nestTok = { u:U(x), v:V(y) }; return; }
  if (PTR.mode === 'pending' && Math.hypot(x - PTR.x0, y - PTR.y0) > 9){
    if (PTR.np && !S.walk){ PTR.mode = 'path'; preview = { pts:[PTR.np.pt], from:{ pi:PTR.np.pi, s:PTR.np.s }, est:null, at:0 }; SAVE.seen.g_path = 1; }
    else { if (S.walk) S.walkPing = nowMs(); PTR.mode = 'none'; }
  }
  if (PTR.mode === 'path'){
    const q = { u:clamp(U(x), 0, 1), v:clamp(V(y), 0, 1) }, last = preview.pts[preview.pts.length - 1];
    if (dist(q, last) > 0.008){ preview.pts.push(q); if (nowMs() - preview.at > 90){ preview.at = nowMs(); preview.est = estimateDays(preview.pts); } }
  }
}
function up(e){
  const [x, y] = pt(e), p = PTR; PTR = null;
  if (!p || !S) return;
  if (p.mode === 'device'){ deviceUp(x, y); return; }
  if (p.mode === 'nest'){ if (S.nestTok && buildNest(S.nestTok)) S.nestTok = null; else if (S.nestTok){ S.nestTok = null; SFX.bad(); } return; }
  if (p.mode === 'path'){ const pv = preview; preview = null; if (pv && pv.pts.length >= 2) startPath(pv.pts, pv.from); return; }
  if (p.mode === 'pending' && nowMs() - p.t0 < 600) tapWorld(x, y);
}

/* ---------- 시계 ---------- */
function frame(t){
  const dtMs = clamp(t - (lastFrame || t), 0, 100); lastFrame = t;
  G.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'world' && S){
    if (S.forming < 1){ if (!TURN.on) S.forming = Math.min(1, S.forming + dtMs / 4200); }
    else if (!S.over && !paused && !DV.id && !TURN.on && !document.hidden) tick(dtMs / 1000 / PR.dayLen * S.speed);
    if (S.over && !endAt) endAt = t;
    if (S.over && endAt && t - endAt > 3400 && !TURN.on) toKeep();
    if (!S.over && t - lastSaveAt > 4000){ lastSaveAt = t; save(); }
    sndAmbient(t, S.mw.on ? 'cold' : '');
  }
  try {
    if (TURN.on) drawTurn(G, t);
    else if (scene === 'cover') drawCover(G, t);
    else if (scene === 'legend') drawLegend(G, t, legendT0);
    else if (scene === 'world' && S) drawWorldScene(G, t, dtMs);
    else if (scene === 'keep' && KEEP) drawKeepsake(G, t, KEEP.run, KEEP.snap);
  } catch (err){ if (!frame.err){ frame.err = 1; console.error(err); } }
  $('lobby').hidden = scene !== 'cover' || TURN.on;
  requestAnimationFrame(frame);
}

/* ---------- 저장 · 앱과의 약속 ---------- */
let saveTimer = 0;
function snapshot(){
  if (S && !S.over && (scene === 'world' || TURN.on)) SAVE.cur = pack();
  const out = { v:3, params:SAVE.params, self:SAVE.self, runs:SAVE.runs, cur:SAVE.cur, seen:SAVE.seen, mute:!SND.on };
  let s = JSON.stringify(out);
  if (s.length > 19500){ out.runs = out.runs.slice(-6).map((r) => Object.assign({}, r, { stats:undefined })); s = JSON.stringify(out); }
  if (s.length > 19500 && out.cur){ out.cur = Object.assign({}, out.cur, { reveal:out.cur.reveal.filter((c, i) => i % 2 === 0 || i === out.cur.reveal.length - 1) }); s = JSON.stringify(out); }
  return s;
}
function save(now){
  clearTimeout(saveTimer);
  const go = () => {
    const s = snapshot();
    if (inFrame){ try { window.parent.postMessage({ type:'ash-store-set', key:SAVE_KEY, data:JSON.parse(s) }, '*'); } catch (e){ /* 부모가 없어도 책은 넘어간다 */ } }
    else { try { localStorage.setItem('ashrain.games.' + SAVE_KEY, s); } catch (e){ /* */ } }
  };
  if (now) go(); else saveTimer = setTimeout(go, 800);
}
const OLD_SELF = { jebi:'swallow', olppaemi:'owl', kkachi:'magpie', durumi:'crane', wren:'wren' };
function mergeSave(d){
  if (!d || typeof d !== 'object') return;
  if (d.v === 3){
    const p0 = d.params || {};
    SAVE.params = Object.fromEntries(Object.entries(p0).filter(([k, v]) => k in DEFAULTS && isFinite(Number(v)) && Number(v) !== DEFAULTS[k]).map(([k, v]) => [k, Number(v)]));
    if (d.self) SAVE.self = Object.assign({ A:0, B:0, C:0, name:'wren', center:0 }, d.self);
    SAVE.runs = Array.isArray(d.runs) ? d.runs.slice(-12) : [];
    SAVE.cur = d.cur && d.cur.v === 3 ? d.cur : null;
    SAVE.seen = d.seen || {};
    if (d.mute){ SAVE.mute = true; sndSet(false); }
  } else if (d.v === 1){
    // 예전 겨울(v1 · v2)의 자아와 기록은 이어받는다 — 묻는 방식 ↔ 살펴보기, 결단 ↔ 신중, 기대기 ↔ 맞서기
    if (d.self) SAVE.self = { A:clamp(Number(d.self.A) || 0, -1, 1), B:clamp(Number(d.self.B) || 0, -1, 1), C:clamp(Number(d.self.C) || 0, -1, 1), name:OLD_SELF[d.self.name] || 'wren', center:0 };
    SAVE.runs = (d.runs || []).slice(-12).map((r) => ({ t:r.t, kind:r.kind === 'win' ? 'spring' : r.kind, days:r.days, self:OLD_SELF[r.self] || 'wren', people:0, stars:[], stones:0, coef:r.coef || null, old:true }));
    SAVE.cur = null;
  }
  PR = Object.assign({}, DEFAULTS, SAVE.params);
}
function loadSave(){
  if (inFrame){ try { window.parent.postMessage({ type:'ash-store-get', key:SAVE_KEY }, '*'); } catch (e){ /* */ } }
  else { try { mergeSave(JSON.parse(localStorage.getItem('ashrain.games.' + SAVE_KEY) || 'null')); } catch (e){ /* */ } }
}
function post(m){ if (inFrame) try { window.parent.postMessage(m, '*'); } catch (e){ /* */ } }
function toggleFull(){
  const root = document.documentElement, req = root.requestFullscreen || root.webkitRequestFullscreen, fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (immersive){ immersive = false; post({ type:'ash-immersive', on:false }); return; }
  if (req) Promise.resolve().then(() => req.call(root)).catch(() => { immersive = true; post({ type:'ash-immersive', on:true }); });
  else { immersive = true; post({ type:'ash-immersive', on:true }); }
}
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'ash-theme' && (d.theme === 'light' || d.theme === 'dark')){ document.documentElement.dataset.theme = d.theme; readTheme(); }
  if (d.type === 'ash-store' && d.key === SAVE_KEY){ if (!S) mergeSave(d.data); else if (d.data && d.data.v === 3 && !SAVE.runs.length){ const cur = SAVE.cur; mergeSave(d.data); SAVE.cur = cur; } }
});

/* ---------- 다듬기(강사용) ---------- */
const MEMO = `<p><b>숨은 규칙 — 학생 화면엔 글이 없다. 해 보면서 찾는다.</b></p>
<p><b>숲 · 가지 뽑기</b> — 두 통의 좋은 가지 비율이 다르다(약 0.78과 0.42). 몇 개 뽑아 보면 공책의 셈 막대와 비율 막대로 어느 통이 나은지 어림한다. 편법: 썩은 가지는 끝이 아주 조금 이끼빛이다. 비율이 낮은 통에서 다섯 번 연달아 좋은 가지를 뽑으면 → 별.</p>
<p><b>강 · 얼음 재기</b> — 두께 = 처음 두께 + 하루에 느는 만큼 × 날(일차함수). 두 날 이상 재면 공책에 줄이 그어지고, 썰매 줄(필요한 두께)과 만나는 점이 건너는 날. 그 날로부터 0.75일 안에 건너면 → 별. 너무 일찍 건너면 빠진다(양식 · 희망을 잃음). 한겨울엔 물이 돌처럼 얼어 아무 데서나 건넌다.</p>
<p><b>바다 · 돌림판</b> — 칸의 넓이가 곧 확률. 폭풍 칸은 며칠 주기로 커졌다 작아진다(갈매기가 뭍으로 몰리면 커지는 중). 배를 띄우지 않고 돌리면 시험 — 셈 막대와 원그림이 쌓여 실제 넓이에 다가간다(큰 수의 법칙). 편법: 돌림판은 늘 같은 자리에서 출발하고, 같은 세기로 튕기면 같은 칸에 선다(살살 튕기면 겨눌 수 있다). 잔잔한 칸이 절반보다 작을 때 배를 띄워 세 번 연달아 잔잔하면 → 별.</p>
<p><b>장터 · 머신</b> — 장작이나 곡식 하나를 넣고 손잡이를 당긴다. 첫째 칸은 당길 때마다 한 칸, 둘째 칸은 두 칸씩 돈다(세 번째마다 둘이 맞는다). 셋째 칸은 하루의 때(새벽 · 낮 · 저녁과 밤)를 따른다. 공책 줄(해 · 달 표시 + 그림 셋)에서 규칙을 찾아 세 칸을 맞추면 → 별.</p>
<p><b>둥지 · 바람 그늘</b> — 집을 누르면 둥지가 나온다(땔감 3). 바람이 불어 가는 쪽, 덤불 뒤(눈 꼬리가 생기는 쪽)에 지으면 땔감을 덜 쓴다 — 연기가 곧게 오르는 것이 표시. 그늘 둥지 둘이면 → 별.</p>
<p><b>산 · 기울기</b> — 산을 곧장 오르면 느리고, 비스듬히 돌아 오르면 덜 느리다. 돌아 올라 꼭대기에 닿으면 → 별. 꼭대기에 서면 세상이 넓게 그려진다.</p>
<p><b>살림</b> — 사람은 양식을, 둥지는 땔감을 쓴다. 숲 · 바다에 길이 닿으면 살림이 길을 따라 흘러온다. 해 질 녘 떠돌이가 오면 눌러 맞아들인다(사람이 늘면 거두는 것도 늘지만 먹는 것도 는다). 춥거나 굶으면 희망(등불)이 줄고, 0이면 흩어진다. 겨울 끝(기본 30일)까지 버티면 봄.</p>
<p><b>자아</b> — 살펴보기(재기 · 시험 돌리기 · 갈매기 · 징조) ↔ 해 보기(건너기 · 배 · 당기기 · 길 · 둥지), 해 보기 전에 두 번 이상 살폈나(신중 ↔ 결단), 독수리에 기대나(기대기 ↔ 맞서기). 올빼미(살핌 · 신중) · 까치(살핌 · 결단) · 제비(해 봄 · 결단) · 두루미(해 봄 · 신중) · 굴뚝새(가운데). 이름은 끝 장에만 나온다.</p>
<p><b>독수리</b> — 장치 왼쪽 위 깃털을 누르면 답(실제 비율 · 줄 · 넓이 · 다음 줄)이 바로 보이지만 터전의 덤불 하나가 돌이 되고 그 장치의 별은 받을 수 없다. 며칠마다 아직 닿지 않은 자리를 먼저 굳힌다(거기서는 절반만 나온다). 돌이 여섯이면 독수리의 겨울.</p>
<p><b>징조</b> — 남쪽으로 가는 까마귀 떼(한겨울을 미리 앎 — 땔감 배율이 줄고 책갈피에 푸른 띠), 뭍으로 오는 갈매기(바다 돌림판의 안개가 걷힘), 까치(희망). 둘레의 테가 남은 시간.</p>`;
function openTune(){

    rows.forEach(([k, label]) => { const r = document.createElement('label'); r.className = 'trow' + (PR[k] !== DEFAULTS[k] ? ' chg' : ''); r.innerHTML = `<span>${label}</span><input inputmode="decimal" data-k="${k}" value="${PR[k]}">`; box.appendChild(r); });
  });
  $('tuneMemo').innerHTML = MEMO;
  $('tuneJson').value = JSON.stringify(SAVE.runs.slice(-3), null, 1);
  $('tuneErr').textContent = '';
  $('tuneOv').hidden = false;
}
function applyTune(){
  const p = {};
  $('tuneBody').querySelectorAll('input[data-k]').forEach((i) => { const v = Number(i.value); if (isFinite(v) && v !== DEFAULTS[i.dataset.k]) p[i.dataset.k] = v; });
  SAVE.params = p; PR = Object.assign({}, DEFAULTS, p); save(true); openTune();
}

/* ---------- 시작 ---------- */
CV = $('cv'); G = CV.getContext('2d');
readTheme(); layout();
window.addEventListener('resize', () => { layout(); });
document.addEventListener('fullscreenchange', () => requestAnimationFrame(layout));
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(true); });
CV.addEventListener('pointerdown', down); CV.addEventListener('pointermove', move); CV.addEventListener('pointerup', up); CV.addEventListener('pointercancel', () => { PTR = null; preview = null; });
$('btnFull').onclick = () => toggleFull();
$('btnTune').onclick = () => openTune();
$('tClose').onclick = () => { $('tuneOv').hidden = true; };
$('tApply').onclick = () => applyTune();
$('tReset').onclick = () => { SAVE.params = {}; PR = Object.assign({}, DEFAULTS); save(true); openTune(); };
$('tExport').onclick = () => { $('tuneJson').value = JSON.stringify(SAVE.params); $('tuneJson').select(); };
$('tImport').onclick = () => { try { const o = JSON.parse($('tuneJson').value); if (!o || typeof o !== 'object' || Array.isArray(o)) throw 0; Object.entries(o).forEach(([k, v]) => { if (k in DEFAULTS && isFinite(Number(v))) SAVE.params[k] = Number(v); }); PR = Object.assign({}, DEFAULTS, SAVE.params); save(true); openTune(); } catch (e){ $('tuneErr').textContent = 'JSON으로 넣어 주세요 — 예: {"dayLen": 12}'; } };
$('tuneOv').addEventListener('pointerdown', (e) => { if (e.target === $('tuneOv')) $('tuneOv').hidden = true; });
loadSave();
// 표지 글씨는 글꼴이 오면 다시 찍는다
try { if (document.fonts){ document.fonts.ready.then(() => { C.coverKey = ''; }); document.fonts.addEventListener('loadingdone', () => { C.coverKey = ''; }); } } catch (e){ /* */ }
requestAnimationFrame(frame);

/* ---------- 시험 갈고리 — 스모크 테스트가 쓴다(학생 화면과 상관없음) ---------- */
window.__gulttuksae = () => {
  const out = { v:3, scene, turning:TURN.on, keepMeets:KEEP ? KEEP.meets : null, paused, theme:document.documentElement.dataset.theme, mute:!SND.on, runs:SAVE.runs.length, cur:!!SAVE.cur, self:Object.assign({}, SAVE.self), params:Object.assign({}, PR), hud:HUDR.map((h) => h.id) };
  if (!S) return out;
  return Object.assign(out, { day:r2(S.day), tod:TOD(S.day), speed:S.speed, forming:S.forming, over:S.over, res:{ wood:r2(S.res.wood), food:r2(S.res.food), hope:r2(S.res.hope) }, people:S.people,
    nests:S.nests.length, lee:S.nests.filter((n) => !n.home && n.lee).length, stones:S.stones.length, stars:Object.keys(S.stars), paths:S.paths.length, walking:!!S.walk, blocked:!!S.blocked, riverCrossed:S.riverCrossed,
    reveal:S.reveal.length, signs:S.signs.length, wand:S.wand.map((w) => w.st), flows:S.flows.length, fx:FX.map((f) => f.kind), dev:DV.id, nestTok:!!S.nestTok, mw:Object.assign({}, S.mw),
    sites:Object.fromEntries(Object.entries(S.sites).map(([k, v]) => [k, { found:v.found, linked:v.linked, stone:v.stone, placed:v.placed }])), stats:Object.assign({}, S.stats) });
};
function devSt(){ const st = devSite(); if (!st) throw new Error('장치가 열려 있지 않다'); return st; }
window.__gtDebug = {
  open(){ if (scene === 'cover') openBook(); }, skip(){ TURN.on = false; legendT0 = nowMs() - LEGEND_T; if (scene !== 'world'){ newSeason(); S.forming = 1; resetScene(); scene = 'world'; } else S.forming = 1; },
  px(u, v){ return { x:Math.round(X(u)), y:Math.round(Y(v)) }; }, homePx(){ return { x:Math.round(X(HOME.u)), y:Math.round(Y(HOME.v)) }; },
  sitePx(id){ const st = S.sites[id]; return { x:Math.round(X(st.u)), y:Math.round(Y(st.v)) }; }, site(id){ const st = S.sites[id]; return { u:st.u, v:st.v, type:st.type, data:st.data }; },
  hudPx(id){ const h = HUDR.find((r) => r.id === id); return h ? { x:Math.round(h.x + h.w / 2), y:Math.round(h.y + h.h / 2) } : null; },
  drawTo(id){ const st = S.sites[id], np = networkPoint(HOME.u, HOME.v, 0.05); return !!startPath([np.pt, { u:(np.pt.u + st.u) / 2, v:(np.pt.v + st.v) / 2 }, { u:st.u, v:st.v }], { pi:np.pi, s:np.s }); },
  drawPts(arr){ const np = networkPoint(arr[0][0], arr[0][1], 0.05); if (!np) return false; return !!startPath([np.pt].concat(arr.slice(1).map(([u, v]) => ({ u, v }))), { pi:np.pi, s:np.s }); },
  arrive(){ let g = 0; while (S.walk && g++ < 4000) tick(0.02); return !S.walk; },
  jump(d){ const n = Math.max(1, Math.ceil(d / 0.02)); for (let i = 0; i < n && S && !S.over; i++) tick(d / n); },
  setDay(d){ S.day = d; }, setRes(k, v){ S.res[k] = v; }, setPeople(n){ S.people = n; }, setSelf(A, B, C){ Object.assign(SAVE.self, { A, B, C }); updateName(); return SAVE.self.name; },
  dev(id){ return openDevice(id); }, close(){ closeDevice(); },
  pull(ci, good){ const st = devSt(), cup = st.data.cups[ci], i = cup.sticks.findIndex((s) => s.good === good); if (i < 0) return null; const L = devLayout(), c = DEV_FOREST.geo(L)[ci], p = DEV_FOREST.stickPose(c, i, cup.sticks.length); DV.drag = { ci, i, off:c.Ls * 0.8, p, c }; DEV_FOREST.up(L, st); return true; },
  cups(){ return devSt().data.cups.map((c) => ({ ratio:c.ratio, n:c.sticks.length, good:c.sticks.filter((s) => s.good).length, streak:c.streak, log:c.log.length })); },
  drill(){ const st = devSt(), L = devLayout(), G0 = DEV_RIVER.geo(L); DV.drag = { what:'drill', x:L.A.x + L.A.w * 0.5, y:(G0.iceT + G0.iceB) / 2 }; DEV_RIVER.up(L, st); return st.data.probes.length; },
  wait(n){ const st = devSt(); st.data.wait = n; const L = devLayout(), g0 = DEV_RIVER.geo(L).glass; DEV_RIVER.down(L, st, g0.x, g0.y); },
  cross(){ const st = devSt(), L = devLayout(), G0 = DEV_RIVER.geo(L); DV.drag = { what:'sled', x:G0.sled.x, y:G0.iceT - 10 }; DEV_RIVER.up(L, st); return S.riverCrossed; },
  ice(){ const st = S.sites.ford; DEV_RIVER.init(st); return { th:DEV_RIVER.th(st.data, S.day), safe:DEV_RIVER.safeDay(st.data), need:PR.iceNeed }; },
  gull(){ const st = devSt(), L = devLayout(), g0 = DEV_SHORE.geo(L).gulls; DEV_SHORE.down(L, st, g0.x + 30, g0.y); return st.data.fog; },
  launch(){ const st = devSt(); if (S.day < st.data.broken) return false; st.data.boat = 1; return true; },
  flick(w){ const st = devSt(); DEV_SHORE.spin(st, w); st.data.spin.t0 = -1e9; DEV_SHORE.finish(st); return st.data.result.k; },
  wheel(){ const st = devSt(); return { sec:DEV_SHORE.sec(), tally:st.data.tally, fog:st.data.fog, streak:st.data.streak, boat:st.data.boat }; },
  landing(w){ const tot = w * w / (2 * PR.wheelDecel); return DEV_SHORE.sectorAt(-tot); },
  pay(kind){ const st = devSt(); if (st.data.paid) return false; st.data.paid = kind; if (kind === 'log') S.res.wood -= 1; else S.res.food -= 1; return true; },
  lever(){ const st = devSt(), L = devLayout(); DV.drag = { what:'lever', k:1 }; DEV_VILLAGE.up(L, st); if (st.data.reels && !st.data.reels.done) DEV_VILLAGE.settle(st); return st.data.ledger.slice(-1)[0]; },
  slot(){ const st = devSt(); return { n:st.data.n, perm:st.data.perm, pm:st.data.pm, phase:DEV_VILLAGE.phase(), next:DEV_VILLAGE.result(st.data, st.data.n, DEV_VILLAGE.phase()), jack:st.data.jack }; },
  eagle(){ const st = devSt(), L = devLayout(); return deviceDown(L.feather.x + 10, L.feather.y + 10); },
  nest(u, v){ return buildNest({ u, v }); }, leeSpot(){ const ok = (p) => nestSpotOk(p) && leeOf(p); for (let i = 0; i < 6000; i++){ const a = Math.random() * TAU, d = 0.04 + Math.random() * 0.12, p = { u:HOME.u + Math.cos(a) * d, v:HOME.v + Math.sin(a) * d * WA }; if (ok(p) && [[0.006, 0], [-0.006, 0], [0, 0.008], [0, -0.008]].every(([du, dv]) => ok({ u:p.u + du, v:p.v + dv }))) return p; } return null; },
  openSpot(){ for (let i = 0; i < 4000; i++){ const a = Math.random() * TAU, d = 0.04 + Math.random() * 0.12, p = { u:HOME.u + Math.cos(a) * d, v:HOME.v + Math.sin(a) * d * WA }; if (nestSpotOk(p) && !leeOf(p)) return p; } return null; },
  wanderer(){ spawnWanderer(); const w = S.wand[S.wand.length - 1]; w.u = HOME.u + 0.08; w.v = HOME.v; w.st = 'wait'; w.until = S.day + 1; return { x:Math.round(X(w.u)), y:Math.round(Y(w.v)) }; },
  spawnSign(k){ spawnSign(k); const sg = S.signs[S.signs.length - 1], q = signPos(sg, nowMs()); return { x:Math.round(X(q.u)), y:Math.round(Y(q.v)) }; },
  signPx(){ const sg = S.signs[S.signs.length - 1]; if (!sg) return null; const q = signPos(sg, nowMs()); return { x:Math.round(X(q.u)), y:Math.round(Y(q.v)) }; },
  forceMw(){ S.mw.start = S.day + 0.01; }, ribbonPx(){ const r = ribbonRect(coverRect()); return { x:Math.round(r.x + r.w / 2), y:Math.round(r.y + r.h / 2) }; }, end(kind){ endSeason(kind || 'spring'); },
  lum(x0, y0, x1, y1){ const d = DPR, w = Math.max(1, Math.round((x1 - x0) * d)), h = Math.max(1, Math.round((y1 - y0) * d)), px = G.getImageData(Math.round(x0 * d), Math.round(y0 * d), w, h).data; let t = 0, n = 0; for (let i = 0; i < px.length; i += 16){ t += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++; } return n ? t / n : 0; },
  state(){ return S; }, save(){ save(true); return snapshot().length; }, layout(){ return { W, H, P:Object.assign({}, P), Wr:Object.assign({}, Wr) }; },
};

})();
