<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굴뚝새</title>
<!--
  굴뚝새(가제) — 질문으로 건너는 겨울 · 1막 스페이스(베타). 한 장짜리 HTML, 바깥 의존은 구글 폰트뿐.
  앱에서는 시록고(강사앱) #/games(src/apps/seirocco/pages/Games.jsx)가 샌드박스 iframe 으로 띄운다.
  · 테마: <html data-theme> + postMessage({ type: "ash-theme" }) · 전체 화면: Fullscreen API, 막히면 { type: "ash-immersive", on }
  · 저장: 샌드박스라 localStorage 를 못 쓰면 부모에게 { type: "ash-store-get" | "ash-store-set", key: "gulttuksae", data } 로 맡긴다(20KB 까지).
  · window.__gulttuksae() — 스모크 테스트가 읽는 상태 요약, window.__gtDebug — 시험용 갈고리.
  핵심 루프: 조우 → 근거(날것 · 정리 · 해설 · 방대 — 친절할수록 시간이 든다) → 질문(렌즈 × 형식) → 문항(값은 직접 입력)
           → 정답은 길 · 오답은 날씨 → 결정(근거의 질 = 성공률) → 스페이스가 뻗어 나감.
  시계는 멈추지 않는다(하루 = 1턴, 실시간 · 배속). 일시정지하면 근거 · 문항이 가려진다. 흐른 시간은 소모(식량 · 연료)와 진행(사건)으로 센다.
  자아: 플레이로 쌓이는 축 — 묻는 방식(어떻게 ↔ 왜) · 근거 태도(결단 ↔ 신중) · AI와의 거리(기대기 ↔ 맞서기) · 렌즈 성향.
        앞의 두 축으로 제비 · 올빼미 · 까치 · 두루미 · 굴뚝새(가운데). 효과의 세기는 축 값에 비례, 질문 값의 종류는 자아 이름을 따른다.
  설계 문서: 프로젝트 claude/굴뚝새.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@700&display=swap">
<style>
/* 색: 낮은 눈벌판(밝게) · 겨울밤(어둡게). 얼음 파랑 = 주 강조, 금빛 = 길 · 정성, 산호 = 날씨 · 위험. 이야기 글씨는 명조. */
:root{
  --bg:#F2F0EA; --surface:#FBFAF6; --field:#EEF1F2; --ink:#1F2B33; --muted:#66737C; --line:#D5D9D8;
  --accent:#2C6A8A; --accent-ink:#F4FAFD; --accent-soft:#DCEBF2;
  --gold:#A87A1F; --gold-soft:#F3E7C8; --risk:#B9472F; --risk-soft:#F6DDD5; --good:#2E7A55; --good-soft:#DCEFE3;
  --eagle:#6B6258; --scrim:rgba(20,28,34,.55); --snow:#FFFFFF; --grid:rgba(31,43,51,.07);
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-story:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hud-h:60px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --field:#141C24; --ink:#E4EBEF; --muted:#93A2AC; --line:#2B3844;
  --accent:#7DB6D3; --accent-ink:#0B1A22; --accent-soft:#1D3442;
  --gold:#E0B456; --gold-soft:#3A3020; --risk:#E2795E; --risk-soft:#3C2620; --good:#6FC296; --good-soft:#1D3328;
  --eagle:#B3A99C; --scrim:rgba(0,0,0,.6); --snow:#1B2530; --grid:rgba(228,235,239,.06); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-text-size-adjust:100%}
body{overflow:hidden}
button{font-family:inherit;color:inherit}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.screen{flex:1 1 auto;min-height:0}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:14.5px;font-weight:600;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.xs{min-height:30px;padding:0 8px;font-size:12.5px;border-radius:7px;font-weight:600}
.btn.eagle{color:var(--eagle);border-style:dashed}
.btn.risk{color:var(--risk);border-color:var(--risk)}
.btn.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.miss{background:var(--risk-soft);border-color:transparent;color:var(--risk)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{min-height:32px;padding:0 9px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)} .chip.risk{background:var(--risk-soft);color:var(--risk)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.mute{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* 시작 화면 */
#lobby{overflow:auto;padding:22px 20px 40px}
.lb-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;max-width:1100px;margin:0 auto 18px}
.lb-title{flex:1 1 320px}
.lb-title h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;letter-spacing:.02em}
.lb-title p{margin:4px 0 0;color:var(--muted);font-size:15px}
.beta{font-size:11px;font-weight:800;color:#fff;background:#7C3AED;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.lb-acts{display:flex;gap:8px;flex-wrap:wrap}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.lb-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.lb-card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 10px}
.lv-desc{font-size:13.5px;color:var(--muted);line-height:1.65;margin:10px 0 14px;min-height:44px}
.lb-btns{display:flex;gap:8px;flex-wrap:wrap}
.lb-story{font-family:var(--f-story);font-size:14.5px;line-height:1.85;color:var(--muted);margin:0 0 12px}
.run{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.run:first-child{border-top:0}
.run b{font-weight:700}
.run .rmeta{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}

/* 자아 카드 */
.self{display:flex;gap:14px;align-items:center}
.selfmap{flex:none}
.selfname{font-family:var(--f-display);font-size:26px;line-height:1.1}
.selfdesc{font-size:13px;color:var(--muted);line-height:1.6;margin:4px 0 0}
.axes{display:grid;gap:6px;margin-top:12px}
.axis{display:grid;grid-template-columns:62px 1fr 62px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.axis span:last-child{text-align:right}
.axis .bar{position:relative;height:8px;border-radius:99px;background:var(--field);border:1px solid var(--line)}
.axis .bar i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent)}
.feathers{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.eff{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 0;padding-left:16px}
.eff li{margin:1px 0}

/* 게임 화면 */
#game{display:flex;flex-direction:column;position:relative}
.hud{flex:none;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.hud-day{display:flex;align-items:baseline;gap:4px;min-width:128px;flex-wrap:wrap}
.hud-day b{font-family:var(--f-display);font-weight:400;font-size:22px}
.hud-day span{color:var(--muted);font-size:12.5px}
.daybar{flex-basis:100%;height:4px;border-radius:9px;background:var(--field);overflow:hidden;margin-top:3px}
.daybar i{display:block;height:100%;width:0;background:var(--accent)}
.hud-res{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.res{display:flex;flex-direction:column;gap:2px;min-width:54px}
.res .rl{font-size:11px;color:var(--muted);font-weight:700}
.res .rv{font-family:var(--f-mono);font-size:15px;font-weight:600}
.res .rv.low{color:var(--risk)}
.res .rb{height:3px;border-radius:9px;background:var(--field);overflow:hidden}
.res .rb i{display:block;height:100%;background:var(--gold)}
.res.u .rb i{background:var(--eagle)}
.hud-self{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.hud-self .dot{width:10px;height:10px;border-radius:50%}
.hud-alert{display:flex;gap:6px;flex-wrap:wrap}
.hud-ctl{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stage{flex:1 1 auto;min-height:0;display:flex}
.mapwrap{flex:1 1 auto;min-width:0;position:relative;background:var(--field)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{flex:none;width:clamp(330px,36vw,440px);border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 14px 40px;-webkit-overflow-scrolling:touch}
@media (max-width:820px),(max-aspect-ratio:1/1){
  .toasts{right:14px}
  .stage{flex-direction:column}
  .mapwrap{flex:0 0 40%;min-height:220px}
  .panel{width:auto;flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
}
.maptoast{position:absolute;left:12px;bottom:12px;max-width:min(420px,80%);font-size:13px;line-height:1.5;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);opacity:0;transition:opacity .3s;pointer-events:none}
.maptoast.on{opacity:1}
.winter .mapwrap{filter:saturate(.25) brightness(1.03)}

/* 패널 */
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.ph h2{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0}
.sit{font-family:var(--f-story);font-size:14.5px;line-height:1.8;margin:4px 0 10px}
.clockchip{font-size:12.5px;line-height:1.55;padding:8px 10px;border-radius:10px;background:var(--field);border:1px solid var(--line);margin:0 0 12px}
.clockchip b{color:var(--accent)}
.clockchip.urgent b{color:var(--risk)}
.sec{margin:16px 0 0}
.sec > h3{font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;font-weight:800}
.lens{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:0 0 8px;background:var(--bg)}
.lens-top{display:flex;align-items:center;gap:6px;margin:0 0 6px}
.lens-top b{font-size:14.5px}
.lens-top .q{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lvchip{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.lvchip.l1{color:var(--accent);border-color:var(--accent)} .lvchip.l2{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvchip.l3{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ev{font-size:13.5px;line-height:1.65;margin:0 0 8px;white-space:pre-line}
.ev.raw{font-family:var(--f-mono);font-size:13px}
.ev table{border-collapse:collapse;font-family:var(--f-mono);font-size:12.5px;margin:2px 0}
.ev td{border:1px solid var(--line);padding:2px 7px;text-align:center}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.prog{height:5px;border-radius:9px;background:var(--field);overflow:hidden;margin:6px 0 0}
.prog i{display:block;height:100%;background:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:6px 0 0}
.opt{border:1px solid var(--line);border-radius:12px;padding:11px;margin:0 0 8px}
.opt-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.opt-top b{font-size:15px}
.est{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.estbar{position:relative;height:8px;border-radius:9px;background:var(--field);margin:7px 0;border:1px solid var(--line)}
.estbar i{position:absolute;top:0;bottom:0;border-radius:9px;background:var(--accent);opacity:.8}
.oeff{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 8px}
.route{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:0 0 8px;cursor:pointer;background:var(--bg);width:100%;text-align:left;font-size:14px}
.route:hover{border-color:var(--accent)}
.route .ri{font-size:22px;width:30px;text-align:center}
.route .rm{flex:1;min-width:0}
.route .rm small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.route .rd{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.wx{display:flex;gap:8px;align-items:center;border:1px dashed var(--risk);border-radius:10px;padding:8px 10px;margin:0 0 6px;font-size:13px}
.wx span{flex:1}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin:0 0 8px;background:var(--bg)}
.card b{font-size:14px}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.card.on{border-color:var(--gold)}
.card .acts{margin-top:8px}
.travel{font-size:14px;line-height:1.7}
.big{font-family:var(--f-display);font-size:30px;line-height:1.1}

/* 겹창 */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.ov.inner{position:absolute;inset:var(--hud-h) 0 0 0;z-index:20}
.dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;width:min(560px,100%);max-height:100%;overflow:auto}
.dialog.wide{width:min(880px,100%)}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px}
.dialog .sub{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.pq{font-size:17px;line-height:1.7;margin:4px 0 12px;font-weight:600}
.hint{font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:0 0 12px}
.ins{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.ins label{font-family:var(--f-mono);font-size:15px;font-weight:600}
.ins input{height:46px;width:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:19px;padding:0 12px}
.ins input:focus{outline:2px solid var(--accent);outline-offset:1px}
.choices{display:grid;gap:7px;margin:0 0 8px}
.choices button{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14.5px;cursor:pointer;line-height:1.45}
.choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choices button.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.err{color:var(--risk);font-size:13px;min-height:18px;margin:2px 0 6px}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.fb{border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:14px;line-height:1.65}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.ng{background:var(--risk-soft);color:var(--risk)}
.fb small{display:block;color:var(--ink);opacity:.8;font-size:13px;margin-top:4px}
.pclock{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.cover{position:absolute;inset:var(--hud-h) 0 0 0;z-index:25;display:grid;place-items:center;background:var(--bg);text-align:center;padding:20px}
.cover .big{margin-bottom:8px}
.cover p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 14px}
.banner{position:absolute;inset:var(--hud-h) 0 0 0;z-index:24;display:grid;place-items:center;pointer-events:none;background:rgba(220,230,236,.35)}
:root[data-theme="dark"] .banner{background:rgba(10,14,18,.45)}
.banner div{text-align:center;padding:18px 22px;border-radius:16px;background:var(--surface);border:1px solid var(--line);max-width:min(560px,90%)}
.banner .bt{font-family:var(--f-story);font-size:20px;line-height:1.6}
.banner .bs{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.toasts{position:fixed;right:calc(clamp(330px,36vw,440px) + 14px);top:calc(var(--hud-h) + 10px);z-index:28;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{max-width:min(360px,86vw);font-size:13.5px;line-height:1.5;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.12);animation:tin .25s ease-out}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--risk)} .toast.gold{border-color:var(--gold)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* 결산 */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sumbox{border:1px solid var(--line);border-radius:12px;padding:12px}
.sumbox h3{font-size:13px;color:var(--muted);margin:0 0 6px}
.journal{font-family:var(--f-story);font-size:14.5px;line-height:1.9;margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
#spaceCv{width:100%;height:220px;display:block;border-radius:10px;background:var(--field)}
textarea.io{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}

/* 다듬기 패널 */
.tune{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.tgrp{border:1px solid var(--line);border-radius:12px;padding:10px}
.tgrp h3{font-size:13px;margin:0 0 6px;color:var(--accent)}
.trow{display:grid;grid-template-columns:1fr 92px;gap:6px;align-items:center;font-size:12.5px;margin:4px 0}
.trow input{height:32px;width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:13px;padding:0 6px}

/* ---------- 작은 도구 ---------- */
function mulberry(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pickR = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];
function shuffleR(r, arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmtN(x){
  if (!isFinite(x)) return '?';
  const v = Math.round(x * 100) / 100;
  const s = String(Math.abs(v));
  return (v < 0 ? '−' : '') + s;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// 문항 만들기
function num(prompt, ans, hint, explain){ return { kind:'num', prompt, ans, hint, explain }; }
function pair(prompt, a, b, hint, explain){ return { kind:'pair', prompt, a, b, hint, explain }; }
function ch(prompt, right, wrongs, hint, explain){ return { kind:'choice', prompt, right, wrongs, hint, explain }; }

let SAVE = { v:1, level:'ace', params:{}, self:{ A:0, B:0, C:0, lens:{}, name:'wren', centerDays:0 }, runs:[], cur:null, seen:{} };
let S = null;            // 지금 겨울

const SELF = () => SAVE.self;
const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;

/* ---------- 자아 ---------- */
function selfW(){
  const s = SELF(), a = (s.A + 1) / 2, b = (s.B + 1) / 2;
  return { jebi:(1 - a) * (1 - b), durumi:(1 - a) * b, kkachi:a * (1 - b), olppaemi:a * b };
}
// 사분면의 세기 σ: 가운데 0, 모서리 1(× 효과 세기 k)
function sig(q){
  const w = selfW()[q];
  let v = clamp((w - 0.25) / 0.75, 0, 1);
  if (S && S.enc && S.enc.borrowed === q) v = Math.max(v, 1);
  return v * PR.selfK;
}
function sigRaw(q){ return clamp((selfW()[q] - 0.25) / 0.75, 0, 1); }
function updateName(){
  const s = SELF();
  const best = QUADS.reduce((m, q) => (sigRaw(q) > sigRaw(m) ? q : m), QUADS[0]);
  if (s.name === 'wren'){ if (sigRaw(best) >= PR.selfEnter) s.name = best; }
  else if (sigRaw(s.name) < PR.selfExit) s.name = sigRaw(best) >= PR.selfEnter ? best : 'wren';
}
function nudge(axis, target, alpha){
  const s = SELF();
  s[axis] = clamp(s[axis] + alpha * (target - s[axis]), -1, 1);
  const before = s.name; updateName();
  if (s.name !== before && S){
    S.stats.selfChanges.push({ d:r1(S.day), from:before, to:s.name });
    toast(`자아가 바뀌었다 — ${SELVES[before].name} → ${SELVES[s.name].name}. ${SELVES[s.name].who}.`, 'gold');
  }
  dirty.hud = dirty.panel = true;
}
function useLens(L, n = 1){ const s = SELF(); s.lens[L] = (s.lens[L] || 0) + n; }
function lensShare(L){
  const s = SELF(), tot = LENS_IDS.reduce((t, k) => t + (s.lens[k] || 0), 0);
  return tot ? (s.lens[L] || 0) / tot : 0;
}
function topLens(){ return LENS_IDS.reduce((m, k) => (lensShare(k) > lensShare(m) ? k : m), LENS_IDS[0]); }
function aiPrefix(){ const c = SELF().C; return c <= -0.3 ? '독수리 등의 ' : c >= 0.3 ? '홀로 나는 ' : ''; }
function selfLabel(){ return aiPrefix() + SELVES[SELF().name].name; }
function penScale(){ return SELF().name === 'wren' ? 0.5 : 1; }
function hasSig(q){ return sigRaw(q) >= 0.6 || (S && S.enc && S.enc.borrowed === q); }

/* ---------- 지도 ---------- */
function makeMap(){
  const cols = [], nodes = {}; let id = 0;
  const mk = (col, row, n, type) => { const k = 'n' + (id++); nodes[k] = { id:k, col, row, n, type, fossil:false, visited:false, known:false, next:[], jy:(R() - 0.5) * 0.08 }; return k; };
  cols.push([mk(0, 0, 1, 'start')]);
  let types;
  for (let tries = 0; tries < 40; tries++){
    types = [];
    for (let c = 1; c <= 5; c++){
      const n = R() < 0.55 ? 3 : 2, pool = shuffleR(R, ENC_TYPES).slice(0, n);
      types.push(pool);
    }
    const flat = types.flat();
    if (flat.includes('mount') && flat.includes('sea') && flat.includes('village')) break;
  }
  types.forEach((pool, i) => cols.push(pool.map((t, row) => mk(i + 1, row, pool.length, t))));
  cols.push([mk(6, 0, 1, 'goal')]);
  const edges = [];
  for (let c = 0; c < cols.length - 1; c++){
    const A = cols[c], B = cols[c + 1];
    const link = (a, b) => { if (!nodes[a].next.includes(b)){ nodes[a].next.push(b); edges.push({ a, b, days:B.length === 1 && c + 1 === 6 ? 2 : (R() < 0.5 ? 2 : 3) }); } };
    if (A.length === 1 || B.length === 1) A.forEach((a) => B.forEach((b) => link(a, b)));
    else {
      A.forEach((a, i) => {
        const pos = (i + 0.5) / A.length * B.length - 0.5;
        const j = Math.round(pos); link(a, B[clamp(j, 0, B.length - 1)]);
        const j2 = pos > j ? j + 1 : j - 1; if (R() < 0.7) link(a, B[clamp(j2, 0, B.length - 1)]);
      });
      B.forEach((b) => { if (!A.some((a) => nodes[a].next.includes(b))){ let best = A[0], bd = 9; A.forEach((a, i) => { const d = Math.abs((i + 0.5) / A.length - (B.indexOf(b) + 0.5) / B.length); if (d < bd){ bd = d; best = a; } }); link(best, b); } });
    }
  }
  return { cols, nodes, edges };
}
const node = (k) => S.map.nodes[k];
const edgeOf = (a, b) => S.map.edges.find((e) => e.a === a && e.b === b);
function revealFrom(k){ node(k).known = true; node(k).next.forEach((n) => { node(n).known = true; }); }

/* ---------- 조우 ---------- */
function makeStart(){
  // 날것의 데이터와 문제 조각 셋 — 서로 다른 렌즈 · 형식으로
  const lensesPick = shuffleR(R, LENS_IDS).slice(0, 3), forms = shuffleR(R, ['what', 'how', 'why']);
  const pieces = lensesPick.map((L, i) => {
    const types = ENC_TYPES.filter((t) => ENC[t].lenses.includes(L));
    const type = pickR(R, types);
    return { type, lens:L, form:forms[i], P:ENC[type].params(R), done:null };
  });
  return { type:'start', P:{}, arrived:S.day, lenses:{}, pieces, seed:Math.floor(R() * 1e6) };
}
function makeEnc(k){
  const n = node(k), def = ENC[n.type], lv = LEVELS[S.level];
  const E = { type:n.type, node:k, P:def.params(R), arrived:S.day, lenses:{}, usedAI:false, ups:0, freeUp:false, turn:false, borrowed:null, extraDone:false, seed:Math.floor(R() * 1e6), fossil:n.fossil };
  def.lenses.forEach((L) => {
    const st = { E:lv.startE, I:0, up:null, asked:{}, ai:false };
    if (hasRoad(n.type, L)){ st.E = Math.max(st.E, 1); st.I += 1; st.asked.what = 'road'; }
    if (S.known[n.type] && S.known[n.type][L]) st.E = Math.max(st.E, 2);
    E.lenses[L] = st;
  });
  const bump = (why) => { const Ls = def.lenses.filter((L) => E.lenses[L].E < 3); if (Ls.length){ const L = pickR(R, Ls); E.lenses[L].E++; toast(`${why} — ${LENS[L].name} 근거가 한 단계 친절해졌다.`, 'gold'); } };
  while (S.newsBonus > 0){ S.newsBonus--; bump('마을에서 들은 소식'); }
  while (S.omenBonus > 0){ S.omenBonus--; bump('길조'); }
  if (n.type === 'sea'){ E.stormAt = S.day + E.P.k + 0.15; E.stormKnown = S.stormWarned; S.stormWarned = false; }
  if (n.type === 'forest') E.duskAt = S.day + 1.5;
  if (hasSig('kkachi')) spawnSign('good');
  return E;
}
function hasRoad(type, L){ return S.roads.some((r) => r.type === type && r.lens === L); }
function wxOn(type){ return S.weathers.filter((w) => w.type === type); }
function lensQ(L){
  const st = S.enc && S.enc.lenses[L]; if (!st) return 0;
  let q = Math.min(4, st.E + st.I) / 4;
  if (st.E === 0) q += 0.25 * sig('kkachi');
  return clamp(q, 0, 1);
}
function deadlineLeft(){
  const E = S.enc; if (!E || S.mode !== 'enc') return Infinity;
  if (E.type === 'sea' && S.day < E.stormAt) return E.stormAt - S.day;
  if (E.type === 'forest' && S.day < E.duskAt) return E.duskAt - S.day;
  return Infinity;
}
function weatherPen(type){
  const k = 1 + 0.5 * sig('kkachi') * penScale();
  return wxOn(type).reduce((t, w) => t + PR.wxPen * w.str * k, 0);
}
function hash01(n){ let x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }
function optCalc(opt){
  const E = S.enc;
  let p = opt.base(E, S), qs = 0, n = 0;
  const ws = Object.entries(opt.w || {});
  ws.forEach(([L, w]) => { const q = lensQ(L); p += w * q; qs += q; n++; });
  if (n){
    p -= weatherPen(E.type);
    const dl = deadlineLeft();
    if (S.day - E.arrived <= 0.5 || (dl <= 1 && dl > 0)) p += 0.10 * sig('jebi');
    if (E.turn) p += 0.15;
  }
  p = clamp(p, 0.03, 0.97);
  if (opt.base(E, S) >= 1 && !n) p = 1;
  const avgQ = n ? qs / n : 1;
  const spread = n ? 0.04 + 0.3 * (1 - avgQ) : 0;
  const j = (hash01(E.seed + opt.id.length * 31 + Math.round(qs * 100)) - 0.5) * spread;
  return { p, lo:clamp(p - spread + j, 0, 1), hi:clamp(p + spread + j, 0, 1), avgQ, n };
}

/* ---------- 값 ---------- */
function qCost(form, L, type){
  let base = PR['q' + form[0].toUpperCase() + form.slice(1)];
  if (form === 'why') base *= 1 - 0.5 * sig('olppaemi');
  base *= 1 - 0.25 * lensShare('math');
  if (S.polya.open.includes('similar') && hasRoad(type, L)) base *= 0.5;
  const nm = SELF().name;
  if (nm === 'jebi') return { cur:'food', amt:r1(base * 1.5) };
  if (nm === 'kkachi') return { cur:'morale', amt:r1(base * 0.4) };
  if (nm === 'durumi') return { cur:'days', amt:r2(Math.max(0.15, base * 0.5)) };
  return { cur:'jeong', amt:r1(base) };
}
function upCost(next){
  const days = PR['upDays' + next] * (1 - 0.3 * sig('olppaemi')) * (1 + 0.5 * sig('durumi'));
  return { jeong:r1(PR.upJeong * (1 - Math.min(1, sig('durumi')))), days:r2(days) };
}
const CUR = { jeong:'정성', food:'식량', morale:'사기', fuel:'연료', days:'일' };
function costText(c){ return c.cur === 'days' ? `${fmtN(c.amt)}일` : `${CUR[c.cur]} ${fmtN(c.amt)}`; }
function canPay(c){ return c.cur === 'days' ? true : S.res[c.cur] >= c.amt - 1e-9; }
function pay(c){ if (c.cur !== 'days') S.res[c.cur] = Math.max(0, S.res[c.cur] - c.amt); }

/* ---------- 행동: 다듬기 · 질문 · 독수리 · 결정 ---------- */
function busyNow(){ return !!PB || !!S.prep || S.mode !== 'enc' || S.winter.on; }
function upRunning(){ return Object.values(S.enc.lenses).filter((st) => st.up).length; }
function canUp(L){
  const st = S.enc.lenses[L];
  if (!st || st.E >= 3 || st.up || st.ai || busyNow()) return false;
  if (upRunning() >= (hasSig('olppaemi') ? 2 : 1)) return false;
  return S.res.jeong >= upCost(st.E + 1).jeong - 1e-9;
}
function startUp(L, free){
  const st = S.enc.lenses[L];
  if (free){
    if (!S.enc || S.enc.freeUp || !st || st.E >= 3 || st.ai) return;
    S.enc.freeUp = true; st.E++; toast(`학의 걸음 — ${LENS[L].name} 근거가 바로 한 단계 친절해졌다.`, 'gold');
  } else {
    if (!canUp(L)) return;
    const c = upCost(st.E + 1);
    S.res.jeong = Math.max(0, S.res.jeong - c.jeong);
    st.up = { days:c.days, done:0 };
  }
  useLens(L); S.stats.lensUse[L] = (S.stats.lensUse[L] || 0) + 1;
  nudge('B', 1, PR.selfAlpha / 2);
  log('up', { L, free:!!free });
  dirty.panel = true; save();
}
function canAsk(L, form){
  const st = S.enc.lenses[L];
  if (!st || st.asked[form] || st.ai || busyNow()) return false;
  return canPay(qCost(form, L, S.enc.type));
}
function ask(L, form){
  if (!canAsk(L, form)) return;
  const c = qCost(form, L, S.enc.type);
  pay(c);
  const ctx = { kind:'enc', type:S.enc.type, lens:L, form, paid:c };
  if (c.cur === 'days'){ S.prep = { days:c.amt, done:0, ctx }; toast(`천천히 물음을 고르는 중 — ${fmtN(c.amt)}일 뒤 문항이 열린다.`); }
  else openProblem(ctx);
  dirty.panel = true;
}
function eagle(L){
  const E = S.enc, st = E && E.lenses[L];
  if (!st || st.ai || busyNow()) return;
  const cost = PR.aiUnique * (1 - 0.3 * Math.max(0, -SELF().C)) * (1 + 0.3 * Math.max(0, SELF().C));
  S.res.unique = Math.max(0, S.res.unique - cost);
  st.E = 3; st.I = Math.max(st.I, 1); st.ai = true; st.up = null; E.usedAI = true;
  S.stats.ai++;
  nudge('C', -1, PR.selfAlpha);
  log('ai', { L, type:E.type });
  toast(`독수리가 ${LENS[L].name}에 가장 친절한 답을 주었다 — 그 자리는 굳었다(고유함 −${fmtN(cost)}).`, 'bad');
  dirty.panel = true; save();
}
function decide(id){
  const E = S.enc, def = E.fossil ? null : ENC[E.type];
  if (!E || busyNow()) return;
  if (E.fossil){ return fossilChoice(id); }
  const opt = def.opts.find((o) => o.id === id); if (!opt) return;
  const c = optCalc(opt);
  const ok = c.p >= 1 || R() < c.p;
  const eff = Object.assign({}, ok ? opt.ok : opt.ng);
  if (!ok && c.n) eff.morale = r1((eff.morale || 0) - sig('kkachi') * penScale());
  const raw = c.n ? Object.values(E.lenses).every((st) => st.I === 0 && st.E <= LEVELS[S.level].startE && !st.ai) : false;
  if (E.type !== 'start'){
    S.stats.decisions.push({ type:E.type, opt:id, ok, q:r2(c.avgQ), raw, p:r2(c.p) });
    if (c.n){
      nudge('B', clamp((c.avgQ * 4 - 1.5) / 1.5, -1, 1), PR.selfAlpha);
      if (!E.usedAI) nudge('C', 1, PR.selfAlpha / 2);
    }
  }
  log('dec', { type:E.type, opt:id, ok, p:r2(c.p) });
  const say = `${opt.label} — ${ok ? '잘 됐다' : '뜻대로 되지 않았다'}.${effText(eff) ? ' ' + effText(eff) : ''}`;
  if (opt.base(E, S) < 1 || c.n) toast(say, ok ? 'good' : 'bad');
  if (opt.busy){
    const days = opt.busy(E, S);
    S.busy = { until:S.day + days, len:days, text:opt.busyText || '머무는 중', eff, ok };
    S.mode = 'busy';
  } else { applyEff(eff); toRoute(); }
  dirty.panel = dirty.hud = true; save();
}
function applyEff(e){
  if (!e) return;
  ['food', 'fuel', 'jeong', 'morale', 'unique'].forEach((k) => { if (e[k]) S.res[k] = Math.max(0, S.res[k] + e[k]); });
  S.res.jeong = Math.min(10, S.res.jeong); S.res.morale = Math.min(10, S.res.morale); S.res.unique = Math.min(100, S.res.unique);
  if (e.travel) S.pendingTravel += e.travel;
  if (e.news && S.enc && S.enc.lenses.hist && lensQ('hist') >= 0.5){
    S.newsBonus++; S.stormWarned = true;
    toast('역참에서 앞길 소식을 들었다 — 다음 조우의 근거 하나가 친절해지고, 나루의 풍랑 날짜를 미리 안다.', 'gold');
  }
}
function effText(e){
  const p = [];
  if (e.travel) p.push(e.travel < 0 ? `이동 ${-e.travel}일 단축` : `이동 +${e.travel}일`);
  const nm = { food:'식량', fuel:'연료', jeong:'정성', morale:'사기', unique:'고유함' };
  Object.keys(nm).forEach((k) => { if (e[k]) p.push(`${nm[k]} ${e[k] > 0 ? '+' : '−'}${fmtN(Math.abs(e[k]))}`); });
  if (e.news) p.push('소식');
  return p.join(' · ');
}
function extraAction(){
  const E = S.enc, def = ENC[E.type];
  if (!def.extra || E.extraDone || busyNow()) return;
  E.extraDone = true;
  const gain = r1(2 + 4 * lensQ('life'));
  S.busy = { until:S.day + def.extra.busy, len:def.extra.busy, text:'땔감을 모으는 중', eff:{ fuel:gain }, ok:true, back:true };
  S.mode = 'busy';
  log('extra', { type:E.type, gain });
  dirty.panel = true;
}
function useTurn(){ if (S.enc && hasSig('jebi') && !S.enc.turn){ S.enc.turn = true; toast('선회 — 이번 결정의 성공률이 오른다.', 'gold'); dirty.panel = true; } }
function borrow(q){
  if (!S.enc || S.sichungUsed || SELF().name !== 'wren' || SELF().centerDays < 6) return;
  S.sichungUsed = true; S.enc.borrowed = q;
  toast(`時中 — 이 조우에서 ${SELVES[q].name}의 ${SIG_SKILL[q]}을(를) 빌려 쓴다.`, 'gold');
  if (q === 'kkachi') spawnSign('good');
  dirty.panel = true;
}

/* ---------- 이동 ---------- */
function toRoute(){
  S.lastEnc = S.enc ? { type:S.enc.type } : null;
  S.enc = null; S.mode = 'route';
  dirty.panel = true;
}
function routeDays(to){
  const e = edgeOf(S.at, to); let d = (e ? e.days : 2) + S.pendingTravel;
  d *= 1 - 0.2 * lensShare('hist');
  return Math.max(1, Math.round(d * 2) / 2);
}
function goTo(to){
  if (S.mode !== 'route' || !node(S.at).next.includes(to)) return;
  const days = routeDays(to);
  S.travel = { from:S.at, to, days, done:0 };
  S.pendingTravel = 0; S.mode = 'travel';
  log('go', { to:node(to).type, days });
  dirty.panel = true; save();
}
function arrive(){
  const to = S.travel.to; S.at = to; S.travel = null;
  const n = node(to); n.visited = true; revealFrom(to);
  if (n.type === 'goal'){ S.mode = 'goal'; return endSeason('win'); }
  if (n.fossil){ S.enc = { type:n.type, node:to, fossil:true, P:ENC[n.type].params(R), arrived:S.day, lenses:{}, seed:Math.floor(R() * 1e6) }; S.mode = 'enc'; }
  else { S.enc = makeEnc(to); S.mode = 'enc'; }
  log('arrive', { type:n.type, fossil:n.fossil });
  dirty.panel = true; save();
}
function fossilChoice(id){
  const E = S.enc;
  if (id === 'pass'){
    S.res.unique = Math.max(0, S.res.unique - PR.fossilUnique);
    S.stats.fossilsPassed++; nudge('C', -1, PR.selfAlpha / 2);
    toast(`독수리의 답대로 지나갔다 — 아무 일도, 아무 배움도 없었다(고유함 −${PR.fossilUnique}).`, 'bad');
    log('fossil', { pass:true }); toRoute(); save();
  } else if (id === 'awaken'){
    const L = pickR(R, ENC[E.type].lenses);
    openProblem({ kind:'awaken', type:E.type, lens:L, form:'why' });
  }
}

/* ---------- 문항 ---------- */
function finalize(prob, r){
  const p = JSON.parse(JSON.stringify(prob));
  if (p.kind === 'choice'){
    const opts = shuffleR(r, [p.right].concat(p.wrongs));
    p.options = opts; p.correct = opts.indexOf(p.right);
    delete p.right; delete p.wrongs;
  }
  return p;
}
function viewP(type, P, E){
  if (type === 'ice' && E && E.type === 'ice') return Object.assign({}, P, { s0:iceNow(P, E, S) });
  return P;
}
function genProblem(type, L, form, P, v){
  const f = ENC[type].q[L][form];
  return finalize(f(P, R, v || 0), R);
}
function openProblem(ctx){
  let prob = ctx.prob;
  if (!prob){
    if (ctx.kind === 'enc' || ctx.kind === 'awaken'){
      const P = viewP(ctx.type, S.enc.P, S.enc);
      prob = genProblem(ctx.type, ctx.lens, ctx.form, P, 0);
    } else if (ctx.kind === 'start'){
      const pc = S.enc.pieces[ctx.piece];
      prob = genProblem(pc.type, pc.lens, pc.form, pc.P, 0);
    } else if (ctx.kind === 'reflect'){
      prob = genProblem(ctx.type, ctx.lens, ctx.form, ENC[ctx.type].params(R), 1 + Math.floor(R() * 3));
    }
  }
  S.speed = 1;
  PB = { ctx, prob, opened:S.day, done:null };
  dirty.panel = true;
  showProblem();
}
function parseNum(s){
  s = String(s || '').trim().replace(/[−–—]/g, '-').replace(/\s+/g, '').replace(/,/g, '');
  if (!s) return NaN;
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m){ const b = Number(m[2]); return b ? Number(m[1]) / b : NaN; }
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}
const near = (x, a) => Math.abs(x - a) <= Math.max(0.011, 0.005 * Math.abs(a));
function judge(input){
  const p = PB.prob;
  if (p.kind === 'choice') return input === p.correct;
  if (p.kind === 'num') return near(input, p.ans);
  if (p.kind === 'pair') return near(input[0], p.a) && near(input[1], p.b);
  return false;
}
function answerText(p){
  if (p.kind === 'choice') return p.options[p.correct];
  if (p.kind === 'num') return fmtN(p.ans);
  return `a = ${fmtN(p.a)}, b = ${fmtN(p.b)}`;
}
function resolveProblem(ok){
  const { ctx } = PB; PB.done = { ok };
  const L = ctx.lens;
  if (ctx.form && ctx.kind !== 'weather' && ctx.kind !== 'reflect'){
    S.stats.forms[ctx.form]++;
    if (ctx.form === 'how') nudge('A', -1, PR.selfAlpha);
    if (ctx.form === 'why') nudge('A', 1, PR.selfAlpha);
  }
  if (L){ useLens(L); S.stats.lensUse[L] = (S.stats.lensUse[L] || 0) + 1; }
  if (ok){
    S.correct++;
    if (S.correct % 3 === 0){ S.polya.points++; toast('질문 트리에 새 물음을 열 수 있다.', 'gold'); }
    S.res.jeong = Math.min(10, S.res.jeong + PR.refund);
    if (SELF().name === 'kkachi') S.res.morale = Math.min(10, S.res.morale + 0.6);
    if (L === 'lore' || lensShare('lore') > 0) S.res.morale = Math.min(10, S.res.morale + lensShare('lore'));
  }
  if (ctx.kind === 'enc'){
    const st = S.enc && S.enc.lenses[L];
    if (st){
      st.asked[ctx.form] = ok ? 'ok' : 'ng';
      if (ok){
        st.I += PR['i' + ctx.form[0].toUpperCase() + ctx.form.slice(1)];
        if (S.polya.open.includes('reuse')) Object.entries(S.enc.lenses).forEach(([k, o]) => { if (k !== L) o.I += 0.5; });
        if (ctx.form === 'why'){ S.known[ctx.type] = S.known[ctx.type] || {}; S.known[ctx.type][L] = true; }
        if (ctx.type === 'sea' && L === 'math' && (ctx.form === 'how' || ctx.form === 'why')) S.enc.stormKnown = true;
      }
    }
    roadOrWeather(ok, ctx.type, L, ctx.form);
  } else if (ctx.kind === 'start'){
    const pc = S.enc.pieces[ctx.piece]; pc.done = ok ? 'ok' : 'ng';
    S.stats.opening++;
    if (ok) S.res.jeong = Math.min(10, S.res.jeong + 0.5);
    else makeWeather(pc.type, L, pc.form);
  } else if (ctx.kind === 'weather'){
    const w = S.weathers.find((x) => x.id === ctx.wx);
    if (w){
      if (ok){
        S.weathers = S.weathers.filter((x) => x !== w); S.stats.wxCleared++;
        S.res.morale = Math.min(10, S.res.morale + 1);
        if (S.winter.on){ S.res.fuel += 1; S.res.morale = Math.min(10, S.res.morale + 0.5); }
        toast(`날씨가 걷혔다 — ${ENC[w.type].name} · ${LENS[w.lens].name}.`, 'good');
      } else {
        w.str += 1; w.prob = genProblem(w.type, w.lens, w.form, ENC[w.type].params(R), 1 + Math.floor(R() * 3));
        toast('같은 오개념이 더 세게 분다 — 날씨가 한 겹 짙어졌다.', 'bad');
      }
    }
  } else if (ctx.kind === 'reflect'){
    const pc = S.reflect && S.reflect[ctx.piece]; if (pc) pc.done = ok ? 'ok' : 'ng';
    if (ok){ S.res.fuel += 1; S.res.morale = Math.min(10, S.res.morale + 0.5); }
  } else if (ctx.kind === 'awaken'){
    if (ok){
      const n = node(S.enc.node); n.fossil = false; S.stats.awakened++;
      S.enc = makeEnc(S.enc.node); S.mode = 'enc';
      toast('왜?가 화석을 깨웠다 — 이 자리가 다시 자란다.', 'good');
      nudge('C', 1, PR.selfAlpha);
    } else makeWeather(S.enc.type, L, 'why');
  }
  log('q', { k:ctx.kind, L, f:ctx.form, ok });
  dirty.panel = dirty.hud = true; save();
}
function roadOrWeather(ok, type, L, form){
  if (ok){
    if (!hasRoad(type, L)){ S.roads.push({ type, lens:L }); S.stats.roadsMade++; toast(`길이 났다 — 다음 ${ENC[type].name}에서 ${LENS[L].name} 근거가 처음부터 읽힌다.`, 'gold'); }
  } else makeWeather(type, L, form);
}
function makeWeather(type, L, form){
  const ex = S.weathers.find((w) => w.type === type && w.lens === L);
  const prob = genProblem(type, L, form, ENC[type].params(R), 1 + Math.floor(R() * 3));
  if (ex){ ex.str += 1; ex.prob = prob; ex.form = form; }
  else S.weathers.push({ id:'w' + (++S.wxSeq), type, lens:L, form, str:1, prob, made:r1(S.day) });
  S.stats.wxMade++;
  toast(`오답이 날씨가 되었다 — ${ENC[type].name}마다 ${LENS[L].name} 오개념 돌풍. 다시 물으면 걷힌다.`, 'bad');
}
function polyaOpen(id){
  if (S.polya.points <= 0 || S.polya.open.includes(id)) return;
  S.polya.points--; S.polya.open.push(id);
  toast(`질문 트리 — "${POLYA.find((p) => p.id === id).name}"`, 'gold');
  dirty.panel = true; save();
}
function reflectPieces(){
  if (S.reflect) return S.reflect;
  const src = S.roads.length ? S.roads : ENC_TYPES.slice(0, 2).map((t) => ({ type:t, lens:ENC[t].lenses[0] }));
  S.reflect = shuffleR(R, src).slice(0, 3).map((r) => ({ type:r.type, lens:r.lens, form:pickR(R, ['what', 'how', 'why']), done:null }));
  return S.reflect;
}

/* ---------- 징조 · 화석 · 한겨울 ---------- */
let SIGNS = [];
function spawnSign(kind){
  const W = S.winter;
  const warnFrom = W.start - PR.winterWarn - (sigRaw('kkachi') >= 0.5 ? 1 : 0);
  if (!kind){
    if (!W.warned && !W.on && S.day >= warnFrom && S.day < W.start) kind = R() < 0.65 ? 'winter' : 'good';
    else if (seaAhead()) kind = R() < 0.4 ? 'storm' : 'good';
    else kind = 'good';
  }
  const life = PR.signLife * 1000 * (1 + 0.5 * sig('kkachi'));
  SIGNS.push({ kind, x:0.1 + R() * 0.8, y:0.12 + R() * 0.76, born:nowMs(), life });
}
function seaAhead(){
  if (S.enc && S.enc.type === 'sea' && !S.enc.stormKnown) return true;
  const from = S.travel ? S.travel.to : S.at;
  return node(from).next.some((k) => node(k).type === 'sea') || (S.travel && node(S.travel.to).type === 'sea');
}
function catchSign(sg){
  SIGNS = SIGNS.filter((x) => x !== sg); S.stats.signs++;
  if (sg.kind === 'winter'){
    S.winter.warned = true; S.stats.winterWarned = true;
    toast(`까마귀 떼가 남쪽으로 날아간다 — 한겨울이 ${Math.max(1, Math.ceil(S.winter.start - S.day))}일 뒤 온다(前知). 미리 알면 연료가 덜 든다.`, 'gold');
  } else if (sg.kind === 'storm'){
    if (S.enc && S.enc.type === 'sea') S.enc.stormKnown = true; else S.stormWarned = true;
    toast('갈매기가 내륙으로 — 나루의 풍랑 날짜를 읽었다.', 'gold');
  } else {
    if (R() < 0.5){ S.res.jeong = Math.min(10, S.res.jeong + 1); toast('까치가 운다 — 길조. 정성 +1', 'gold'); }
    else { S.omenBonus++; toast('까치가 운다 — 길조. 다음 조우에서 근거 하나가 친절해진다.', 'gold'); }
  }
  log('sign', { k:sg.kind });
  dirty.panel = dirty.hud = true;
}
function fossilize(){
  S.nextFossil = S.day + PR.fossilEvery * (0.8 + R() * 0.4);
  const curCol = node(S.travel ? S.travel.to : S.at).col;
  const cand = Object.values(S.map.nodes).filter((n) => n.col > curCol && n.col <= 5 && !n.fossil && !n.visited && !(S.travel && S.travel.to === n.id));
  if (!cand.length) return;
  const n = pickR(R, cand); n.fossil = true; n.known = true;
  toast(`독수리가 ${ENC[n.type].name}에 먼저 답을 내렸다 — 그 자리는 굳었다. 지나가면 안전하지만 아무것도 자라지 않는다.`, 'bad');
  log('fossilize', { type:n.type, col:n.col });
  dirty.panel = true;
}
function winterCheck(){
  const W = S.winter;
  if (!W.on && !W.done && S.day >= W.start){
    W.on = true; S.reflect = null;
    banner('In the bleak midwinter — 땅은 쇠처럼, 물은 돌처럼 굳었다.', `한겨울 ${W.len}일. 이동 · 결정 · 새 근거가 멈춘다. 가진 것이 없을 때 줄 수 있는 건 질문 — 지난 오답과 근거를 다시 물어 버티자.${W.warned ? ' (미리 알아 연료가 덜 든다)' : ''}`, 5200);
    log('winter', { on:true, warned:W.warned });
    dirty.panel = dirty.hud = true;
  } else if (W.on && S.day >= W.start + W.len){
    W.on = false; W.done = true;
    banner('한겨울이 지나갔다.', '다시 길을 갈 수 있다.', 2600);
    log('winter', { on:false });
    dirty.panel = dirty.hud = true;
  }
}

/* ---------- 시계 ---------- */
function rates(){
  const E = S.enc, atEnc = (S.mode === 'enc' || S.mode === 'busy') && E;
  const kind = atEnc && !E.fossil && ENC[E.type].clock ? ENC[E.type].clock.kind : null;
  const slow = kind === 'slow';
  const pen = penScale();
  let food = PR.foodPerDay * (1 - 0.3 * lensShare('life'));
  let fuel = PR.fuelPerDay * (1 - 0.3 * lensShare('sci'));
  if (atEnc && E.type === 'mount') fuel *= PR.mountFuelMul;
  if (S.winter.on) fuel *= S.winter.warned ? PR.winterFuelKnown : PR.winterFuel;
  if (slow){ food *= 1 - 0.2 * sig('durumi'); fuel *= 1 - 0.2 * sig('durumi'); }
  if (atEnc && S.day - E.arrived > 2) food *= 1 + 0.3 * sig('olppaemi') * pen;
  let jeong = PR.jeongRegen;
  if (slow && S.mode === 'enc') jeong -= 0.3 * sig('jebi') * pen;
  let morale = 0;
  if (deadlineLeft() <= 2) morale -= 0.4 * sig('durumi') * pen;
  if (S.res.food <= 0) morale -= PR.starveMorale;
  if (S.res.fuel <= 0) morale -= PR.starveMorale;
  const c = SELF().C;
  const unique = -0.3 * Math.max(0, -c) + 0.15 * Math.max(0, c);
  return { food, fuel, jeong, morale, unique };
}
function tick(dt){
  if (!S || S.over) return;
  const d0 = Math.floor(S.day);
  S.day += dt;
  const r = rates();
  S.res.food = Math.max(0, S.res.food - r.food * dt);
  S.res.fuel = Math.max(0, S.res.fuel - r.fuel * dt);
  S.res.jeong = clamp(S.res.jeong + r.jeong * dt, 0, 10);
  S.res.morale = clamp(S.res.morale + r.morale * dt, 0, 10);
  S.res.unique = clamp(S.res.unique + r.unique * dt, 0, 100);
  if (SELF().name === 'wren') SELF().centerDays += dt;
  if (S.enc && S.enc.lenses && !S.winter.on){
    Object.entries(S.enc.lenses).forEach(([L, st]) => {
      if (!st.up) return;
      st.up.done += dt;
      if (st.up.done >= st.up.days){ st.up = null; st.E = Math.min(3, st.E + 1); toast(`${LENS[L].name} 근거가 ${EV_LV[st.E]}(으)로 다듬어졌다.`); dirty.panel = true; }
    });
  }
  if (S.prep){ S.prep.done += dt; if (S.prep.done >= S.prep.days && !PB){ const ctx = S.prep.ctx; S.prep = null; openProblem(ctx); } }
  if (S.mode === 'travel' && !S.winter.on){ S.travel.done += dt; if (S.travel.done >= S.travel.days) arrive(); }
  if (S.over) return;
  if (S.mode === 'busy' && S.busy && S.day >= S.busy.until){
    const b = S.busy; S.busy = null;
    applyEff(b.eff);
    if (b.back){ S.mode = 'enc'; toast(`땔감을 모았다 — 연료 +${fmtN(b.eff.fuel)}.`, 'good'); }
    else toRoute();
    dirty.panel = dirty.hud = true; save();
  }
  if (!S.winter.on && S.day >= S.nextSign){ spawnSign(); S.nextSign = S.day + PR.signEvery * (0.6 + R() * 0.8); }
  if (S.day >= S.nextFossil) fossilize();
  winterCheck();
  if (Math.floor(S.day) !== d0){ dirty.panel = true; save(); }
  if (S.res.morale <= 0) endSeason('scatter');
  else if (S.res.unique <= 0) endSeason('eagle');
  else if (S.day >= PR.seasonDays && !S.over) endSeason('stuck');
  dirty.hud = true;
}

/* ---------- 겨울 끝 ---------- */
const RESULT = {
  win:{ t:'봄 나루에 닿았다', s:'일행과 함께 겨울을 건넜다.' },
  stuck:{ t:'겨울에 갇혔다', s:'계절이 끝날 때까지 봄 나루에 닿지 못했다.' },
  scatter:{ t:'일행이 흩어졌다', s:'사기가 바닥났다 — 다음 겨울엔 무엇을 먼저 물을까.' },
  eagle:{ t:'독수리의 세계', s:'고유함이 바닥났다 — 내 스페이스가 독수리의 기본값과 같아졌다.' },
  quit:{ t:'겨울을 접었다', s:'여기까지의 기록을 남긴다.' },
};
function spaceCoef(){
  const s = SELF();
  const a = r2(-1.5 + 1.0 * s.A), b = r2(4 + 2 * s.B);
  const c = r2(clamp(3 + 0.5 * S.roads.length - 0.4 * S.weathers.length + (S.res.unique - 70) / 20, 0.5, 12));
  return [a, b, c];
}
function endSeason(kind){
  if (S.over) return;
  closeProblem(true);
  S.over = { kind, day:r1(S.day) };
  const coef = spaceCoef();
  S.over.coef = coef;
  const rec = { t:Date.now(), level:S.level, kind, days:r1(S.day), coef, self:SELF().name, label:selfLabel(), roads:S.roads.length, wx:S.weathers.length, ai:S.stats.ai };
  SAVE.runs.unshift(rec); SAVE.runs = SAVE.runs.slice(0, 12);
  SAVE.cur = null;
  log('end', { kind });
  save(true);
  showSummary();
  dirty.lobby = true;
}

let saveTimer = 0;
function snapshot(){
  const out = Object.assign({}, SAVE);
  out.cur = S && !S.over ? JSON.parse(JSON.stringify(S)) : null;
  SAVE.cur = out.cur;
  let s = JSON.stringify(out);
  if (s.length > 19500 && out.cur){ out.cur.log = out.cur.log.slice(-20); s = JSON.stringify(out); }
  if (s.length > 19500){ out.runs = out.runs.slice(0, 5); s = JSON.stringify(out); }

}

}
function mergeSave(d){

}

}

function lensCard(L){
  const E = S.enc, st = E.lenses[L], def = ENC[E.type];
  const evRaw = def.ev[L][0](E.P, E, S), evNow = st.E > 0 ? def.ev[L][st.E](E.P, E, S) : '';
  const qn = Math.min(4, st.E + st.I), dots = '●'.repeat(Math.floor(qn)) + (qn % 1 >= 0.5 ? '◐' : '') + '○'.repeat(Math.max(0, 4 - Math.ceil(qn)));

  if (p.kind === 'choice'){ if (pickChoice < 0){ $('pErr').textContent = '하나를 골라 주세요.'; return; } val = pickChoice; }

    const raw = $('pA').value; if (!raw.trim()){ $('pErr').textContent = '값을 넣어 주세요 (분수 2/3, 음수 −6 도 돼요).'; return; }

  } else {

    const a = parseNum(ra), b = parseNum(rb);
    if (!isFinite(a) || !isFinite(b)){ $('pErr').textContent = '숫자로 넣어 주세요 — 예: −6 · 2/3'; return; }
    val = [a, b];
  }
  const ok = judge(val);

  let after = '';
  if (ctx.kind === 'enc') after = ok ? (hasRoad(ctx.type, ctx.lens) ? `길 — 다음 ${ENC[ctx.type].name}에선 이 렌즈가 처음부터 읽힌다.` : '') : `날씨 — ${ENC[ctx.type].name}마다 이 오개념이 비슷한 모양으로 다시 분다.`;
  else if (ctx.kind === 'weather') after = ok ? '날씨가 걷혔다.' : '날씨가 한 겹 짙어졌다.';
  $('pFb').innerHTML = `<div class="fb ${ok ? 'ok' : 'ng'}"><b>${ok ? '맞았다' : '아니다'}</b>${ok ? '' : ` — 답: ${esc(answerText(prob))}`}<small>${esc(prob.explain || '')}${after ? '<br>' + esc(after) : ''}</small></div>`;
  $('pIn').querySelectorAll('input,button').forEach((el) => { el.disabled = true; });
  if (prob.kind === 'choice'){ const btns = $('pIn').querySelectorAll('[data-i]'); btns[prob.correct] && (btns[prob.correct].style.borderColor = 'var(--good)'); }
  $('pActs').innerHTML = '<button class="btn primary" id="pNext" type="button">계속</button>';
  $('pNext').onclick = () => closeProblem();

}

/* ---------- 지도 ---------- */
const cv = $('map'), cx = cv.getContext('2d');
let MW = 0, MH = 0, DPR = 1;
function layoutMap(){
  const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  MW = Math.max(10, r.width); MH = Math.max(10, r.height);
  cv.width = Math.round(MW * DPR); cv.height = Math.round(MH * DPR);
}
window.addEventListener('resize', () => { if (screen === 'game'){ layoutMap(); measureHud(); } });
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if (screen === 'game') layoutMap(); }).observe(cv.parentElement);
function nxy(n){

}
function bandXY(){
  if (S.mode === 'travel' && S.travel){
    const [x1, y1] = nxy(node(S.travel.from)), [x2, y2] = nxy(node(S.travel.to)), t = clamp(S.travel.done / S.travel.days, 0, 1);
    return [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];
  }

}
function drawMap(now){
  if (!S || screen !== 'game') return;
  const g = cx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = CV.field; g.fillRect(0, 0, MW, MH);
  g.strokeStyle = CV.grid; g.lineWidth = 1;
  for (let x = 0; x < MW; x += 36){ g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, MH); g.stroke(); }
  for (let y = 0; y < MH; y += 36){ g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(MW, y + 0.5); g.stroke(); }
  const R0 = clamp(Math.min(MW, MH) * 0.055, 15, 26);
  const nodes = S.map.nodes, cur = node(S.at);
  // 길(선)
  S.map.edges.forEach((e) => {
    const a = nodes[e.a], b = nodes[e.b], [x1, y1] = nxy(a), [x2, y2] = nxy(b);
    const walked = a.visited && b.visited && (S.at === e.b || b.col <= cur.col) && pathHas(e.a, e.b);
    const choose = S.mode === 'route' && e.a === S.at;
    const roadGlow = b.known && S.roads.some((r) => r.type === b.type);
    g.setLineDash(choose ? [6, 5] : []);
    if (roadGlow && !walked){ g.strokeStyle = CV.gold; g.globalAlpha = 0.35; g.lineWidth = 7; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.globalAlpha = 1; }
    g.strokeStyle = walked ? CV.accent : choose ? CV.accent : CV.line; g.lineWidth = walked ? 3 : choose ? 2.2 : 1.4;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  });
  g.setLineDash([]);
  // 자리
  Object.values(nodes).forEach((n) => {
    const [x, y] = nxy(n), known = n.known || n.type === 'goal' || n.type === 'start';
    const isCur = n.id === S.at && S.mode !== 'travel';
    g.beginPath(); g.arc(x, y, R0, 0, Math.PI * 2);
    g.fillStyle = n.fossil ? CV.eagle : n.visited ? CV.accentSoft : CV.surface; g.globalAlpha = n.fossil ? 0.55 : 1; g.fill(); g.globalAlpha = 1;
    g.lineWidth = isCur ? 3.5 : 1.2; g.strokeStyle = isCur ? CV.accent : CV.line; g.stroke();
    if (S.mode === 'route' && cur.next.includes(n.id)){ g.beginPath(); g.arc(x, y, R0 + 5 + Math.sin(now / 300) * 2, 0, Math.PI * 2); g.strokeStyle = CV.accent; g.lineWidth = 1.5; g.stroke(); }
    g.font = `${Math.round(R0 * 0.95)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = CV.ink; g.fillText(known ? ENC[n.type].icon : '?', x, y + 1);
    g.font = '600 11px ' + CV.font; g.fillStyle = CV.muted; g.textBaseline = 'top';
    const label = n.fossil ? '화석' : known ? ENC[n.type].name : '';
    if (label) g.fillText(label, x, y + R0 + 4);
    if (known && n.type !== 'start' && n.type !== 'goal'){
      const rd = S.roads.filter((r) => r.type === n.type).length;
      if (rd){ g.fillStyle = CV.gold; g.font = '700 10px sans-serif'; g.fillText('길 ' + rd, x + R0 * 0.9, y - R0 - 12); }
      const wx = wxOn(n.type);
      if (wx.length && !n.visited){
        const k = wx.reduce((t, w) => t + w.str, 0), dx = Math.sin(now / 900 + n.col) * 4;
        g.font = `${Math.round(R0 * 0.8)}px system-ui, sans-serif`; g.textBaseline = 'middle'; g.fillStyle = CV.risk;
        g.fillText('☁', x - R0 * 1.05 + dx, y - R0 * 0.95); g.font = '700 10px sans-serif'; g.fillText('×' + k, x - R0 * 1.05 + dx + 12, y - R0 * 0.95 + 8);
      }
    }
  });
  // 굴뚝새(일행)
  const [bx, by] = bandXY(), bob = Math.sin(now / 240) * (S.mode === 'travel' && !S.winter.on ? 2 : 0.6);
  g.font = `${Math.round(R0 * 0.9)}px system-ui, "Apple Color Emoji", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.beginPath(); g.arc(bx, by - R0 - 10 + bob, R0 * 0.62, 0, Math.PI * 2); g.fillStyle = CV.surface; g.fill(); g.strokeStyle = SELVES[SELF().name].color; g.lineWidth = 2; g.stroke();
  g.fillText('🐦', bx, by - R0 - 9 + bob);
  // 징조
  const t = nowMs();
  SIGNS = SIGNS.filter((sg) => { const alive = t - sg.born < sg.life; if (!alive && S && !paused) S.stats.signsMissed++; return alive || paused; });
  SIGNS.forEach((sg) => {
    if (paused) sg.born += 16;
    const x = sg.x * MW, y = sg.y * MH, left = 1 - (t - sg.born) / sg.life, pulse = 1 + Math.sin(t / 160) * 0.12;
    g.globalAlpha = clamp(left * 1.6, 0.15, 1);

    g.fillStyle = sg.kind === 'good' ? CV.gold : sg.kind === 'winter' ? CV.accent : CV.risk; g.globalAlpha *= 0.25; g.fill();
    g.globalAlpha = clamp(left * 1.6, 0.15, 1);
    g.lineWidth = 2; g.strokeStyle = sg.kind === 'good' ? CV.gold : sg.kind === 'winter' ? CV.accent : CV.risk; g.stroke();
    g.font = '18px system-ui, "Apple Color Emoji", sans-serif'; g.fillStyle = CV.ink;
    g.fillText(sg.kind === 'good' ? '✨' : sg.kind === 'winter' ? '❄️' : '🌀', x, y + 1);

}
function pathHas(a, b){ return S.log.some((l) => l.t === 'go') && node(a).visited && node(b).visited; }
cv.addEventListener('pointerdown', (e) => {
  if (!S || paused || S.over) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  for (const sg of SIGNS.slice().reverse()){ if (Math.hypot(sg.x * MW - x, sg.y * MH - y) < 30){ catchSign(sg); return; } }
  if (S.mode === 'route'){
    const R0 = clamp(Math.min(MW, MH) * 0.055, 15, 26);
    for (const k of node(S.at).next){ const [nx, ny] = nxy(node(k)); if (Math.hypot(nx - x, ny - y) < R0 + 10){ goTo(k); return; } }
  }
});

/* ---------- 결산 ---------- */
function journal(){
  const st = S.stats, out = [];
  const s0 = S.startSelf, s1 = SELF();
  out.push(s0.name === s1.name ? `겨울 내내 ${SELVES[s1.name].name}였다 — ${SELVES[s1.name].who}.` : `겨울을 ${SELVES[s0.name].name}로 시작해 ${SELVES[s1.name].name}로 끝냈다.`);
  const f = st.forms;
  if (f.how + f.why) out.push(`조우 앞에서 '어떻게'를 ${f.how}번, '왜'를 ${f.why}번, '무엇'을 ${f.what}번 물었다.`);
  const dec = st.decisions.filter((d) => d.p < 1);
  if (dec.length){
    const raw = dec.filter((d) => d.raw).length, ok = dec.filter((d) => d.ok).length;
    out.push(`결정 ${dec.length}번 — 날것만 보고 정한 건 ${raw}번, 뜻대로 된 건 ${ok}번.`);
  }
  const tl = topLens(); if (lensShare(tl) > 0) out.push(`가장 자주 본 렌즈는 ${LENS[tl].name}(${Math.round(lensShare(tl) * 100)}%) — 깃털이 그 빛으로 물들었다.`);
  out.push(st.ai ? `독수리에게 ${st.ai}번 물었다.` : '독수리에게 한 번도 묻지 않았다.');
  if (st.wxMade) out.push(`오답이 날씨가 된 것이 ${st.wxMade}번, 그 가운데 ${st.wxCleared}번은 다시 물어 걷어 냈다.`);
  if (st.roadsMade) out.push(`정답이 길이 된 것이 ${st.roadsMade}번.`);
  if (S.winter.done || S.winter.on) out.push(st.winterWarned ? '한겨울을 징조로 미리 알았다.' : '한겨울은 아무 예고 없이 왔다.');
  if (st.signs + st.signsMissed) out.push(`징조 ${st.signs + st.signsMissed}개 가운데 ${st.signs}개를 잡았다.`);
  if (S.polya.open.length) out.push(`질문 트리에서 연 물음: ${S.polya.open.map((id) => POLYA.find((p) => p.id === id).name).join(' · ')}`);
  return out;
}

function drawSpace(coef){
  const c = $('spaceCv'); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, X = (x) => 14 + (x / 10) * (W - 28), Y = (y) => H - 14 - ((y + 1) / 13) * (H - 28);
  g.fillStyle = CV.field; g.fillRect(0, 0, W, H);
  g.strokeStyle = CV.line; g.lineWidth = 1; g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(10), Y(0)); g.moveTo(X(0), Y(-1)); g.lineTo(X(0), Y(12)); g.stroke();
  const f = (k, x) => k[0] * (x - k[1]) ** 2 + k[2];
  const curve = (k, color, w, alpha) => { g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = w; g.beginPath(); let pen = false; for (let i = 0; i <= 200; i++){ const x = i / 20, y = f(k, x); if (y < -1 || y > 12.2){ pen = false; continue; } pen ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)); pen = true; } g.stroke(); g.globalAlpha = 1; };
  const past = SAVE.runs.slice(1, 9).map((r0) => r0.coef).filter((k) => Array.isArray(k));
  past.forEach((k) => curve(k, CV.muted, 1.2, 0.45));
  curve(coef, CV.accent, 3, 1);
  let meets = 0;
  past.forEach((k) => {
    const A = coef[0] - k[0], B = -2 * (coef[0] * coef[1] - k[0] * k[1]), C = coef[0] * coef[1] ** 2 - k[0] * k[1] ** 2 + coef[2] - k[2];
    const roots = Math.abs(A) < 1e-9 ? (Math.abs(B) < 1e-9 ? [] : [-C / B]) : (() => { const D = B * B - 4 * A * C; return D < 0 ? [] : [(-B + Math.sqrt(D)) / (2 * A), (-B - Math.sqrt(D)) / (2 * A)]; })();
    roots.filter((x) => x >= 0 && x <= 10).forEach((x) => { const y = f(coef, x); if (y < -1 || y > 12) return; meets++; g.beginPath(); g.arc(X(x), Y(y), 4.5, 0, Math.PI * 2); g.fillStyle = CV.gold; g.fill(); });
  });
  $('spaceNote').textContent = `y = ${fmtN(coef[0])}(x − ${fmtN(coef[1])})² + ${fmtN(coef[2])} — a는 묻는 방식, b는 근거 태도, c는 길 · 날씨 · 고유함에서 온다. ${past.length ? `지난 겨울의 곡선과 만나는 점 ${meets}개 — 2막에서 스페이스가 이어질 문.` : '다음 겨울부터 지난 곡선과 만나는 점(문)이 보인다.'}`;
}

    <div class="sumgrid">
      <div class="sumbox"><h3>한 판 = 한 계절</h3><p class="note">벌판 입구에서 봄 나루까지. 길마다 조우(산 · 나루 · 강 · 마을 · 숲)가 있고, 조우마다 결정이 있다. 계절(${PR.seasonDays}일)이 끝나기 전에 닿으면 이긴다.</p></div>
      <div class="sumbox"><h3>시계는 멈추지 않는다</h3><p class="note">하루 = 1턴, 실시간으로 흐른다(1× · 2× · 4×). 하루마다 식량 · 연료가 줄고 사건이 다가온다. 멈추면 근거와 문항이 가려진다.</p></div>
      <div class="sumbox"><h3>근거는 친절해질 수 있다</h3><p class="note">날것 → 정리 → 해설 → 방대. 다듬을수록 시간과 정성이 든다. 대신 문항을 풀어 날것을 직접 읽어 내면 시간을 아낀다 — 실력이 친절도를 대신한다.</p></div>
      <div class="sumbox"><h3>무엇을 물을지 고른다</h3><p class="note">렌즈(수학 · 과학 · 고사 · 역사 · 생활) × 형식(무엇? · 어떻게? · 왜?). 어떻게?는 지금을, 왜?는 다음을 바꾼다(그 렌즈는 다음부터 해설로 시작). 답은 직접 넣는다.</p></div>
      <div class="sumbox"><h3>정답은 길, 오답은 날씨</h3><p class="note">맞히면 그 렌즈에 길이 나 다음 같은 조우에서 처음부터 읽힌다. 틀리면 오개념 돌풍이 되어 같은 조우의 성공률을 깎는다 — 다시 물으면 걷힌다.</p></div>
      <div class="sumbox"><h3>결정의 막대</h3><p class="note">성공률은 폭으로 보인다. 근거가 단단할수록 폭이 좁아지고 성공률도 오른다. 언제 정할지가 타이밍이다.</p></div>
      <div class="sumbox"><h3>독수리(AI)</h3><p class="note">언제나 가장 친절한 근거를 바로 준다. 대신 고유함이 닳고 그 렌즈는 굳는다. 독수리는 가끔 앞의 자리를 먼저 굳혀 버린다 — 깨우려면 왜?를 물어야 한다.</p></div>
      <div class="sumbox"><h3>징조와 한겨울</h3><p class="note">지도 위에 잠깐 뜨는 징조를 눌러 잡는다. ❄️는 한겨울의 예고(미리 알면 연료가 덜 든다), 🌀는 풍랑, ✨는 길조. 한겨울엔 모든 것이 멈추고 질문만 남는다.</p></div>
      <div class="sumbox"><h3>자아</h3><p class="note">묻는 방식(어떻게 ↔ 왜)과 근거 태도(결단 ↔ 신중)가 플레이로 쌓여 제비 · 올빼미 · 까치 · 두루미 · 굴뚝새가 된다. 자아마다 질문 값을 치르는 자원과 소모 속도가 다르다. 자아는 겨울을 넘어 이어진다.</p></div>
    </div>
    <div class="dlg-acts"><button class="btn primary" id="hClose" type="button">알겠다</button></div>`;
  $('helpOv').hidden = false;
  if (S && screen === 'game' && !paused){ setPaused(true); $('helpOv').dataset.resume = '1'; }
  $('hClose').onclick = () => { $('helpOv').hidden = true; if ($('helpOv').dataset.resume){ delete $('helpOv').dataset.resume; setPaused(false); } };
}

/* ---------- 부모 창 메시지 ---------- */
window.addEventListener('message', (e) => {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'ash-theme' && (d.theme === 'light' || d.theme === 'dark')){ document.documentElement.dataset.theme = d.theme; readColors(); hudSig = ''; }
  if (d.type === 'ash-store' && d.key === SAVE_KEY){ if (!S) mergeSave(d.data); else if (d.data && d.data.v === 1 && !SAVE.runs.length) mergeSave(Object.assign({}, d.data, { cur:SAVE.cur })); }
});
document.addEventListener('fullscreenchange', () => { requestAnimationFrame(() => { layoutMap(); measureHud(); }); });

/* ---------- 고리 ---------- */
let lastT = nowMs(), lastPanel = 0;
function frame(){
  const t = nowMs(), dtMs = Math.min(250, t - lastT); lastT = t;
  if (screen === 'game' && S && !S.over && !paused){
    const dayMs = PR[LEVELS[S.level].dayKey] * 1000;
    tick(dtMs / dayMs * S.speed * DBG_MUL);
  }
  if (screen === 'lobby' && dirty.lobby) renderLobby();
  if (screen === 'game' && S){
    renderHud();
    if (t - lastPanel > 120){
      const sg = computePanelSig();
      if (dirty.panel || sg !== panelSig){ panelSig = sg; renderPanel(); }
      lastPanel = t;
    }
    livePanel(); updateProbClock();
    drawMap(t);
  }
  requestAnimationFrame(frame);
}
readColors(); loadSave(); renderLobby(); requestAnimationFrame(frame);
const themeObs = new MutationObserver(() => readColors());
themeObs.observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

/* ---------- 시험 갈고리 ---------- */
window.__gulttuksae = () => {
  const out = { screen, paused, level:SAVE.level, self:Object.assign({}, SELF(), { label:selfLabel(), sig:Object.fromEntries(QUADS.map((q) => [q, r2(sigRaw(q))])) }),
    runs:SAVE.runs.length, resume:!!SAVE.cur, params:Object.assign({}, PR), signs:SIGNS.length };
  if (!S) return out;
  Object.assign(out, { day:r2(S.day), speed:S.speed, mode:S.mode, at:{ col:node(S.at).col, type:node(S.at).type }, res:Object.fromEntries(Object.entries(S.res).map(([k, v]) => [k, r2(v)])),
    roads:S.roads.length, weathers:S.weathers.map((w) => ({ id:w.id, type:w.type, lens:w.lens, str:w.str })), winter:Object.assign({}, S.winter), polya:JSON.parse(JSON.stringify(S.polya)),
    over:S.over, next:S.mode === 'route' ? node(S.at).next.map((k) => ({ id:k, type:node(k).type, fossil:node(k).fossil, days:routeDays(k) })) : null,
    travel:S.travel ? { to:node(S.travel.to).type, days:S.travel.days, done:r2(S.travel.done) } : null, busy:S.busy ? { text:S.busy.text, left:r2(S.busy.until - S.day) } : null, stats:S.stats, prep:!!S.prep,
    rates:Object.fromEntries(Object.entries(rates()).map(([k, v]) => [k, r2(v)])) });
  if (S.enc){
    const E = S.enc;
    out.enc = { type:E.type, fossil:!!E.fossil, stormKnown:!!E.stormKnown, pieces:E.pieces ? E.pieces.map((p) => ({ lens:p.lens, form:p.form, done:p.done })) : null,
      lenses:Object.fromEntries(Object.entries(E.lenses || {}).map(([L, st]) => [L, { E:st.E, I:st.I, asked:st.asked, ai:st.ai, up:!!st.up, q:r2(lensQ(L)) }])) };
    if (!E.fossil && E.type !== 'start' && ENC[E.type].opts) out.enc.opts = ENC[E.type].opts.map((o) => { const c = optCalc(o); return { id:o.id, p:r2(c.p), lo:r2(c.lo), hi:r2(c.hi) }; });
    if (!E.fossil && E.type !== 'start') out.enc.costs = Object.fromEntries(['what', 'how', 'why'].map((f) => [f, qCost(f, ENC[E.type].lenses[0], E.type)]));
  }
  if (PB) out.problem = { kind:PB.ctx.kind, lens:PB.ctx.lens, form:PB.ctx.form, type:PB.prob.kind, done:!!PB.done, ok:PB.done ? PB.done.ok : null };
  return out;
};
window.__gtDebug = {
  answer(ok){
    if (!PB || PB.done) return false;
    const p = PB.prob;
    if (p.kind === 'choice'){ const i = ok ? p.correct : (p.correct + 1) % p.options.length; $('pCh').querySelectorAll('[data-i]')[i].click(); }
    else if (p.kind === 'num'){ $('pA').value = ok ? String(Math.round(p.ans * 1000) / 1000) : String(p.ans + 7); }
    else { $('pA').value = ok ? String(p.a) : String(p.a + 3); $('pB').value = String(p.b); }
    $('pOk').click(); return true;
  },
  next(){ const n = $('pNext'); if (n) n.click(); },
  setSelf(A, B, C){ const s = SELF(); s.A = A; s.B = B; if (C !== undefined) s.C = C; updateName(); dirty.panel = true; hudSig = ''; return s.name; },
  setRes(k, v){ if (S) S.res[k] = v; hudSig = ''; },
  mul(x){ DBG_MUL = x; },
  jump(days){ if (!S) return; let left = days; while (left > 0 && !S.over){ const d = Math.min(0.05, left); tick(d); left -= d; } dirty.panel = true; },
  spawnSign(kind){ if (S) spawnSign(kind); return SIGNS.length; },
  catchSign(){ const sg = SIGNS[SIGNS.length - 1]; if (sg) catchSign(sg); return !!sg; },
  signRel(){ const sg = SIGNS[SIGNS.length - 1]; return sg ? { x:Math.round(sg.x * MW), y:Math.round(sg.y * MH) } : null; },
  nodeRel(id){ const [x, y] = nxy(node(id)); return { x:Math.round(x), y:Math.round(y) }; },
  parse(s){ return parseNum(s); },
  forceWinter(){ if (S){ S.winter.start = S.day + 0.01; } },
  fossilNext(){ if (S){ S.nextFossil = S.day; } },
  setDay(d){ if (S) S.day = d; },
  state(){ return S; },
};

})();
</script>
